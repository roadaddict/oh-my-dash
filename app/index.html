<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Glassmorphism smart-home kiosk dashboard for wall-mounted tablets.">
<title>FLORA-HOME</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b9cff'/%3E%3Cstop offset='1' stop-color='%235eead4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='8' height='18' rx='3' fill='%230d0f12' opacity='.85'/%3E%3Crect x='17' y='7' width='8' height='8' rx='3' fill='%230d0f12' opacity='.85'/%3E%3Crect x='17' y='17' width='8' height='8' rx='3' fill='%230d0f12' opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@200;300;400;500;700&display=swap" rel="stylesheet">

<!-- @styles -->
</head>

<body>
<noscript>
  <div style="padding:24px;font-family:system-ui;color:#eef1f6">This dashboard needs JavaScript enabled.</div>
</noscript>

<!-- Ambient background (+ optional photo backdrop behind the glass) -->
<div class="bg" aria-hidden="true">
  <div class="bg-orbs"></div>
  <div class="bg-grid"></div>
  <div class="bg-photos" id="bgPhotos" hidden></div>
</div>
<div class="bg-noise" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- ===================== STATUS BAR (Module 5: network) ===================== -->
  <header class="statusbar" id="statusbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">FLORA-HOME</span>
      <span class="brand-date" id="brandDate"></span>
    </div>

    <nav class="screen-tabs" id="screenTabs" aria-label="Screens"></nav>

    <div class="status-chips">
      <!-- One chip: dot = connection + sync (green / amber / red), then latency; details on hover -->
      <div class="chip" id="netChip" role="status" aria-live="polite">
        <span class="dot tone-good" id="netDot"></span>
        <span class="ping-value" id="pingValue">— ms</span>
        <svg class="sparkline" id="pingSpark" viewBox="0 0 64 18" preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="chip-sub ping-extra" id="pingLoss"></span>
      </div>
    </div>

    <div class="status-actions">
      <button class="icon-btn" id="btnFullscreen" type="button" aria-label="Toggle fullscreen" data-icon="maximize"></button>
      <button class="icon-btn" id="btnEdit" type="button" aria-label="Edit layout" title="Edit layout (resize & swap widgets)" data-icon="dashboard"></button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Open settings" data-icon="sliders"></button>
    </div>
  </header>

  <!-- Screens are generated from LAYOUTS (see script). -->
  <main class="screens" id="screens"></main>

  <!-- Inside .app so expanded panels (z 60) stack above it despite the burn-in transform. -->
  <div class="scrim" id="scrim"></div>
</div>

<div class="night-veil" aria-hidden="true"></div>
<div class="night-clock" id="nightClock" aria-hidden="true"><b id="nightTime"></b><span id="nightDate"></span></div>

<!-- ===================== SETTINGS DRAWER ===================== -->
<aside class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
  <div class="settings-head">
    <div>
      <h2 id="settingsTitle">Dashboard settings</h2>
      <p id="settingsNote">Saved on this device. Overrides the built-in defaults.</p>
    </div>
    <button class="icon-btn" type="button" id="btnSettingsClose" aria-label="Close settings" data-icon="x"></button>
  </div>
  <form class="settings-body" id="settingsForm" autocomplete="off"></form>
  <div class="settings-foot">
    <button class="btn btn-ghost" type="button" id="btnSettingsReset">Reset</button>
    <button class="btn" type="button" id="btnSettingsCancel">Cancel</button>
    <button class="btn btn-primary" type="button" id="btnSettingsSave">Save &amp; reload</button>
  </div>
</aside>

<!-- @scripts -->
</body>
</html>
