const KB_ORIGINS = ['20% 30%', '80% 25%', '50% 80%', '30% 70%', '70% 60%', '50% 40%'];
/** glass: also keep a blurred twin clipped to the panels over it (see 66-glass.js); gridOf() finds them. */
function slideshow(host, { captions = true, glass = null } = {}, scope = GLOBAL_SCOPE) {
  const wrap = h('div', { class: 'slideshow' });
  const mk = () => {
    const img = h('div', { class: 'slide-img' }),
      fill = h('div', { class: 'slide-fill' });
    const el = h('div', { class: `slide fit-${cfg.PHOTO_FIT === 'contain' ? 'contain' : 'cover'}` }, cfg.PHOTO_FIT === 'contain' ? fill : null, img);
    wrap.append(el);
    return { el, img, fill };
  };
  const layers = [mk(), mk()];
  const cap = h('div', { class: 'slide-caption' });
  if (captions) wrap.append(cap);
  host.append(wrap);
  const twin = glass ? glassLayer(host, glass) : null;

  let items = [],
    idx = 0,
    front = 0,
    shown = false,
    fails = 0;
  function next() {
    if (!items.length || (shown && !isVisible(wrap))) return;
    const item = items[idx++ % items.length];
    const im = new Image();
    im.onload = () => {
      fails = 0;
      const back = layers[1 - front];
      const url = `url("${(item.url || item.src).replace(/"/g, '%22')}")`;
      back.img.style.backgroundImage = url;
      back.fill.style.backgroundImage = url;
      back.el.classList.remove('kb');
      void back.el.offsetWidth; // restart the Ken Burns animation
      const kb = cfg.PHOTO_KEN_BURNS ? { dur: `${cfg.PHOTO_INTERVAL_SEC + 4}s`, origin: KB_ORIGINS[idx % KB_ORIGINS.length] } : null;
      if (kb) {
        back.el.style.setProperty('--kb-dur', kb.dur);
        back.el.style.setProperty('--kb-origin', kb.origin);
        back.el.classList.add('kb');
      }
      twin?.show(im, kb); // same frame, same zoom: the blurred twin stays aligned
      back.el.classList.add('is-visible');
      layers[front].el.classList.remove('is-visible');
      front = 1 - front;
      cap.textContent = item.caption || '';
      shown = true;
    };
    im.onerror = () => {
      if (++fails < Math.min(items.length, 5)) scope.setTimeout(next, 300);

    photoUrl(item.src).then((u) => {
      item.url = u;
      im.src = u;
    });
  }
  scope.subscribe(photoFeed, (d) => {
    if (!d) return;
    const first = !items.length;
    items = d.items;
    if (first) next();
  });
  scope.setInterval(next, Math.max(5, cfg.PHOTO_INTERVAL_SEC) * 1000);
  return wrap;
}

/* ==========================================================================
   GLASS — the frosted look over photos, without a live blur.
   A live `backdrop-filter` re-blurs everything behind a panel every frame while
   the photo behind it moves (Ken Burns zoom, cross-fades) — the most expensive
   thing an old tablet's graphics chip can be asked to do. Instead, each photo is
   blurred ONCE, into a small copy (a few KB), shown in one layer right above the
   photo with the same zoom animation, and clipped to the panels' shapes. Moving
   a layer is nearly free; blurring is not.
   Over the plain dark background there's nothing to blur (the glass differs by at
   most 8/255 from the live blur there), so panels simply have no blur at all.
   ========================================================================== */
const GLASS_SCALE = 16; // the copy is 1/16 of the screen: scaling it up does most of the blurring

/** A small, blurred, slightly saturated copy of a loaded image, cropped like the slide shows it. */
function blurredCopy(img, w, h, fit) {
  const key = `${img.src}|${Math.round(w)}x${Math.round(h)}|${fit}`;
  if (glassCopies.has(key)) return glassCopies.get(key);
  let url = null;
  try {
    const c = document.createElement('canvas');
    c.width = Math.max(8, Math.round(w / GLASS_SCALE));
    c.height = Math.max(8, Math.round(h / GLASS_SCALE));

    const iw = img.naturalWidth,
      ih = img.naturalHeight;
    const draw = (mode) => {
      const s = mode === 'cover' ? Math.max(c.width / iw, c.height / ih) : Math.min(c.width / iw, c.height / ih);
      x.drawImage(img, (c.width - iw * s) / 2, (c.height - ih * s) / 2, iw * s, ih * s);

      draw('cover');
      x.filter = 'blur(1px) saturate(1.4)';
      draw('contain');

    url = null; // tainted canvas: the layer falls back to a CSS blur for this photo

/* ==========================================================================
   WIDGET HOST — mounts widget definitions and keeps each one in its own box.

   Every widget instance gets a ctx (see makeCtx). Everything it schedules through
   ctx — timers, the clock tick, event listeners, resize observers, feed
   subscriptions, frames — is:
     • guarded: an exception inside the callback fails *this* widget, which is
       replaced by an error card with a Retry button; the rest of the page runs on;
     • owned: removed automatically when the widget is unmounted (removed or
       changed in the layout editor, or after it failed);
     • metered: a widget that keeps the main thread busy (> 2.5 s of every 5 s,
       or thousands of callbacks a second) is stopped the same way.

    const i = parent.kids.indexOf(leaf);
    if (leaf.px != null) {
      leaf.px = Math.round(leaf.px / 2);
      fresh.px = leaf.px;
    } else if (leaf.auto) fresh.auto = true;
    else {
      leaf.fr = +((leaf.fr || 1) / 2).toFixed(3);
      fresh.fr = leaf.fr;
    }
    parent.kids.splice(i + 1, 0, fresh);
  } else {
    // Otherwise the widget becomes a two-way split of its own space.
    const size = sizeOf(leaf),
      inner = {
        dir,
        kids: [
          { ...withoutSize(leaf), fr: 1 },
          { ...fresh, fr: 1 },
        ],
      };
    Object.keys(leaf).forEach((k) => delete leaf[k]);
    Object.assign(leaf, inner, size);
  }
  saveLayout(
    def,
    (s) => {
      s.tree = t;
      (s.widgets ||= {})[id] = spec;
    },
    orient,
  );
}
function removeWidget(slot) {
  const grid = activeGrid(),
    def = screenDefs[currentIdx],
    { tree, orient } = grid._layout;
  if (leaves(tree).length < 2) {
    toast('A screen needs at least one widget');
    return;
  }
  const t = structuredClone(tree),
    leaf = leaves(t).find((l) => l.slot === slot),
    parent = parentOf(t, leaf);
  // Its space goes back to the widget before it (the one it was added next to), else the next one.
  const i = parent.kids.indexOf(leaf),
    next = parent.kids[i - 1] || parent.kids[i + 1];
  if (leaf.fr != null && next.fr != null) next.fr = +(next.fr + leaf.fr).toFixed(3);
  else if (leaf.px != null && next.px != null) next.px += leaf.px + (grid._layout.gap || 0);
  parent.kids.splice(i, 1);
  if (parent.kids.length === 1) {
    // A split with one child left collapses into that child (keeping the split's size).
    const only = parent.kids[0],
      size = sizeOf(parent);
    Object.keys(parent).forEach((k) => delete parent[k]);
    Object.assign(parent, withoutSize(only), size);
  }
  selected = null;
  saveLayout(
    def,
    (s) => {
      s.tree = t;
      // An added widget is forgotten once it's off this layout.
      if (!def.blocks?.[slot]) {
        delete s.widgets?.[slot];
        delete s.heads?.[slot];
      }
    },
    orient,
  );
}

/* ---------- Change widget: any widget from any screen ---------- */
/** Every widget used on any screen (with its settings), plus the ones no screen uses yet. */
function widgetCatalog() {
  const out = [],
    seen = new Set();
  for (const L of Object.values(LAYOUTS)) {
    for (const spec of Object.values(L.blocks || {})) {
      const k = JSON.stringify(spec);
      if (widgetDef(spec.type) && !seen.has(k)) {
        seen.add(k);
        out.push({ spec, where: L.name });
      }
    }
  }
  for (const d of REG.widgets.values()) if ((DEV || !d.hidden) && !out.some((o) => o.spec.type === d.id)) out.push({ spec: { type: d.id }, where: '' });
  return out;
}
/** The catalog by group (see WIDGET_GROUPS), then by widget name. */
function pickerGroups() {
  const all = widgetCatalog(),
    groups = new Map();
  for (const d of widgetList()) {
    const items = all.filter((o) => o.spec.type === d.id);
    if (items.length) groups.set(d.group, [...(groups.get(d.group) || []), ...items]);
  }
  return [...groups];
}
/** Pick a widget: to replace `slot`'s widget, or (with addDir) to add one next to it. */
function openPicker(slot, addDir = null, col = null) {
  const def = screenDefs[currentIdx],
    orig = slot && def.blocks?.[slot],
    cur = addDir ? '' : JSON.stringify(specFor(def, slot));
  const close = () => sheet.remove();
  const choose = (spec) => {
    close();
    if (col) {
      appendRow(col, spec);
      return;
    }
    if (addDir) {
      addWidget(slot, addDir, spec);
      return;
    }
    saveLayout(def, (s) => {
      s.widgets ||= {};
      if (orig && JSON.stringify(spec) === JSON.stringify(orig)) delete s.widgets[slot];
      else s.widgets[slot] = spec;
    });
  };
  const sheet = h(
    'div',
    { class: 'edit-picker', role: 'dialog', 'aria-label': 'Change widget' },
    h(
      'div',
      { class: 'edit-picker-card' },
      h(
        'div',
        { class: 'edit-picker-head' },
        h(
          'div',
          null,
          h('b', null, col ? 'Add a row' : addDir ? `Add a widget ${addDir === 'row' ? 'to the right' : 'below'}` : 'Change widget'),
          h(
            'small',
            null,
            col ? 'As a new row at the bottom of this column' : addDir ? `Next to ${specLabel(specFor(def, slot))}` : `Now: ${specLabel(JSON.parse(cur))}`,
          ),
        ),
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', onclick: close }, icon('x')),
      ),
      h(
        'div',
        { class: 'edit-picker-list' },
        pickerGroups().map(([name, items]) => [
          h('div', { class: 'edit-pick-group' }, name),
          items.map(({ spec, where }) =>
            h(
              'button',
              {
                type: 'button',
                class: `edit-pick${JSON.stringify(spec) === cur ? ' is-current' : ''}`,
                onclick: () => choose(spec),
              },
              icon(widgetDef(spec.type)?.icon || 'layout'),
              h('span', null, h('b', null, specLabel(spec)), h('small', null, where ? `as on ${where}` : 'not on any screen yet')),
            ),
          ),
        ]),
      ),
      !addDir && orig && JSON.stringify(orig) !== cur
        ? h('button', { class: 'btn', type: 'button', onclick: () => choose(orig) }, `Restore ${specLabel(orig)}`)
        : null,
    ),

  });

}
/** Back to the default for this screen, on this device, in this orientation. */
function resetLayout() {
  const def = screenDefs[currentIdx],
    o = layoutOrient(def);
  saveLayout(
    def,
    (s) => {
      Object.keys(s).forEach((k) => delete s[k]);
    },
    o,
  );
  toast(`${def.name} reset (${o}, this device)`);
}
/** Mount widgets whose spec changed, add new slots, drop slots this layout no longer has. */
function syncWidgets(def, grid) {
  const slots = slotsOf(def);
  for (const slot of slots) {
    const p = grid.querySelector(`:scope > [data-block="${CSS.escape(slot)}"]`);
    if (!p) grid.append(parkedNode(slot)); // new slot: layoutScreen mounts it if it's on screen
    else if (!p.classList.contains('is-parked') && p.dataset.spec !== JSON.stringify(specFor(def, slot))) mountWidget(def, grid, slot);
  }
  grid.querySelectorAll(':scope > [data-block]').forEach((p) => {
    if (!slots.includes(p.dataset.block)) {

      p.remove();

}
bus.addEventListener('layouts', () => {
  builtScreens.forEach((el, id) => {
    const def = screenDefs.find((d) => d.id === id),
      grid = el.querySelector(':scope > .grid');
    syncWidgets(def, grid);

window.addEventListener('resize', () => {

});

/* ---------- app/core/boot/84-network.js ---------- */
/* ==========================================================================
   MODULE 5 — NETWORK: navigator.onLine + latency ping
   ========================================================================== */
function initNetwork() {
  const pingChip = $('#netChip'),
    dot = $('#netDot'),
    pingValue = $('#pingValue'),
    spark = $('#pingSpark'),
    lossEl = $('#pingLoss');
  let statusText = '',
    latencyText = '';
  const samples = []; // ms | null (loss)
  const WINDOW = 30;
  let consecutiveFails = 0;
  const toneFor = (ms) => (ms == null ? 'tone-bad' : ms < cfg.PING_GOOD_MS ? 'tone-good' : ms <= cfg.PING_WARN_MS ? 'tone-warn' : 'tone-bad');
  const setTone = (el, tone) => {
    el.classList.remove('tone-good', 'tone-warn', 'tone-bad');
    if (tone) el.classList.add(tone);
  };

  /** The dot: connected and synced (green), cloud unreachable / not signed in (amber), offline (red). */
  function renderStatus() {
    if (!navigator.onLine) {
      setTone(dot, 'tone-bad');
      statusText = 'Offline';
    } else if (consecutiveFails >= 3) {
      setTone(dot, 'tone-warn');
      statusText = 'Cloud unreachable';
    } else if (sync.mode === 'denied') {
      setTone(dot, 'tone-warn');
      statusText = 'Online · not signed in, saving on this device only';
    } else if (sync.mode === 'offline') {
      setTone(dot, 'tone-warn');
      statusText = 'Online · sync unreachable, retrying';
    } else {
      setTone(dot, 'tone-good');
      statusText = sync.mode === 'cloud' ? 'Connected · synced with Cloudflare' : 'Connected';
    }
    pingChip.setAttribute('aria-label', statusText);
    updateNetTitle();
  }
  function renderPing() {
    const last = samples[samples.length - 1];
    if (!navigator.onLine) {
      setTone(pingChip, 'tone-bad');
      pingValue.textContent = 'Offline';
    } else if (last === undefined) {
      setTone(pingChip, null);
      pingValue.textContent = '… ms';
    } else if (last === null) {
      setTone(pingChip, 'tone-bad');
      pingValue.textContent = 'timeout';
    } else {
      setTone(pingChip, toneFor(last));
      pingValue.textContent = `${last} ms`;
    }

    const lost = samples.filter((s) => s == null).length;
    const ok = samples.filter((s) => s != null);
    lossEl.textContent = samples.length ? `${Math.round((lost / samples.length) * 100)}% loss` : '';
    if (ok.length) {
      const avg = Math.round(ok.reduce((a, b) => a + b, 0) / ok.length);
      const jitter = ok.length > 1 ? Math.round(ok.slice(1).reduce((a, v, i) => a + Math.abs(v - ok[i]), 0) / (ok.length - 1)) : 0;
      latencyText = `Latency to ${hostOf(PING_TARGET)} · avg ${avg} ms · min ${Math.min(...ok)} · max ${Math.max(...ok)} · jitter ${jitter} ms · loss ${lost}/${samples.length}`;
    }
    updateNetTitle();
    const W = 64,
      H = 18,
      n = WINDOW;
    const max = Math.max(cfg.PING_WARN_MS, ...ok);
    const pts = [],
      dots = [];
    samples.forEach((s, i) => {
      const x = (W * (i + n - samples.length)) / (n - 1);
      if (s == null) dots.push(`<circle cx="${x.toFixed(1)}" cy="${H - 1.5}" r="1.6"/>`);
      else pts.push(`${x.toFixed(1)},${(H - 1 - (Math.min(s, max) / max) * (H - 3)).toFixed(1)}`);
    });
    const area =
      pts.length > 1 ? `<polygon class="area" points="${pts[0].split(',')[0]},${H} ${pts.join(' ')} ${pts[pts.length - 1].split(',')[0]},${H}"/>` : '';
    spark.innerHTML = `${area}<polyline points="${pts.join(' ')}"/>${dots.join('')}`;
  }
  // Default target: this dashboard's own Worker (/api/ping) — answered at the nearest
  // Cloudflare edge, always reachable when the dashboard is, ~0.4 KB per probe.
  const PING_TARGET = cfg.PING_URL || (location.protocol === 'file:' ? 'https://www.gstatic.com/generate_204' : new URL(`${API}/ping`, location.href).href);
  const sameOriginPing = (() => {
    try {
      return new URL(PING_TARGET).origin === location.origin;
    } catch {
      return false;
    }
  })();
  async function measure() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), cfg.PING_TIMEOUT_MS);
    const url = `${PING_TARGET}${PING_TARGET.includes('?') ? '&' : '?'}_=${Date.now()}`;
    const t0 = performance.now();
    try {
      // Same origin: readable response + full Resource Timing. Elsewhere: opaque no-cors, wall time only.
      const res = await fetch(
        url,
        sameOriginPing ? { cache: 'no-store', signal: ctrl.signal } : { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: ctrl.signal },
      );
      if (sameOriginPing && !res.ok) return null;
      const wall = performance.now() - t0;
      // Network round trip only (request sent → first byte), excluding JS and queueing.
      const e = performance.getEntriesByName(url).pop();
      const rtt = e && e.responseStart > 0 && e.requestStart > 0 ? e.responseStart - e.requestStart : wall;
      return Math.max(1, Math.round(rtt));
    } catch {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }
  async function ping() {
    if (!navigator.onLine) {
      renderStatus();
      renderPing();
      return;
    }
    const ms = await measure();
    samples.push(ms);
    if (samples.length > WINDOW) samples.shift();
    consecutiveFails = ms == null ? consecutiveFails + 1 : 0;
    renderStatus();
    renderPing();
  }
  function updateNetTitle() {
    pingChip.title = [statusText, latencyText].filter(Boolean).join('\n');
  }
  every(15000, renderStatus); // sync state changes (signed out, sync unreachable) show up on the dot
  window.addEventListener('online', () => {
    renderStatus();
    frames.forEach((f) => f.onOnline());
    ping();
  });
  window.addEventListener('offline', () => {
    renderStatus();
    renderPing();
    frames.forEach((f) => f.onOffline());
  });
  renderStatus();
  renderPing();
  // Warm-up request (DNS + TLS handshake) is discarded so the first reading is honest.
  measure().finally(() => {
    ping();
    every(Math.max(2, cfg.PING_INTERVAL_SEC) * 1000, ping);
  });
}

/* ---------- app/core/boot/86-kiosk.js ---------- */
/* ==========================================================================
   KIOSK FEATURES — wake lock, fullscreen, idle cursor, burn-in, night mode…
   ========================================================================== */
function initKiosk() {
  initPowerMode();
  applyWidgetBg(cfg.WIDGET_BG);
  const rgb = hexToRgb(cfg.THEME_ACCENT);
  if (rgb) {
    document.documentElement.style.setProperty('--accent', cfg.THEME_ACCENT);
    document.documentElement.style.setProperty('--accent-rgb', rgb);
  }
  if (cfg.CUSTOM_CSS) document.head.append(h('style', { id: 'custom-css' }, cfg.CUSTOM_CSS));
  applyPhotoBg(cfg.PHOTO_BACKGROUND);
  onTick((n) => {
    if (n.getSeconds() === 0 || !$('#brandDate').textContent) $('#brandDate').textContent = `· ${fmtDateShort.format(n)}`;
  });

  // Screen Wake Lock
  let wakeLock = null;
  const requestWake = async () => {
    if (!cfg.KEEP_SCREEN_AWAKE || !('wakeLock' in navigator) || document.hidden) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch {
      /* not allowed / insecure context */
    }
  };
  requestWake();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (!wakeLock || wakeLock.released) requestWake();
    resumeVisible();
  });

  // Fullscreen toggle
  const fsBtn = $('#btnFullscreen');
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el)?.catch?.(() => {});
  });
  const syncFs = () => {
    fsBtn.dataset.icon = document.fullscreenElement || document.webkitFullscreenElement ? 'minimize' : 'maximize';
    hydrateIcons(fsBtn.parentElement);
  };
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);

  // Hide cursor when idle
  let idleTimer = 0;
  const wake = () => {
    document.body.classList.remove('is-idle');
    clearTimeout(idleTimer);
    if (cfg.HIDE_CURSOR_SEC > 0) idleTimer = setTimeout(() => document.body.classList.add('is-idle'), cfg.HIDE_CURSOR_SEC * 1000);
  };
  ['pointermove', 'pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, wake, { passive: true }));
  wake();

  // Burn-in protection: shift the whole layout a few pixels every 3 minutes.
  if (cfg.BURN_IN_SHIFT) {
    const offsets = [
      [0, 0],
      [2, 1],
      [-1, 2],
      [-2, -1],
      [1, -2],
      [2, -2],
      [-2, 1],
    ];
    let i = 0;
    every(180000, () => {
      i = (i + 1) % offsets.length;
      document.documentElement.style.setProperty('--shift-x', `${offsets[i][0]}px`);
      document.documentElement.style.setProperty('--shift-y', `${offsets[i][1]}px`);
      bus.dispatchEvent(new Event('shift'));
    });
  }

  // Night mode: dim / minimal clock / off (tap to wake for 60 s)
  const start = parseHM(cfg.NIGHT_MODE_START),
    end = parseHM(cfg.NIGHT_MODE_END);
  const nightClock = $('#nightClock'),
    nightTime = $('#nightTime'),
    nightDate = $('#nightDate');
  let tapWakeUntil = 0;
  const isNight = () => {
    if (start == null || end == null || start === end) return false;
    const m = minutesOfDay();
    return start < end ? m >= start && m < end : m >= start || m < end;
  };
  const applyNight = () => {
    const night = isNight() && Date.now() > tapWakeUntil;
    const style = cfg.NIGHT_MODE_STYLE;
    const veil = !night ? 0 : style === 'dim' ? 1 - Math.min(1, Math.max(0.05, cfg.NIGHT_BRIGHTNESS)) : 1;
    document.documentElement.style.setProperty('--night-veil', String(veil));
    nightClock.classList.toggle('is-on', night && style === 'clock');
    // Display dark ("off" / "clock"): pause photos, feeds and iframe refreshes.
    const dark = night && style !== 'dim';
    if (dark !== document.body.classList.contains('is-dark-night')) {
      document.body.classList.toggle('is-dark-night', dark);
      if (!dark) resumeVisible();
    }
  };
  onTick((n) => {
    if (nightClock.classList.contains('is-on')) {
      nightTime.textContent = timeStr(n);
      nightDate.textContent = fmtDateLong.format(n);
    }
  });
  window.addEventListener(
    'pointerdown',
    () => {
      if (isNight()) {
        tapWakeUntil = Date.now() + 60000;
        applyNight();
      }
    },
    { passive: true, capture: true },
  );
  applyNight();
  every(15000, applyNight);

  // Daily full reload (clears memory leaks from long-running embeds)
  const reloadAt = parseHM(cfg.DAILY_RELOAD_AT);
  const bootedAt = Date.now();
  if (reloadAt != null) {
    every(30000, () => {
      if (minutesOfDay() === reloadAt && Date.now() - bootedAt > 3600000 && canReload()) location.reload();
    });
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (editing) setEditing(false);
      setExpanded(null, false);
      closeSettings();
    }
    if (e.key === ',' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      openSettings();
    }
  });
}

/* ---------- Low-power mode: on, off, or automatic ----------
   Automatic: on right away for clearly weak hardware (2 cores or less, 1 GB or less);
   otherwise the first minute's frames are watched once the screen has settled, and a
   tablet that can't keep ~30 fps switches over. The verdict is remembered for a week. */
const POWER_KEY = 'omd.lowpower.auto';
function initPowerMode() {
  const v = String(cfg.LOW_POWER).trim().toLowerCase();
  const setting = ['true', '1', 'on', 'yes'].includes(v) ? true : ['false', '0', 'off', 'no'].includes(v) ? false : null;
  const on = (why) => {
    document.body.classList.add('low-power');
    document.body.dataset.power = why;
  };
  if (setting === true) return on('setting');
  if (setting === false) return;
  const weak = (navigator.hardwareConcurrency || 4) <= 2 || (navigator.deviceMemory != null && navigator.deviceMemory <= 1);
  if (weak) return on('auto');
  let saved = null;
  try {
    saved = JSON.parse(store.get(POWER_KEY) || 'null');
  } catch {
    /* ignore */
  }
  if (saved && Date.now() - saved.at < 7 * 864e5) {
    if (saved.low) on('auto');
    return;
  }
  // Watch 5 s of frames, 20 s after startup (the first screen has settled by then).
  setTimeout(() => {
    if (document.hidden) return;
    const gaps = [];
    let first = 0,
      last = 0;
    const frame = (t) => {
      if (last) gaps.push(t - last);
      else first = t;
      last = t;
      if (t - first < 5000) requestAnimationFrame(frame);
      else decide();
    };
    const decide = () => {
      if (gaps.length < 20 || document.hidden) return;
      const sorted = [...gaps].sort((a, b) => a - b);
      const median = sorted[Math.floor(sorted.length / 2)],
        janky = gaps.filter((g) => g > 50).length / gaps.length;
      const low = median > 34 || janky > 0.25;
      store.set(POWER_KEY, JSON.stringify({ at: Date.now(), low, median: Math.round(median), janky: +janky.toFixed(2) }));
      if (low) on('auto');
    };
    requestAnimationFrame(frame);
  }, 20000);
}

/* ---------- app/core/boot/87-offline.js ---------- */
/* ==========================================================================
   OFFLINE — the service worker (app/sw.js) keeps a copy of this page and its
   fonts, so a reload or a power cut during an internet outage still brings the
   dashboard up. Widgets show their last good data meanwhile (see createFeed).
   ?nosw=1 removes the service worker and its copies from this device.
   ========================================================================== */
const OFFLINE_CAPABLE = 'serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol);
function initOffline() {
  if (!OFFLINE_CAPABLE) return;
  if (/[?&]nosw=1/.test(location.search)) {
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    caches.keys().then((keys) => keys.filter((k) => k.startsWith('omd-') && !k.startsWith('omd-photos')).forEach((k) => caches.delete(k)));
    return;
  }
  // After the first screen is up, so installing never competes with startup.
  const register = () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Offline copy unavailable:', e.message));
  if (document.readyState === 'complete') setTimeout(register, 2000);
  else window.addEventListener('load', () => setTimeout(register, 2000), { once: true });
}
/** A reload is safe when online, or when the offline copy will answer it. */
const canReload = () => navigator.onLine || !!navigator.serviceWorker?.controller;

/* ---------- app/core/boot/88-perf.js ---------- */
/* ==========================================================================
   PERF OVERLAY — open the dashboard with ?perf=1 to see, on the tablet itself:
     fps     frames drawn per second (the overlay counts frames only while shown)
     jank    frames that took longer than 50 ms, in the last 10 s
     lag     how late a 500 ms timer fired (the main thread was busy) — worst in 10 s
     boot    ms from navigation until the first screen was mounted
     nodes   elements on the page · heap: JS memory (Chrome only)
     req     network requests in the last minute
   Works in every browser (Safari has no long-task API, so lag is measured with a timer).
   ========================================================================== */
function initPerfOverlay() {
  if (!/[?&]perf=1/.test(location.search)) return;
  const hud = h('div', { class: 'perf-hud', 'aria-hidden': 'true' });
  document.body.append(hud);
  const frames = [],
    lags = [],
    reqs = [];
  let last = performance.now();
  const frame = (t) => {
    frames.push([t, t - last]);
    last = t;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  let expected = performance.now() + 500;
  setInterval(() => {
    const now = performance.now();
    lags.push([now, Math.max(0, now - expected)]);
    expected = now + 500;
  }, 500);
  try {
    new PerformanceObserver((l) => l.getEntries().forEach((e) => reqs.push(e.startTime))).observe({ type: 'resource', buffered: true });
  } catch {
    /* old browser */
  }
  const boot = Math.round(performance.getEntriesByName('omd:ready')[0]?.startTime ?? 0);
  const row = (k, v, bad) => h('div', { class: bad ? 'bad' : null }, h('b', null, k), ` ${v}`);
  setInterval(() => {
    const now = performance.now();
    const trim = (a, ms) => {
      while (a.length && (a[0][0] ?? a[0]) < now - ms) a.shift();
    };
    trim(frames, 10000);
    trim(lags, 10000);
    trim(reqs, 60000);
    const fps = frames.filter(([t]) => t > now - 1000).length;
    const jank = frames.filter(([, d]) => d > 50).length;
    const lag = Math.round(Math.max(0, ...lags.map(([, l]) => l)));
    const heap = performance.memory ? `${(performance.memory.usedJSHeapSize / 1e6).toFixed(1)} MB` : '—';
    hud.replaceChildren(
      row('fps', fps, fps < 30),
      row('jank', jank, jank > 3),
      row('lag', `${lag} ms`, lag > 100),
      row('boot', `${boot} ms`, boot > 1500),
      row('nodes', document.getElementsByTagName('*').length),
      row('heap', heap),
      row('req', `${reqs.length}/min`),
      row(
        'mode',
        [
          document.body.classList.contains('low-power') ? `low-power${document.body.dataset.power === 'auto' ? ' (auto)' : ''}` : 'full',
          navigator.onLine ? 'online' : 'offline',
        ].join(' · '),
      ),
    );
  }, 1000);
}

/* ---------- app/core/boot/89-snapshot.js ---------- */
/* ==========================================================================
   SNAPSHOT — a picture of the screen, for an instant start next time.
   Every few minutes (and when the page is hidden or closed) the active screen is
   saved as plain HTML; app/core/snapshot.js puts it back on the next load, before
   any code runs, so an old tablet shows the dashboard at once instead of after a
   second or two of starting up. The live screen replaces it as soon as it's ready.
   Not saved: embedded pages (iframes), photos held in memory, ids and anything
   interactive — it's a picture, nothing more. ?nosnap=1 turns it off.
   ========================================================================== */
const SNAP_KEY = 'omd.snapshot.v1',
  SNAP_MAX_BYTES = 1.5e6;
const BUILD_ID = $('meta[name="omd-build"]')?.content || '';
function snapshotHtml(screenEl) {
  const copy = screenEl.cloneNode(true);
  copy.classList.add('is-snapshot');
  copy.setAttribute('aria-hidden', 'true');
  copy.removeAttribute('style');
  copy.querySelectorAll('iframe, video, audio, script, .perf-hud').forEach((n) => n.remove());
  copy.querySelectorAll('img').forEach((img) => {
    if (!/^(https?:|data:)/.test(img.getAttribute('src') || '')) img.remove();
  });
  copy.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
  copy.querySelectorAll('[style*="blob:"]').forEach((n) => n.style.removeProperty('background-image'));
  return copy.outerHTML;
}
function saveSnapshot() {
  const def = screenDefs[currentIdx],
    el = def && builtScreens.get(def.id);
  if (!el || !BUILD_ID || VIEW || editing || app.classList.contains('view-phone')) return;
  if (document.querySelector('.panel.is-expanded') || document.body.classList.contains('is-dark-night')) return;
  const html = snapshotHtml(el);
  if (html.length > SNAP_MAX_BYTES) return store.remove(SNAP_KEY);
  const tabs = tabsHost.hidden ? '' : tabsHost.innerHTML;
  if (!store.set(SNAP_KEY, JSON.stringify({ build: BUILD_ID, screen: def.id, w: innerWidth, h: innerHeight, at: Date.now(), html, tabs })))
    store.remove(SNAP_KEY);
}
/** Swap the picture for the live screen (called once the first screen is mounted). */
function dropSnapshot() {
  const snaps = document.querySelectorAll('.screen.is-snapshot');
  if (!snaps.length) return;
  snaps.forEach((n) => n.remove());
  // The live screen appeared in place of an identical picture: no fade-in this once.
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('from-snapshot')));
}
function initSnapshots() {
  if (/[?&]nosnap=1/.test(location.search)) return store.remove(SNAP_KEY);
  const later = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 5000 }) : setTimeout(fn, 200));
  // First once the data has had time to arrive, then every 10 minutes.
  setTimeout(() => later(saveSnapshot), 20000);
  every(10 * 60000, () => later(saveSnapshot));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveSnapshot();
  });
  window.addEventListener('pagehide', saveSnapshot);
}

    ...CORE_SECTIONS.map(([legend, ic, fields]) => ({ legend, ic, fields: dedupe(fields), def: null })),

  const group = (title, sub, kids) => h('section', { class: 'settings-group' }, h('h3', null, title, h('small', null, sub)), kids);
  const sections = settingsSections();
  const retired = RETIRED_SECRET_KEYS.filter((k) => saved[k]);
  form.replaceChildren(
    retired.length
      ? h(
          'div',
          { class: 'settings-top', role: 'note' },
          h(
            'small',
            null,
            `${retired.join(', ')} ${retired.length > 1 ? 'are' : 'is'} still in the saved settings, where every signed-in screen can read ${retired.length > 1 ? 'them' : 'it'}. API keys are Worker secrets now (README → Secrets): add ${retired.length > 1 ? 'them' : 'it'} there, then Save here to remove ${retired.length > 1 ? 'them' : 'it'} from the settings.`,
          ),
        )
      : '',
    backgroundField(),
    group('System', 'Screens, status bar, location and the tablet itself', sections.filter((s) => !s.def).map(section)),
    group('Data & accounts', 'Sign-ins, data usage, backups', [
      accountsSection(),
      usageSection(),
      backupSection(),
      h(
        'details',
        null,
        h('summary', null, icon('link'), 'Make it permanent'),
        h(
          'div',
          { class: 'group' },
          h(
            'label',
            { class: 'field' },
            h('span', null, 'Saved overrides — paste into OMD.configure({ defaults: … }) in app/config.js to bake them in'),
            h('textarea', { readonly: true, rows: 6 }, JSON.stringify(saved, null, 2)),
          ),
        ),
      ),
    ]),
    group('Widgets', 'What each widget shows', sections.filter((s) => s.def).map(section)),
  );
}
function openSettings(focusKey) {
  buildSettings();
  updateSyncNote();
  settingsEl.classList.add('is-open');
  settingsEl.setAttribute('aria-hidden', 'false');
  scrim.classList.add('is-visible');
  setTimeout(() => {
    const el = focusKey ? form.elements[focusKey] : $('#btnSettingsClose');
    el?.closest('details')?.setAttribute('open', '');
    el?.focus();
  }, 250);
}
function closeSettings() {
  if (!settingsEl.classList.contains('is-open')) return;
  settingsEl.classList.remove('is-open');
  settingsEl.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('settings-peek');
  applyWidgetBg(cfg.WIDGET_BG); // an unsaved preview goes back
  applyPhotoBg(cfg.PHOTO_BACKGROUND);
  if (!document.querySelector('.panel.is-expanded')) scrim.classList.remove('is-visible');
}
function saveSettings() {
  const next = {};
  for (const key of Object.keys(CONFIG)) {
    const el = form.elements[key];
    if (!el) {
      if (key in saved) next[key] = saved[key];
      continue;
    }
    const value = coerce(el.type === 'checkbox' ? el.checked : el.value, CONFIG[key]);
    if (JSON.stringify(value) !== JSON.stringify(CONFIG[key])) next[key] = value;
  }
  persistSettings(next);
}
/** Local mode: localStorage. Cloud mode: shared D1 row → every screen reloads with it. */
async function persistSettings(next) {
  if (!sync.cloud) {
    store.set(STORE_KEY, JSON.stringify(next));
    location.reload();
    return;
  }
  window.__omdSavingConfig = true;
  const btn = $('#btnSettingsSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  let rev = sync.items.config?.rev ?? 0;
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const r = await api('/state/config', { method: 'PUT', body: JSON.stringify({ rev, value: next }) });
      if (r.ok) {
        location.reload();
        return;
      }
      const j = await r.json().catch(() => ({}));
      if (r.status === 409) {
        rev = j.rev;
        continue;
      } // settings are last-write-wins
      throw new Error(j.hint || j.error || `HTTP ${r.status}`);
    }
    throw new Error('too many concurrent edits, try again');
  } catch (e) {
    alert(`Could not save settings to the cloud: ${e.message}`);
  }
  window.__omdSavingConfig = false;
  btn.disabled = false;
  btn.textContent = 'Save & reload';
}
const SYNC_NOTES = {
  cloud: 'Synced via Cloudflare — changes apply to every screen in the family.',
  offline: 'Cloud sync unreachable — showing the last synced settings. Changes will not save until it is back.',
  denied: 'Not signed in to the sync API — settings and lists are saved on this device only.',
  local: 'Saved on this device. Overrides the built-in defaults.',
};
const updateSyncNote = () => {
  $('#settingsNote').textContent = SYNC_NOTES[sync.mode] || SYNC_NOTES.local;
};
$('#btnSettings').addEventListener('click', () => openSettings());
$('#btnSettingsClose').addEventListener('click', closeSettings);
$('#btnSettingsCancel').addEventListener('click', closeSettings);
$('#btnSettingsSave').addEventListener('click', saveSettings);
$('#btnSettingsReset').addEventListener('click', () => {
  const where = sync.cloud ? 'shared (all screens)' : 'on-device';
  if (!confirm(`Reset all ${where} settings to the defaults? (Lists, chores and notes are kept.)`)) return;
  if (sync.cloud) persistSettings({});
  else {
    store.remove(STORE_KEY);
    location.reload();
  }
});
form.addEventListener('submit', (e) => {
  e.preventDefault();
  saveSettings();
});
scrim.addEventListener('click', () => {
  setExpanded(null, false);
  closeSettings();
});

/* ---------- Dashboard name: ⚙ → Status bar, or tap it in the status bar while editing the layout ---------- */
const brandName = $('.brand-name');
const dashName = () => String(cfg.DASHBOARD_NAME || '').trim() || CORE_DEFAULTS.DASHBOARD_NAME;
function applyName() {
  brandName.textContent = dashName();
  if (VIEW !== 'lists') document.title = dashName();
}
/** Save one setting without reloading this screen (the other screens reload as usual). */
async function saveConfigValue(key, value) {
  const next = { ...saved };
  if (JSON.stringify(value) === JSON.stringify(CONFIG[key])) delete next[key];
  else next[key] = value;
  if (!sync.cloud) {
    store.set(STORE_KEY, JSON.stringify(next));
    saved = next;
    return;
  }
  window.__omdSavingConfig = true;
  try {
    let rev = sync.items.config?.rev ?? 0;
    for (let attempt = 0; attempt < 4; attempt++) {
      const r = await api('/state/config', { method: 'PUT', body: JSON.stringify({ rev, value: next }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        sync.items.config = { rev: j.rev, value: next };
        saveSyncCache();
        saved = next;
        return;
      }
      if (r.status !== 409) throw new Error(j.hint || j.error || `HTTP ${r.status}`);
      rev = j.rev; // settings are last-write-wins
    }
    throw new Error('too many concurrent edits, try again');
  } finally {
    window.__omdSavingConfig = false;
  }
}
brandName.addEventListener('click', () => {
  if (!editing) return;
  const input = h('input', { class: 'brand-input', type: 'text', value: dashName(), maxlength: 40, 'aria-label': 'Dashboard name', enterkeyhint: 'done' });
  let done = false;
  const finish = async (keep) => {
    if (done) return;
    done = true;
    const v = input.value.trim().replace(/\s+/g, ' ');
    input.replaceWith(brandName);
    if (!keep || !v || v === dashName()) return;
    const before = cfg.DASHBOARD_NAME;
    cfg.DASHBOARD_NAME = v;
    applyName();
    try {
      await saveConfigValue('DASHBOARD_NAME', v);
      toast(`Renamed to ${v}`);
    } catch (e) {
      cfg.DASHBOARD_NAME = before;
      applyName();
      toast(`Could not save the name: ${e.message}`);
    }
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
  brandName.replaceWith(input);
  input.focus();
  input.select();
});

function initPhoneLists() {
  app.classList.add('view-phone');

  screensHost.replaceChildren(h('section', { class: 'screen is-active', 'data-screen': 'lists' }, h('div', { class: 'grid' }, mountSpec({ type: 'lists' }))));
  hydrateIcons(screensHost);
}
const VIEW = new URLSearchParams(location.search).get('view');
hydrateIcons();
// Back from an account sign-in (?spotify=connected / ?aqara=…): drop the marker from the address.
{
  const q = new URLSearchParams(location.search);
  const back = ['spotify', 'aqara', 'strava'].filter((k) => q.has(k));
  if (back.length) {
    back.forEach((k) => {
      if (q.get(k) !== 'connected') console.warn(`${k} sign-in: ${q.get(k)}`);
      q.delete(k);
    });
    history.replaceState(null, '', `${location.pathname}${q.toString() ? `?${q}` : ''}${location.hash}`);
  }
}
applyName();
if (VIEW === 'lists') initPhoneLists();
else {
  initKiosk();
  initNetwork();
  initScreens();
  dropSnapshot();
  initSnapshots();
}
performance.mark('omd:ready');
initOffline();
initPerfOverlay();

})();
