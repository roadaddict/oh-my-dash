<script data-widget="planes">
OMD._load("planes", function () {
/**
 * Planes overhead — live ADS-B positions (adsb.fi, adsb.lol) on a little radar, with
 * routes from adsbdb. Position feeds send no CORS headers, so this needs the proxy
 * (the Worker's /api/proxy, or CORS_PROXY). Centred on LATITUDE / LONGITUDE.
 */
const toRad = (d) => (d * Math.PI) / 180;
function distBearing(lat1, lon1, lat2, lon2) {
  const dLat = toRad(lat2 - lat1),
    dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  const km = 12742 * Math.asin(Math.min(1, Math.sqrt(a)));
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
  return { km, bearing: ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360 };
}

// Flight routes (airline, origin → destination) — adsbdb.com, CORS-enabled, cached per callsign.
const routeCache = new Map();
async function lookupRoute(callsign, fetchJSON) {
  const hit = routeCache.get(callsign);
  if (hit && Date.now() - hit.at < 6 * 3600e3) return hit.route;
  routeCache.set(callsign, { at: Date.now(), route: hit?.route ?? null });
  try {
    const j = await fetchJSON(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`);
    const r = j?.response?.flightroute;
    const place = (x) => (x ? `${x.municipality || x.name} (${x.iata_code || x.icao_code})` : '');
    const route = r ? { airline: r.airline?.name, from: place(r.origin), to: place(r.destination) } : null;
    routeCache.set(callsign, { at: Date.now(), route });
    return route;
  } catch {
    return null;
  }
}

OMD.defineWidget({
  id: 'planes',
  name: 'Planes overhead',
  icon: 'plane',
  group: 'Getting around',
  settings: [
    [
      ['PLANES_RADIUS_KM', 'Radius (km)', 'number', { min: 2, max: 250 }],
      ['PLANES_MAX', 'Aircraft listed', 'number', { min: 1, max: 30 }],
    ],
    [
      ['PLANES_MIN_ALT_M', 'Hide below (m)', 'number', { min: 0 }],
      ['PLANES_REFRESH_SEC', 'Refresh (s)', 'number', { min: 5 }],
    ],
  ],
  defaults: {
    PLANES_RADIUS_KM: 25,
    PLANES_MAX: 8, // Aircraft listed (closest first)
    PLANES_MIN_ALT_M: 0, // Hide aircraft below this altitude in metres (ground traffic is always hidden)
    PLANES_REFRESH_SEC: 15,
  },

  mount(ctx) {
    const { h, icon, settings: s } = ctx;
    const planesFeed = ctx.sharedFeed(
      'aircraft',
      () => async () => {
        const lat = s.LATITUDE,
          lon = s.LONGITUDE;
        const nm = Math.max(1, Math.min(250, s.PLANES_RADIUS_KM / 1.852)).toFixed(1);
        const sources = [`https://opendata.adsb.fi/api/v2/lat/${lat}/lon/${lon}/dist/${nm}`, `https://api.adsb.lol/v2/lat/${lat}/lon/${lon}/dist/${nm}`];
        if (!ctx.hasProxy) throw new Error('needs-proxy');
        let data, lastErr;
        for (const u of sources) {
          try {
            data = await ctx.fetchJSON(ctx.withProxy(u, 5));
            break;
          } catch (e) {
            lastErr = e;
          }
        }
        if (!data) throw lastErr;
        return (data.aircraft || data.ac || [])
          .filter((a) => a.lat != null && a.lon != null && a.alt_baro !== 'ground' && (a.alt_baro ?? a.alt_geom ?? 0) * 0.3048 >= s.PLANES_MIN_ALT_M)
          .map((a) => ({
            hex: a.hex,
            callsign: (a.flight || '').trim(),
            reg: a.r,
            type: a.t,
            desc: a.desc,
            operator: a.ownOp,
            alt: a.alt_baro ?? a.alt_geom,
            gs: a.gs,
            track: a.track ?? a.true_heading ?? a.mag_heading ?? 0,
            rate: a.baro_rate ?? a.geom_rate ?? 0,
            ...distBearing(lat, lon, a.lat, a.lon),
          }))
          .filter((p) => p.km <= s.PLANES_RADIUS_KM)
          .sort((a, b) => a.km - b.km);
      },
      Math.max(5, s.PLANES_REFRESH_SEC) * 1000,
      { visibleOnly: true, persist: false }, // positions are only true for a few seconds
    );

    const p = ctx.panel({ title: 'Overhead', tint: 'sky' });
    const radar = h('div', { class: 'radar' });
    const list = h('div', { class: 'rows scroll-y' });
    p.body.append(h('div', { class: 'planes' }, radar, list));
    const miles = ctx.imperial;
    const distText = (km) => (miles ? `${(km * 0.621).toFixed(1)} mi` : `${km < 10 ? km.toFixed(1) : Math.round(km)} km`);
    const speedText = (kt) => (kt == null ? '' : miles ? `${Math.round(kt * 1.151)} mph` : `${Math.round(kt * 1.852)} km/h`);
    // ADS-B reports feet; shown in metres unless imperial units are selected.
    const altColor = (ft) => (ft * 0.3048 < 3000 ? 'var(--amber)' : ft * 0.3048 < 7500 ? 'var(--cyan)' : 'var(--violet)');
    const altText = (ft) =>
      miles ? `${Math.round(ft).toLocaleString(ctx.locale)} ft` : `${(Math.round((ft * 0.3048) / 10) * 10).toLocaleString(ctx.locale)} m`;
    let planes = [];

    function drawRadar() {
      const R = 92,
        max = s.PLANES_RADIUS_KM;
      const rings = [1 / 3, 2 / 3, 1].map((f) => `<circle class="ring" r="${(R * f).toFixed(1)}"/>`).join('');
      const ringLabel = `<text class="rl" x="3" y="${-R + 9}">${distText(max)}</text>`;
      const marks = planes
        .map((pl, i) => {
          const r = (Math.min(pl.km, max) / max) * R;
          const x = r * Math.sin(toRad(pl.bearing)),
            y = -r * Math.cos(toRad(pl.bearing));
          const near = pl.km < 3;
          const label = i < 3 ? `<text class="pl" x="${(x + 7).toFixed(1)}" y="${(y + 3).toFixed(1)}">${pl.callsign || pl.type || ''}</text>` : '';
          return `${near ? `<circle class="near" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9"/>` : ''}
          <path class="ac" d="M0,-6 L4.5,5 L0,2.8 L-4.5,5 Z" fill="${altColor(pl.alt)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${Math.round(pl.track)})"/>${label}`;
        })
        .join('');
      radar.innerHTML = `<svg viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet" aria-label="Radar of nearby aircraft">
        <defs><radialGradient id="radarBg"><stop offset="0" stop-color="rgba(125,211,252,.10)"/><stop offset="1" stop-color="rgba(125,211,252,.02)"/></radialGradient></defs>
        <circle r="${R}" fill="url(#radarBg)"/>${rings}
        <line class="ax" x1="${-R}" y1="0" x2="${R}" y2="0"/><line class="ax" x1="0" y1="${-R}" x2="0" y2="${R}"/>
        <g class="sweep"><path d="M0,0 L0,${-R} A${R},${R} 0 0 1 ${(R * Math.sin(toRad(40))).toFixed(1)},${(-R * Math.cos(toRad(40))).toFixed(1)} Z"/></g>
        <text class="n" x="0" y="${-R - 2}">N</text>${ringLabel}
        <circle class="home" r="3"/>${marks}</svg>`;
    }
    function renderList() {
      if (!planes.length) {
        list.replaceChildren(h('div', { class: 'empty' }, icon('plane'), `No aircraft within ${distText(s.PLANES_RADIUS_KM)} right now`));
        return;
      }
      list.replaceChildren(
        ...planes.slice(0, s.PLANES_MAX).map((pl) => {
          const route = pl.callsign ? routeCache.get(pl.callsign)?.route : null;
          const arrow = pl.rate > 300 ? '↑' : pl.rate < -300 ? '↓' : '';
          const what = [route?.airline || pl.operator, pl.desc || pl.type].filter(Boolean).join(' · ');
          return h(
            'div',
            { class: `plane${pl.km < 3 ? ' is-near' : ''}`, style: { '--c': altColor(pl.alt) } },
            h('span', { class: 'plane-ic' }, icon('plane')),
            h(
              'div',
              { style: { minWidth: '0' } },
              h(
                'div',
                { class: 'plane-title' },
                h('b', null, pl.callsign || pl.reg || pl.hex.toUpperCase()),
                route?.from ? h('span', null, ` ${route.from} → ${route.to}`) : null,
              ),
              h('div', { class: 'plane-sub' }, what || pl.reg || '—'),
            ),
            h('div', { class: 'plane-num' }, h('b', null, `${arrow}${altText(pl.alt)}`), h('small', null, `${distText(pl.km)} · ${speedText(pl.gs)}`)),
          );
        }),
      );
    }
    ctx.subscribe(planesFeed, async (d, err) => {
      if (!d) {
        if (err) {
          const msg = err.message === 'needs-proxy' ? 'Live flight data needs the Cloudflare backend (or CORS_PROXY).' : 'Flight data unavailable — retrying';
          radar.replaceChildren();
          list.replaceChildren(h('div', { class: 'empty' }, icon('plane'), msg));
        }
        return;
      }
      planes = d;
      const near = planes.filter((x) => x.km < 3).length;
      p.setMeta(`${planes.length} within ${distText(s.PLANES_RADIUS_KM)}${near ? ` · ${near} overhead` : ''}`);
      drawRadar();
      renderList();
      // Resolve routes for the closest few (politely: at most 3 new lookups per refresh).
      const todo = planes
        .slice(0, s.PLANES_MAX)
        .filter((x) => x.callsign && !routeCache.has(x.callsign))
        .slice(0, 3);
      if (todo.length) {
        await Promise.all(todo.map((x) => lookupRoute(x.callsign, ctx.fetchJSON)));
        renderList();
      }
    });
    p.onReload = () => planesFeed.refresh();
  },
});

});
</script>

<script data-widget="smarthome">
OMD._load("smarthome", function () {
/**
 * Smart home — Aqara sensors through the backend (lib/integrations/aqara.js) next to outdoor
 * air quality (EAQI, PM2.5 for LATITUDE/LONGITUDE). Or any iframe-able dashboard
 * (Home Assistant, SharpTools…), which takes precedence. Otherwise: demo tiles.
 */
OMD.defineWidget({
  id: 'smarthome',
  name: 'Smart home',
  icon: 'home',
  group: 'Home & web',
  integrations: ['aqara'],
  settings: [
    ['AQARA_REFRESH_SEC', 'Aqara sensors refresh (s)', 'number', { min: 30 }],
    ['SMART_HOME_URL', 'Or: smart home dashboard URL (iframe)', 'url', { placeholder: 'https://…', help: 'Takes precedence over Aqara tiles when set.' }],
    [
      ['SMART_HOME_ZOOM', 'Zoom', 'number', { step: 0.05, min: 0.25, max: 3 }],
      ['SMART_HOME_REFRESH_MIN', 'Refresh (min)', 'number', { min: 0 }],
    ],
  ],
  defaults: {
    AQARA_REFRESH_SEC: 60,
    SMART_HOME_URL: '',
    SMART_HOME_ZOOM: 1,
    SMART_HOME_REFRESH_MIN: 0,
  },

  mount(ctx) {
    const { h, icon, fmt, settings } = ctx;
    const p = ctx.panel({ title: 'Home', tint: 'amber', meta: 'Sensors' });
    if (settings.SMART_HOME_URL) {
      p.setMeta(ctx.util.hostOf(settings.SMART_HOME_URL) || 'Cloud hub');
      const frame = ctx.ui.frame(p.body, {
        url: settings.SMART_HOME_URL,
        title: 'Smart home',
        zoom: settings.SMART_HOME_ZOOM,
        refreshMin: settings.SMART_HOME_REFRESH_MIN,
        allow: 'fullscreen',
      });
      p.reloadable(frame.reload);
      return;
    }
    p.body.classList.add('tiles-host');
    // Longer timeout: a cold Worker cache makes several Aqara calls in a row.
    const aqaraFeed = ctx.sharedFeed('aqara', () => () => ctx.api('aqara/sensors', { timeout: 20000 }), Math.max(30, settings.AQARA_REFRESH_SEC) * 1000, {
      visibleOnly: true,
    });
    /* Outdoor air quality (Open-Meteo / Copernicus CAMS, no key), shown with the smart-home sensors.
       It changes hourly, so one small request every 30 min, only while the panel is on screen. */
    const airFeed = ctx.sharedFeed(
      'air',
      () => () =>
        ctx.fetchJSON(
          `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${settings.LATITUDE}&longitude=${settings.LONGITUDE}&current=european_aqi,pm2_5`,
        ),
      30 * 60000,
      { visibleOnly: true },
    );

    /** 2 = needs attention (open door, leak), 1 = activity (motion), 0 = normal. */
    const sensorAlert = (s) => (s.readings.contact?.value === 'open' || s.readings.leak?.value ? 2 : s.readings.motion?.value ? 1 : 0);
    /** One sensor → the same .tile markup the demo and data widgets use. */
    function sensorTile(s) {
      const r = s.readings;
      let ic = 'gauge',
        color = 'c-violet',
        value = '—',
        on = false;
      if (r.contact) {
        on = r.contact.value === 'open';
        ic = on ? 'door-open' : 'door-closed';
        color = on ? 'c-crimson' : 'c-emerald';
        value = on ? 'Open' : 'Closed';
      } else if (r.leak) {
        on = !!r.leak.value;
        ic = 'droplet';
        color = on ? 'c-crimson' : 'c-sky';
        value = on ? 'Leak!' : 'Dry';
      } else if (r.motion) {
        on = !!r.motion.value;
        ic = 'person-standing';
        color = 'c-amber';
        value = on ? 'Motion' : ['Clear', s.updated ? h('small', null, fmt.timeAgo(new Date(s.updated))) : null];
      } else if (r.temperature) {
        ic = 'thermometer';
        color = 'c-accent';
        value = [fmt.temp(r.temperature.value), r.humidity ? h('small', null, `${Math.round(r.humidity.value)}%`) : null];
      } else if (r.humidity) {
        ic = 'droplet';
        color = 'c-sky';
        value = `${Math.round(r.humidity.value)}%`;
      } else if (r.illuminance) {
        ic = 'sun';
        color = 'c-amber';
        value = `${r.illuminance.value} lx`;
      } else if (r.pressure) {
        value = `${r.pressure.value} hPa`;
      }
      const low = r.battery && r.battery.value <= 15;
      return h(
        'div',
        {
          class: `tile ${color}${on ? ' is-on' : ''}${s.online ? '' : ' is-offline'}`,
          title: [s.room, s.name, r.battery && `battery ${r.battery.value}%`, s.updated && `updated ${fmt.timeAgo(new Date(s.updated))}`]
            .filter(Boolean)
            .join(' · '),
        },
        h('span', { class: 'tile-icon' }, icon(ic)),
        h(
          'span',
          { class: 'tile-text' },
          h('div', { class: 'tile-label' }, low ? h('span', { class: 'tile-warn', title: `Battery ${r.battery.value}%` }, icon('battery-low')) : null, s.name),
          h('div', { class: 'tile-value' }, s.online ? value : 'Offline'),
        ),
      );
    }

    // European Air Quality Index bands; PM2.5 uses the same bands' µg/m³ limits.
    const AQI_BANDS = [
      [20, 'Good', 'c-emerald'],
      [40, 'Fair', 'c-emerald'],
      [60, 'Moderate', 'c-amber'],
      [80, 'Poor', 'c-crimson'],
      [100, 'Very poor', 'c-crimson'],
      [Infinity, 'Extremely poor', 'c-crimson'],
    ];
    const PM25_LIMITS = [10, 20, 25, 50, 75, Infinity];
    const statTile = ({ ic, color, on = false, label, value, title = '' }) =>
      h(
        'div',
        { class: `tile ${color}${on ? ' is-on' : ''}`, title },
        h('span', { class: 'tile-icon' }, icon(ic)),
        h('span', { class: 'tile-text' }, h('div', { class: 'tile-label' }, label), h('div', { class: 'tile-value' }, value)),
      );
    function airTiles(d) {
      const c = d?.current;
      if (!c) return [];
      const src = `Outdoor, ${settings.LOCATION_NAME} · Copernicus CAMS via Open-Meteo`,
        out = [];
      if (c.european_aqi != null) {
        const b = AQI_BANDS.findIndex(([max]) => c.european_aqi <= max),
          [, name, color] = AQI_BANDS[b];
        out.push(
          statTile({ ic: 'wind', color, on: b >= 3, label: 'Air quality', value: [name, h('small', null, `EAQI ${Math.round(c.european_aqi)}`)], title: src }),
        );
      }
      if (c.pm2_5 != null) {
        const b = PM25_LIMITS.findIndex((max) => c.pm2_5 <= max);
        out.push(
          statTile({
            ic: 'cloud-fog',
            color: AQI_BANDS[b][2],
            on: b >= 3,
            label: 'PM2.5',
            value: [String(Math.round(c.pm2_5 * 10) / 10), h('small', null, 'µg/m³')],
            title: src,
          }),
        );
      }
      return out;
    }

    function mountAqara() {
      const grid = h('div', { class: 'tiles' });
      p.body.append(grid);
      let last = null;
      function render(d, err) {
        if (d) last = d;
        if (!last) {
          grid.replaceChildren(h('div', { class: 'empty' }, icon('alert'), err ? err.message : 'Loading…'));
          return;
        }
        // Alerts (open doors, leaks, motion) first, then outdoor air, then the rest.
        // 6 tiles fill the panel; all show when expanded.
        const list = [...last.sensors].sort((a, b) => sensorAlert(b) - sensorAlert(a));
        const firstCalm = list.findIndex((s) => !sensorAlert(s));
        const tiles = list.map(sensorTile);
        tiles.splice(firstCalm < 0 ? tiles.length : firstCalm, 0, ...airTiles(airFeed.data));
        const shown = p.el.classList.contains('is-expanded') ? tiles : tiles.slice(0, 6);
        grid.replaceChildren(
          ...(list.length
            ? shown
            : [
                ...shown,
                h(
                  'div',
                  { class: 'empty' },
                  icon('home'),
                  'No sensors with readings',
                  h('small', null, 'Check /api/aqara/raw to see what the Aqara cloud returns.'),
                ),
              ]),
        );
        const alerts = list.filter((s) => sensorAlert(s) === 2).length;
        const hidden = tiles.length - shown.length;
        p.setMeta(`Aqara · ${alerts ? `${alerts} open · ` : ''}${list.length} sensors${hidden > 0 ? ` (+${hidden}, expand)` : ''}${err ? ' · offline' : ''}`);
      }
      ctx.subscribe(aqaraFeed, render);
      ctx.subscribe(airFeed, () => render());
      p.onReload = () => {
        aqaraFeed.refresh();
        airFeed.refresh();
      };
      p.onResize = () => render();
    }

    function mountDemoHome(hint) {
      // Mock sensor grid (demonstrates layout; tap lights / locks to toggle)
      const state = { temp: 21.5, door: false, light: true, hum: 46, lock: true, power: 1.24, fan: false, alarm: true };
      const devices = [
        { label: 'Living Room', ic: 'thermometer', color: 'c-accent', value: () => `${state.temp.toFixed(1)}°C`, on: () => true },
        {
          label: 'Front Door',
          ic: () => (state.door ? 'door-open' : 'door-closed'),
          color: () => (state.door ? 'c-crimson' : 'c-emerald'),
          value: () => (state.door ? 'Open' : 'Closed'),
          on: () => state.door,
          toggle: 'door',
        },
        { label: 'Kitchen', ic: 'lightbulb', color: 'c-amber', value: () => (state.light ? 'On · 80%' : 'Off'), on: () => state.light, toggle: 'light' },
        { label: 'Humidity', ic: 'droplet', color: 'c-sky', value: () => `${Math.round(state.hum)}%`, on: () => false },
        {
          label: 'Garage',
          ic: () => (state.lock ? 'lock' : 'lock-open'),
          color: () => (state.lock ? 'c-emerald' : 'c-crimson'),
          value: () => (state.lock ? 'Locked' : 'Unlocked'),
          on: () => !state.lock,
          toggle: 'lock',
        },
        { label: 'Energy', ic: 'zap', color: 'c-violet', value: () => `${state.power.toFixed(2)} kW`, on: () => false },
        { label: 'Air Purifier', ic: 'fan', color: 'c-sky', value: () => (state.fan ? 'Auto' : 'Off'), on: () => state.fan, toggle: 'fan' },
        { label: 'Security', ic: 'shield', color: 'c-emerald', value: () => (state.alarm ? 'Armed' : 'Disarmed'), on: () => state.alarm, toggle: 'alarm' },
      ];
      const val = (x) => (typeof x === 'function' ? x() : x);
      const grid = h('div', { class: 'tiles' });
      p.body.append(grid);
      function render() {
        // 6 tiles fill a 2×3 or 3×2 grid; all 8 show when the panel is expanded.
        const air = airTiles(airFeed.data);
        const shown = p.el.classList.contains('is-expanded') ? devices : devices.slice(0, Math.max(0, 6 - air.length));
        grid.replaceChildren(
          ...air,
          ...shown.map((d) =>
            h(
              d.toggle ? 'button' : 'div',
              {
                class: `tile ${val(d.color)}${d.on() ? ' is-on' : ''}`,
                type: d.toggle ? 'button' : null,
                'aria-pressed': d.toggle ? String(!!state[d.toggle]) : null,
                onclick: d.toggle
                  ? () => {
                      state[d.toggle] = !state[d.toggle];
                      render();
                    }
                  : null,
              },
              h('span', { class: 'tile-icon' }, icon(val(d.ic))),
              h('span', { class: 'tile-text' }, h('div', { class: 'tile-label' }, d.label), h('div', { class: 'tile-value' }, d.value())),
            ),
          ),
        );
        p.setMeta(ctx.ui.demoMeta(hint));
      }
      render();
      ctx.subscribe(airFeed, () => render());
      ctx.setInterval(() => {
        // gentle sensor drift so the mock feels live
        state.temp = Math.min(23.5, Math.max(19.5, state.temp + (Math.random() - 0.5) * 0.2));
        state.hum = Math.min(60, Math.max(38, state.hum + (Math.random() - 0.5)));
        state.power = Math.max(0.3, state.power + (Math.random() - 0.5) * 0.15 + (state.light ? 0.01 : -0.01));
        render();
      }, 30000);
      p.onReload = render;
      p.onResize = render;
    }

    ctx
      .status('aqara')
      .then(
        ctx.guard((st) => (st.connected ? mountAqara() : mountDemoHome(st.configured ? 'Connect Aqara in ⚙ Settings → Accounts' : 'Aqara: README → Aqara'))),
      );
  },
});

});
</script>
<script data-widget="sports">
OMD._load("sports", function () {
/**
 * Sports — live scores and fixtures from ESPN's public scoreboards (no key).
 */
OMD.defineWidget({
  id: 'sports',
  name: 'Sports',
  icon: 'trophy',
  group: 'Fitness & markets',
  settings: [
    [
      'SPORTS',
      'Sports leagues (ESPN scores widget)',
      'textarea',
      { help: 'e.g. <code>soccer/ger.1</code>, <code>soccer/eng.1</code>, <code>football/nfl</code>, <code>basketball/nba</code>' },
    ],
    ['SPORTS_TEAMS', 'Only these teams (abbreviations, optional)', 'textarea'],
  ],
  defaults: {
    SPORTS: ['soccer/eng.1', 'basketball/nba'], // ESPN leagues: soccer/esp.1, football/nfl, hockey/nhl, baseball/mlb…
    SPORTS_TEAMS: [], // Optional filter by team abbreviation, e.g. ["ARS", "LAL"]
  },

  mount(ctx) {
    const { h, icon, fmt, settings: s } = ctx;
    const p = ctx.panel({ title: 'Scores', tint: 'sky' });
    const list = h('div', { class: 'scroll-y' });
    p.body.append(list);
    const feed = ctx.sharedFeed(
      'scores',
      () => async () => {
        const teams = new Set(
          s.SPORTS_TEAMS.join(',')
            .split(',')
            .map((x) => x.trim().toUpperCase())
            .filter(Boolean),
        );
        const res = await Promise.allSettled(s.SPORTS.map((lg) => ctx.fetchJSON(`https://site.api.espn.com/apis/site/v2/sports/${lg.trim()}/scoreboard`)));
        return res
          .filter((r) => r.status === 'fulfilled')
          .map((r) => {
            const d = r.value;
            const games = (d.events || [])
              .map((e) => {
                const c = e.competitions?.[0] || {};
                const side = (x) => {
                  const t = c.competitors?.find((y) => y.homeAway === x) || {};
                  return { abbr: t.team?.abbreviation || '?', name: t.team?.shortDisplayName || t.team?.displayName || '', logo: t.team?.logo, score: t.score };
                };
                return {
                  home: side('home'),
                  away: side('away'),
                  state: e.status?.type?.state,
                  detail: e.status?.type?.shortDetail || '',
                  date: new Date(e.date),
                };
              })
              .filter((g) => !teams.size || teams.has(g.home.abbr) || teams.has(g.away.abbr));
            const rank = { in: 0, pre: 1, post: 2 };
            games.sort((a, b) => (rank[a.state] ?? 3) - (rank[b.state] ?? 3) || (a.state === 'post' ? b.date - a.date : a.date - b.date));
            return { league: d.leagues?.[0]?.abbreviation || d.leagues?.[0]?.name || '', games };
          });
      },
      2 * 60000,
      { visibleOnly: true },
    );

    ctx.subscribe(feed, (leagues, err) => {
      if (!leagues) {
        if (err) list.replaceChildren(h('div', { class: 'empty' }, icon('alert'), 'Scores unavailable'));
        return;
      }
      const blocks = leagues
        .filter((l) => l.games.length)
        .map((l) =>
          h(
            'div',
            null,
            h('div', { class: 'league' }, l.league),
            l.games.slice(0, 6).map((g) => {
              const team = (t, cls) =>
                h('div', { class: `team ${cls}` }, t.logo ? h('img', { src: t.logo, alt: '', loading: 'lazy' }) : null, h('span', null, t.abbr));
              const sameDay = ctx.util.ymd(g.date) === ctx.util.ymd(new Date());
              const mid =
                g.state === 'pre'
                  ? h('div', { class: 'score' }, fmt.time.format(g.date), h('small', null, sameDay ? 'Today' : fmt.dateShort.format(g.date)))
                  : h(
                      'div',
                      { class: `score${g.state === 'in' ? ' is-live' : ''}` },
                      `${g.home.score ?? 0} – ${g.away.score ?? 0}`,
                      h('small', null, g.detail),
                    );
              return h('div', { class: 'game', title: `${g.home.name} v ${g.away.name}` }, team(g.home, 'home'), mid, team(g.away, 'away'));
            }),
          ),
        );
      list.replaceChildren(...(blocks.length ? blocks : [h('div', { class: 'empty' }, icon('trophy'), 'No games scheduled')]));
      p.setMeta(
        leagues
          .map((l) => l.league)
          .filter(Boolean)
          .join(' · '),
      );
    });
    p.onReload = () => feed.refresh();
  },
});

});
</script>
<script data-widget="spotify">
OMD._load("spotify", function () {
/**
 * Now Playing — Spotify: what's playing, controls, volume, and "play one of my playlists"
 * on any Spotify Connect speaker (Google Home / Nest included). Needs the backend
 * integration (lib/integrations/spotify.js); without it, an optional embed player.
 */
const { pad2 } = OMD.util;
/** When Now Playing was last asked (shared by every Now Playing on the page, like the feed). */
let spotifyFetchedAt = 0;

/** A Spotify link or URI → its embed player URL. */
function spotifyEmbedUrl(input) {
  if (!input) return '';
  const s = input.trim();
  const uri = /^spotify:(playlist|album|artist|track|show|episode):([A-Za-z0-9]+)$/.exec(s);
  if (uri) return `https://open.spotify.com/embed/${uri[1]}/${uri[2]}?utm_source=generator&theme=0`;
  try {
    const u = new URL(s);
    if (!/spotify\.com$/.test(u.hostname)) return s;
    const parts = u.pathname
      .split('/')
      .filter(Boolean)
      .filter((x) => !/^intl-/.test(x) && x !== 'embed');
    if (parts.length >= 2) return `https://open.spotify.com/embed/${parts[0]}/${parts[1]}?utm_source=generator&theme=0`;
  } catch {
    /* fall through */
  }
  return s;
}

OMD.defineWidget({
  id: 'spotify',
  name: 'Now Playing',
  icon: 'music',
  group: 'Photos, music & news',
  integrations: ['spotify'],
  settings: [
    [
      'SPOTIFY_DEVICE',
      'Default Spotify speaker',
      'text',
      {
        placeholder: 'e.g. Living Room speaker',
        help: 'Playlists start here when nothing is playing. Empty = the last speaker picked on this screen. Connect the account under <b>Accounts</b>.',
      },
    ],
    [
      'SPOTIFY_URL',
      'Fallback: Spotify embed link',
      'url',
      { placeholder: 'https://open.spotify.com/playlist/…', help: 'Only used while no Spotify account is connected.' },
    ],
  ],
  defaults: {
    SPOTIFY_DEVICE: '', // Speaker to start playlists on when nothing is playing, e.g. "Living Room speaker". "" = ask.
    SPOTIFY_URL: '', // Optional fallback: embed player for a link/URI when the account isn't connected.
  },

  mount(ctx) {
    const { h, icon, settings: s } = ctx;
    const p = ctx.panel({ tint: 'spotify', meta: 'Spotify' });
    p.el.prepend(h('div', { class: 'spotify-glow', 'aria-hidden': 'true' }));

    // Polled every 10 s while something plays, every 30 s when idle, only while on screen (~0.6 KB a poll).
    const spotifyFeed = ctx.sharedFeed(
      'now',
      () => async () => {
        const prev = spotifyFeed.data;
        if (prev && !prev.playing && Date.now() - spotifyFetchedAt < 28000) return prev;
        spotifyFetchedAt = Date.now();
        return { ...(await ctx.api('spotify/now')), fetchedAt: Date.now() };
      },
      10000,
      { visibleOnly: true, persist: false }, // what played an hour ago isn't worth showing
    );
    const refreshSpotify = (delay = 900) =>
      ctx.setTimeout(() => {
        spotifyFetchedAt = 0;
        spotifyFeed.refresh();
      }, delay);
    const spotifyDevicePref = ctx.local('device', '', { legacyKey: 'omd.spotify-device.v1' });

    function mountSpotifyEmbed(url) {
      const kind = (/embed\/(\w+)/.exec(url) || [])[1];
      p.setMeta(kind ? `Spotify ${kind}` : 'Spotify');
      const frame = ctx.ui.frame(p.body, {
        url,
        title: 'Spotify player',
        rounded: true,
        skeletonKind: 'list',
        allow: 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture',
      });
      // Snap to Spotify's native heights so the row can be resized freely in the layout editor.
      const frameEl = p.body.querySelector('.frame');
      const stacked = matchMedia('(max-width: 599px), (orientation: landscape) and (max-height: 480px)');
      ctx.observeResize(p.body, () => {
        if (stacked.matches || p.el.classList.contains('is-expanded')) {
          frameEl.style.height = '';
          return;
        }
        const avail = p.body.clientHeight;
        frameEl.style.height = `${avail >= 352 ? 352 : avail >= 152 ? 152 : 80}px`;
      });
      p.reloadable(frame.reload);
    }

    function mountNowPlaying() {
      p.body.classList.add('np-host');
      const art = h('div', { class: 'np-art' }, icon('music'));
      const title = h('div', { class: 'np-title' });
      const artist = h('div', { class: 'np-artist' });
      const bar = h('i');
      const tNow = h('span'),
        tEnd = h('span');
      const btn = (ic, label, fn, cls = '') =>
        h('button', { class: `icon-btn np-btn${cls}`, type: 'button', 'aria-label': label, title: label, onclick: fn }, icon(ic));
      const playBtn = btn('play', 'Play', () => control(state?.playing ? 'pause' : 'play'), ' is-main');
      const sheet = h('div', { class: 'np-sheet', hidden: true });
      const toast = h('div', { class: 'np-toast', role: 'status' });
      // Volume: the button swaps the progress bar for a slider, which steps back a few seconds after the last touch.
      const volIn = h('input', { type: 'range', min: 0, max: 100, step: 5, 'aria-label': 'Volume' });
      const volOut = h('span', { class: 'np-vol-val' });
      const volBtn = btn('volume-2', 'Volume', () => showVol(!mid.classList.contains('show-vol')), ' np-vol-btn');
      const mid = h(
        'div',
        { class: 'np-mid' },
        h('div', { class: 'np-progress' }, h('div', { class: 'np-bar' }, bar), h('div', { class: 'np-times' }, tNow, tEnd)),
        h('div', { class: 'np-vol' }, volIn, volOut),
      );
      p.body.append(
        h(
          'div',
          { class: 'np' },
          art,
          h(
            'div',
            { class: 'np-main' },
            h('div', { class: 'np-text' }, title, artist),
            mid,
            h(
              'div',
              { class: 'np-controls' },
              btn('skip-back', 'Previous', () => control('previous')),
              playBtn,
              btn('skip-forward', 'Next', () => control('next')),
              volBtn,
            ),
          ),
        ),
        sheet,
        toast,
      );
      p.addAction('speaker', 'Choose speaker', () => openSheet('devices'));
      p.addAction('list-music', 'My playlists', () => openSheet('playlists'));

      let state = null,
        artUrl = '',
        endedUri = null,
        pendingContext = null,
        toastTimer = 0;
      let volHide = 0,
        volSend = 0,
        volAt = 0;
      const volIcon = (v) => (v <= 0 ? 'volume-x' : v < 50 ? 'volume-1' : 'volume-2');
      function paintVol(v) {
        volIn.value = v;
        volIn.style.setProperty('--v', `${v}%`);
        volOut.textContent = `${v}%`;
        volBtn.replaceChildren(icon(volIcon(v)));
        volBtn.title = `Volume ${v}%`;
      }
      function showVol(on) {
        mid.classList.toggle('show-vol', on);
        volBtn.classList.toggle('is-on', on);
        ctx.clearTimeout(volHide);
        if (on) volHide = ctx.setTimeout(() => showVol(false), 5000);
      }
      function renderVol(d) {
        const dev = d?.active ? d.device : null,
          ok = !!dev && dev.canVolume !== false && dev.volume != null;
        volBtn.hidden = !ok;
        if (!ok) {
          showVol(false);
          return;
        }
        if (Date.now() - volAt > 4000) paintVol(dev.volume); // don't fight a slider that was just moved
      }
      ctx.listen(volIn, 'input', () => {
        const v = Number(volIn.value);
        volAt = Date.now();
        paintVol(v);
        showVol(true);
        ctx.clearTimeout(volSend);
        volSend = ctx.setTimeout(() => control('volume', { value: v }), 250);
      });
      const say = (text) => {
        toast.textContent = text;
        toast.classList.add('is-on');
        ctx.clearTimeout(toastTimer);
        toastTimer = ctx.setTimeout(() => toast.classList.remove('is-on'), 4000);
      };
      const mmss = (ms) => {
        const s = Math.max(0, Math.floor(ms / 1000));
        return `${Math.floor(s / 60)}:${pad2(s % 60)}`;
      };
      const position = () => (state?.playing ? Math.min(state.duration, state.progress + (Date.now() - state.fetchedAt)) : state?.progress || 0);
      function setPlayIcon(playing) {
        playBtn.replaceChildren(icon(playing ? 'pause' : 'play'));
        playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        p.el.classList.toggle('is-playing', !!playing);
      }
      function tick() {
        if (!state?.active || !state.duration) {
          bar.style.width = '0';
          tNow.textContent = tEnd.textContent = '';
          return;
        }
        const x = position();
        bar.style.width = `${(x / state.duration) * 100}%`;
        tNow.textContent = mmss(x);
        tEnd.textContent = mmss(state.duration);
        if (state.playing && x >= state.duration && endedUri !== state.uri) {
          endedUri = state.uri;
          refreshSpotify(1500);
        }
      }
      function render(d, err) {
        if (err) {
          if (err.status === 409) {
            title.textContent = 'Spotify disconnected';
            artist.textContent = 'Reconnect it in ⚙ Settings → Accounts';
          }
          p.setMeta('Spotify · offline');
          return;
        }
        state = d;
        if (!d?.active) {
          title.textContent = 'Nothing playing';
          artist.textContent = 'Tap ♫ to play one of your playlists';
          p.setMeta('Spotify · idle');
        } else {
          title.textContent = d.title || '—';
          artist.textContent = d.artist || d.album || '';
          p.setMeta(d.device?.name ? `on ${d.device.name}` : 'Spotify');
        }
        if ((d?.image || '') !== artUrl) {
          artUrl = d?.image || '';
          art.replaceChildren(artUrl ? h('img', { src: artUrl, alt: '', decoding: 'async' }) : icon('music'));
        }
        setPlayIcon(d?.playing);
        renderVol(d);
        tick();
      }
      ctx.subscribe(spotifyFeed, render);
      ctx.onTick(() => {
        if (state?.playing && ctx.isVisible()) tick();
      });

      async function preferredDevice() {
        const want = (s.SPOTIFY_DEVICE || spotifyDevicePref.get() || '').toLowerCase();
        if (!want) return null;
        const { devices } = await ctx.api('spotify/devices');
        return devices.find((d) => d.name.toLowerCase() === want) || devices.find((d) => d.name.toLowerCase().includes(want)) || null;
      }
      async function control(action, extra = {}) {
        try {
          let deviceId = extra.device_id;
          if (!deviceId && !state?.active && (action === 'play' || action === 'next' || action === 'previous')) {
            deviceId = (await preferredDevice())?.id;
            if (!deviceId) {
              pendingContext = extra.context_uri || null;
              return openSheet('devices');
            }
          }
          if ((action === 'play' || action === 'pause') && state?.active && !extra.context_uri) {
            state.progress = position();
            state.fetchedAt = Date.now();
            state.playing = action === 'play';
            setPlayIcon(state.playing);
          }
          await ctx.api('spotify/player', { method: 'POST', body: JSON.stringify({ ...extra, action, device_id: deviceId }) });
        } catch (e) {
          say(e.message);
          if (/device/i.test(e.message)) openSheet('devices');
        }
        refreshSpotify();
      }
      const closeSheet = () => {
        sheet.hidden = true;
        sheet.replaceChildren();
      };
      const row = (thumb, name, sub, fn, current) =>
        h(
          'button',
          { class: `np-row${current ? ' is-current' : ''}`, type: 'button', onclick: fn },
          h('span', { class: 'np-thumb' }, thumb),
          h('span', { class: 'np-row-text' }, h('b', null, name), h('small', null, sub)),
        );
      let playlistCache = null;
      async function openSheet(kind) {
        sheet.hidden = false;
        sheet.replaceChildren(
          h(
            'div',
            { class: 'np-sheet-head' },
            h('b', null, kind === 'devices' ? (pendingContext ? 'Play it on…' : 'Play on…') : 'My playlists'),
            h(
              'button',
              {
                class: 'icon-btn',
                type: 'button',
                'aria-label': 'Close',
                onclick: () => {
                  pendingContext = null;
                  closeSheet();
                },
              },
              icon('x'),
            ),
          ),
          h('div', { class: 'empty' }, 'Loading…'),
        );
        try {
          let list;
          if (kind === 'devices') {
            const { devices } = await ctx.api('spotify/devices');
            list = devices.length
              ? devices.map((d) =>
                  row(
                    icon('speaker'),
                    d.name,
                    d.active ? 'Playing here' : d.type,
                    () => {
                      spotifyDevicePref.set(d.name);
                      closeSheet();
                      const ctx = pendingContext;
                      pendingContext = null;
                      control(ctx ? 'play' : 'transfer', { device_id: d.id, ...(ctx ? { context_uri: ctx } : {}) });
                    },
                    d.active,
                  ),
                )
              : [
                  h(
                    'div',
                    { class: 'empty' },
                    icon('speaker'),
                    'No speakers found',
                    h(
                      'small',
                      null,
                      'Google Home / Nest speakers show up once they have played Spotify recently — e.g. “Hey Google, play Spotify”. The Spotify app on a phone works too.',
                    ),
                  ),
                ];
          } else {
            if (!playlistCache || Date.now() - playlistCache.at > 300000)
              playlistCache = { at: Date.now(), list: (await ctx.api('spotify/playlists')).playlists };
            list = playlistCache.list.length
              ? playlistCache.list.map((pl) =>
                  row(
                    pl.image ? h('img', { src: pl.image, alt: '', loading: 'lazy' }) : icon('list-music'),
                    pl.name,
                    pl.owner,
                    () => {
                      closeSheet();
                      control('play', { context_uri: pl.uri });
                    },
                    state?.context === pl.uri,
                  ),
                )
              : [h('div', { class: 'empty' }, icon('list-music'), 'No playlists in this account')];
          }
          sheet.lastChild.replaceWith(h('div', { class: 'np-list scroll-y' }, list));
        } catch (e) {
          sheet.lastChild.replaceWith(h('div', { class: 'empty' }, icon('alert'), e.message));
        }
      }
      p.onReload = () => refreshSpotify(0);
    }

    ctx.status('spotify').then(
      ctx.guard((st) => {
        if (st.connected) return mountNowPlaying();
        const url = spotifyEmbedUrl(s.SPOTIFY_URL);
        if (url) return mountSpotifyEmbed(url);
        p.body.append(
          h(
            'div',
            { class: 'empty' },
            icon('music'),
            st.configured ? 'Spotify isn’t connected yet' : 'Now Playing needs the Spotify app keys',
            st.configured
              ? h('a', { class: 'cta', href: ctx.apiUrl('spotify/login') }, icon('link'), 'Connect Spotify')
              : h(
                  'small',
                  null,
                  st.local
                    ? 'Available when the dashboard runs on its Cloudflare Worker.'
                    : 'Set SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET on the Worker — README → Spotify.',
                ),
          ),
        );
      }),
    );
  },
});

});
</script>
<script data-widget="strava">
OMD._load("strava", function () {
/**
 * Strava — family activity: one card per person with this week's km (per day), the trend
 * against last week, 4 weeks, the year and the latest activity. The backend integration
 * (lib/integrations/strava.js) does the OAuth and keeps the tokens.
 */
const SPORT_ICON = { Run: 'footprints', Walk: 'footprints', Ride: 'bike', Swim: 'droplet', Other: 'activity' };
const SPORT_NAME = { Run: 'Run', Walk: 'Walk', Ride: 'Ride', Swim: 'Swim', Other: 'Other' };
const { pad2, ymd, parseYMD, addDays } = OMD.util;

OMD.defineWidget({
  id: 'strava',
  name: 'Strava',
  icon: 'activity',
  group: 'Fitness & markets',
  integrations: ['strava'],
  settings: [
    [
      'STRAVA_SPORTS',
      'Strava: sports to count',
      'text',
      { placeholder: 'All · or e.g. Run, Ride', help: 'Run · Ride · Walk · Swim · Other. Connect accounts under <b>Accounts</b>.' },
    ],
  ],
  defaults: {
    STRAVA_SPORTS: '', // "" = all sports, or e.g. "Run, Ride" (Run · Ride · Walk · Swim · Other)
  },

  mount(ctx) {
    const { h, icon, fmt, settings: s } = ctx;
    const stravaFeed = ctx.sharedFeed(
      'stats',
      () => () =>
        ctx.api(`strava/stats?today=${ymd(new Date())}&weekStart=${s.WEEK_START}&sports=${encodeURIComponent(String(s.STRAVA_SPORTS || ''))}`, {
          timeout: 20000,
        }),
      15 * 60000,
      { visibleOnly: true },
    );
    const DIST_UNIT = ctx.imperial ? 'mi' : 'km';
    const dist = (km) => {
      const v = ctx.imperial ? km * 0.621371 : km;
      return v >= 100 ? String(Math.round(v)) : v.toFixed(1).replace(/\.0$/, '');
    };
    const fmtDur = (s) => {
      const m = Math.round(s / 60);
      return m >= 60 ? `${Math.floor(m / 60)} h ${pad2(m % 60)}` : `${m} min`;
    };
    /** "▲ 4.1 km vs last week" — compared with last week up to the same weekday. */
    function stravaDelta(a) {
      if (!a.lastWeek) return null;
      const d = a.week.km - a.lastWeek.toDate;
      if (Math.abs(d) < 0.05) return h('span', { class: 'st-delta' }, `= last week`);
      return h(
        'span',
        {
          class: `st-delta ${d > 0 ? 'is-up' : 'is-down'}`,
          title: `Last week by this day: ${dist(a.lastWeek.toDate)} ${DIST_UNIT} (whole week ${dist(a.lastWeek.km)})`,
        },
        `${d > 0 ? '▲' : '▼'} ${dist(Math.abs(d))}`,
        h('span', { class: 'st-vs' }, ' vs last week'),
      );
    }
    function stravaCard(a) {
      const initial = h('span', { class: 'st-avatar' }, (a.name || '?')[0]);
      const avatar = a.avatar ? h('img', { class: 'st-avatar', src: a.avatar, alt: '', onerror: (e) => e.target.replaceWith(initial) }) : initial;
      if (a.error || !a.week)
        return h(
          'div',
          { class: 'st-card' },
          h('div', { class: 'st-head' }, avatar, h('b', null, a.name)),
          h('div', { class: 'empty' }, icon('alert'), a.error || 'No data'),
        );
      const today = Math.round((parseYMD(ymd(new Date())) - parseYMD(a.week.start)) / 864e5);
      const max = Math.max(1, ...a.week.days);
      const w0 = parseYMD(a.week.start);
      return h(
        'div',
        { class: 'st-card' },
        h(
          'div',
          { class: 'st-head' },
          avatar,
          h(
            'div',
            { class: 'st-who' },
            h('b', null, a.name),
            h(
              'span',
              null,
              a.week.count ? `${a.week.count} ${a.week.count === 1 ? 'activity' : 'activities'} · ${fmtDur(a.week.time)}` : 'No activity yet this week',
            ),
          ),
        ),
        h('div', { class: 'st-big' }, h('b', null, dist(a.week.km)), h('small', null, DIST_UNIT, h('span', { class: 'st-wk' }, ' this week')), stravaDelta(a)),
        h(
          'div',
          { class: 'st-bars', 'aria-hidden': 'true' },
          a.week.days.map((km, i) =>
            h(
              'div',
              { class: `st-bar${i === today ? ' is-today' : ''}${i > today ? ' is-future' : ''}`, title: `${dist(km)} ${DIST_UNIT}` },
              h('i', { style: { height: km ? `${Math.max(8, (km / max) * 100)}%` : '3px' } }),
              h('span', null, fmt.weekdayShort.format(addDays(w0, i)).slice(0, 2)),
            ),
          ),
        ),
        h(
          'div',
          { class: 'st-sports' },
          Object.entries(a.week.bySport)
            .filter(([, km]) => km > 0)
            .slice(0, 3)
            .map(([g, km]) => h('span', { title: SPORT_NAME[g] || g }, icon(SPORT_ICON[g] || 'activity'), `${dist(km)}`)),
        ),
        h(
          'div',
          { class: 'st-foot' },
          h('span', null, h('small', null, '4 weeks '), `${dist(a.fourWeeks.km)} ${DIST_UNIT}`),
          h('span', null, h('small', null, `${a.year.year} `), `${dist(a.year.km)} ${DIST_UNIT}`),
        ),
        a.last
          ? h(
              'div',
              { class: 'st-last' },
              icon(SPORT_ICON[a.last.sport] || 'activity'),
              h(
                'span',
                null,
                `${a.last.name} · ${a.last.km ? `${dist(a.last.km)} ${DIST_UNIT}` : fmtDur(a.last.time)} · ${fmt.timeAgo(new Date(String(a.last.date).replace(/Z$/, '')))}`,
              ),
            )
          : null,
      );
    }

    const p = ctx.panel({ tint: 'strava', meta: 'This week' });
    const box = h('div', { class: 'strava' });
    p.body.classList.add('strava-host');
    p.body.append(box);
    let subscribed = false,
      recheck = 0;
    const say = (text, extra) => box.replaceChildren(h('div', { class: 'empty' }, icon('activity'), text, extra || null));
    async function check(fresh = false) {
      const st = await ctx.status('strava', fresh);
      ctx.clearTimeout(recheck);
      if (!st.athletes?.length) {
        p.setMeta('Strava');
        if (st.local) say('Strava works when the dashboard runs on its Cloudflare Worker.');
        else if (st.error) say('Can’t reach the dashboard API', h('small', null, `${st.error}. Is this device signed in?`));
        else if (!st.configured)
          say('Strava app keys are missing', h('small', null, 'Add STRAVA_CLIENT_ID and STRAVA_CLIENT_SECRET on the Worker, then tap ↻ — README → Strava.'));
        else say('Nobody connected yet', h('a', { class: 'cta', href: ctx.apiUrl('strava/login?app=1') }, icon('link'), 'Connect Strava'));
        // Someone may connect from another device: look again every 5 minutes.
        if (!st.local) recheck = ctx.setTimeout(() => check(true), 5 * 60000);
        return;
      }
      if (subscribed) {
        stravaFeed.refresh();
        return;
      }
      subscribed = true;
      say('Loading…');
      ctx.subscribe(stravaFeed, (d, err) => {
        if (d) {
          box.replaceChildren(...d.athletes.map(stravaCard));
          // Content-sized slots (e.g. Now Playing's) still get room for one line per person.
          p.body.style.minHeight = `${d.athletes.length * 58 + (d.athletes.length - 1) * 8}px`;
        } else if (err && !box.querySelector('.st-card')) say('Strava didn’t answer', h('small', null, err.message));
        const lead = d?.athletes?.filter((a) => a.week).sort((x, y) => y.week.km - x.week.km);
        p.setMeta(err && !d ? 'offline' : lead?.length > 1 && lead[0].week.km > 0 ? `This week · ${lead[0].name} leads` : 'This week');
      });
    }
    ctx.guard(check)();
    p.onReload = () => check(true);
  },
});

});
</script>
<script data-widget="transport">
OMD._load("transport", function () {
/**
 * Public transport — any departure board / journey planner web app that allows iframe
 * embedding (seamless, edge to edge). Without one: a demo departure board.
 */
OMD.defineWidget({
  id: 'transport',
  name: 'Public transport',
  icon: 'train',
  group: 'Getting around',
  settings: [
    ['TRANSPORT_URL', 'Transport web app URL', 'url', { placeholder: 'https://…', help: 'Must allow iframe embedding.' }],
    ['TRANSPORT_TITLE', 'Panel title', 'text'],
    [
      ['TRANSPORT_ZOOM', 'Zoom (1 = 100%)', 'number', { step: 0.05, min: 0.25, max: 3 }],
      ['TRANSPORT_REFRESH_MIN', 'Refresh (min, 0 = off)', 'number', { step: 1, min: 0 }],
    ],
  ],
  defaults: {
    TRANSPORT_URL: 'https://oh-my-bussy.vercel.app/',
    TRANSPORT_TITLE: 'Transit',
    TRANSPORT_ZOOM: 1, // 1 = 100 %. 0.8 fits more content, 1.2 enlarges.
    TRANSPORT_REFRESH_MIN: 0, // 0 = let the web app refresh itself (recommended). N = forced seamless reload every N min.
  },

  mount(ctx) {
    const { h, icon, settings: s, util, fmt } = ctx;
    if (s.TRANSPORT_URL) {
      // Seamless: no panel chrome — the transit app fills the slot on the same #050505 black.
      const p = ctx.panel({ title: s.TRANSPORT_TITLE, head: false });
      p.el.classList.add('is-seamless');
      const frame = ctx.ui.frame(p.body, {
        url: s.TRANSPORT_URL,
        title: 'Public transport',
        zoom: s.TRANSPORT_ZOOM,
        refreshMin: s.TRANSPORT_REFRESH_MIN,
        allow: 'geolocation; fullscreen',
        skeletonKind: 'list',
      });
      p.onReload = frame.reload;
      return;
    }
    // Demo departure board — deterministic schedule so it looks alive.
    const p = ctx.panel({ title: s.TRANSPORT_TITLE, icon: 'train', tint: 'emerald' });
    p.setMeta(ctx.ui.demoMeta('Set TRANSPORT_URL'));
    const LINES = [
      { line: 'S1', c: '#34d399', dest: 'Airport Terminal 2', every: 10, off: 3, plat: '3', ic: 'train' },
      { line: 'U4', c: '#60a5fa', dest: 'Harbour Front', every: 6, off: 1, plat: '1', ic: 'train' },
      { line: '42', c: '#fbbf24', dest: 'Old Town via Market Sq.', every: 8, off: 5, plat: 'B', ic: 'bus' },
      { line: 'RE7', c: '#fb7185', dest: 'Northgate', every: 30, off: 12, plat: '5', ic: 'train' },
      { line: 'S3', c: '#c4b5fd', dest: 'University Campus', every: 15, off: 7, plat: '2', ic: 'train' },
      { line: '118', c: '#5eead4', dest: 'Riverside Park', every: 12, off: 9, plat: 'D', ic: 'bus' },
    ];
    const list = h('ul', { class: 'departures', 'aria-live': 'polite' });
    const clock = h('div', { class: 'board-clock' });
    p.body.append(
      h(
        'div',
        { class: 'board' },
        h(
          'div',
          { class: 'board-head' },
          h('div', null, h('div', { class: 'board-station' }, 'Central Station'), h('div', { class: 'board-sub' }, 'Departures · all platforms')),
          clock,
        ),
        list,
        h('button', { class: 'cta', type: 'button', onclick: () => ctx.openSettings('TRANSPORT_URL') }, icon('link'), 'Paste your transport web app URL'),
      ),
    );

    function render() {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      clock.textContent = fmt.time.format(now);
      const deps = [];
      for (const L of LINES) {
        for (let t = Math.ceil((nowMin - L.off - 1) / L.every) * L.every + L.off; t < nowMin + 75; t += L.every) {
          const r = util.hash(`${L.line}${t}${now.toDateString()}`) % 100;
          const delay = r < 18 ? 1 + (r % 5) : 0;
          const eta = t + delay - nowMin;
          if (eta > -0.5) deps.push({ ...L, t, delay, eta });
        }
      }
      deps.sort((a, b) => a.eta - b.eta);
      list.replaceChildren(
        ...deps.slice(0, 14).map((d) => {
          const when = new Date(util.startOfDay(now).getTime() + d.t * 60000);
          const mins = Math.floor(d.eta);
          return h(
            'li',
            { class: 'dep' },
            h('span', { class: 'line-badge', style: { '--c': d.c } }, icon(d.ic), d.line),
            h(
              'div',
              { style: { minWidth: '0' } },
              h('div', { class: 'dep-dest' }, d.dest),
              h(
                'div',
                { class: 'dep-info' },
                `${fmt.time.format(when)} · Platform ${d.plat} · `,
                d.delay ? h('span', { class: 'late' }, `+${d.delay} min`) : h('span', { class: 'ontime' }, 'On time'),
              ),
            ),
            h('div', { class: `dep-eta${mins < 1 ? ' is-now' : ''}` }, h('b', null, mins < 1 ? 'Now' : mins), mins < 1 ? null : h('small', null, 'min')),
          );
        }),
      );
      // Drop rows that would be clipped so the board never shows half a departure.
      const max = list.clientHeight;
      if (max > 0)
        [...list.children].forEach((li, i) => {
          if (i > 0 && li.offsetTop + li.offsetHeight > max + 1) li.remove();
        });
    }
    render();
    ctx.setInterval(render, 15000);
    let lastH = 0;
    ctx.observeResize(list, () => {
      if (list.clientHeight !== lastH) {
        lastH = list.clientHeight;
        ctx.raf(render);
      }
    });
    p.onReload = render;
  },
});

});
</script>

<script data-widget="worldclock">
OMD._load("worldclock", function () {
/**
 * World clocks — analog faces for other time zones, with the day and the offset.
 */
OMD.defineWidget({
  id: 'worldclock',
  name: 'World clocks',
  icon: 'globe',
  group: 'Time & weather',
  settings: [['WORLD_CLOCKS', 'World clocks', 'textarea', { help: '<code>Tokyo | Asia/Tokyo</code> (IANA time zone names)' }]],
  defaults: {
    WORLD_CLOCKS: ['New York | America/New_York', 'Tokyo | Asia/Tokyo', 'Sydney | Australia/Sydney'],
  },

  mount(ctx) {
    const { h, icon, settings: s } = ctx;
    const { pipe, startOfDay } = ctx.util;
    const p = ctx.panel({ tint: 'sky', actions: ['expand'] });
    const grid = h('div', { class: 'clocks' });
    p.body.append(grid);
    const zones = s.WORLD_CLOCKS.map(pipe)
      .map(([label, tz]) => {
        try {
          new Intl.DateTimeFormat(undefined, { timeZone: tz });
          return { label, tz };
        } catch {
          return null;
        }
      })
      .filter(Boolean);
    const rows = zones.map(({ label, tz }) => {
      const time = h('div', { class: 'wc-time' }),
        off = h('div', { class: 'wc-off' });
      const f = new Intl.DateTimeFormat(ctx.locale, { timeZone: tz, hour: s.HOUR_12 ? 'numeric' : '2-digit', minute: '2-digit', hour12: s.HOUR_12 });
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
        hour: 'numeric',
        minute: 'numeric',
        hour12: false,
      });
      grid.append(
        h(
          'div',
          { class: 'wc' },
          ctx.ui.analogClock({ tz, seconds: false }),
          h('div', { style: { minWidth: '0' } }, h('div', { class: 'wc-city' }, label), time, off),
        ),
      );
      return (now) => {
        time.textContent = f.format(now);
        const p2 = Object.fromEntries(parts.formatToParts(now).map((x) => [x.type, x.value]));
        const there = new Date(+p2.year, +p2.month - 1, +p2.day, +p2.hour % 24, +p2.minute);
        const diffH = Math.round(((there - new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes())) / 36e5) * 2) / 2;
        const dayDiff = Math.round((startOfDay(there) - startOfDay(now)) / 864e5);
        off.textContent = `${dayDiff === 0 ? 'Today' : dayDiff > 0 ? 'Tomorrow' : 'Yesterday'} · ${diffH === 0 ? 'same time' : `${diffH > 0 ? '+' : ''}${diffH}h`}`;
      };
    });
    if (!zones.length) grid.replaceChildren(h('div', { class: 'empty' }, icon('globe'), 'Add WORLD_CLOCKS in settings'));
    ctx.onTick((now) => rows.forEach((fn) => fn(now)));
  },
});

});
</script>

/* ---------- app/core/boot/08-clock.js ---------- */
/* ==========================================================================
   CLOCK — one heartbeat for the whole dashboard.
   Everything that happens "every N seconds" runs on it: clocks (onTick) and all
   polling and housekeeping (every). Jobs are aligned to the wall clock (a 5-minute
   job runs at :00, :05, :10 …), so the device wakes up once a second at most —
   never once per widget — and everything due in that second updates the page
   together, in one task: one style and layout pass, one repaint.
   ========================================================================== */

 * of `ms`. Returns a cancel function. For anything shorter than a second use a timer.
 */

  const step = Math.max(1000, Math.round(ms / 1000) * 1000);
  const job = { ms: step, fn, slot: Math.floor(Date.now() / step) };
  jobs.add(job);
  return () => jobs.delete(job);

    t = now.getTime();

    if (slot === job.slot) continue;
    job.slot = slot;
    try {
      job.fn();
    } catch (e) {
      console.error(e);
    }
  }
  tickers.forEach((fn) => {
    try {
      fn(now);
    } catch (e) {
      console.error(e);
    }
  });

})();

    requestAnimationFrame(() => {
      const a = panelApis.get(panel);
      a?.run(() => a.onResize?.());

}
document.addEventListener('click', (e) => {

  if (!btn) return;
  const panel = btn.closest('.panel');
  if (btn.dataset.action === 'expand') setExpanded(panel, !panel.classList.contains('is-expanded'));
  if (btn.dataset.action === 'reload') {

/* ==========================================================================
   IFRAME PANE — skeleton, slow-load hint, seamless double-buffered refresh
   ========================================================================== */
function skeleton(kind = 'generic') {
  const sk = h('div', { class: 'skeleton', 'aria-hidden': 'true' });
  if (kind === 'list') {
    sk.append(h('div', { class: 'sk sk-title' }));
    for (let i = 0; i < 6; i++) {
      sk.append(
        h(
          'div',
          { class: 'sk-row' },
          h('div', { class: 'sk sk-avatar' }),
          h(
            'div',
            { style: { flex: '1', display: 'flex', flexDirection: 'column', gap: '8px' } },
            h('div', { class: 'sk sk-line', style: { width: `${70 - (i % 3) * 12}%` } }),
            h('div', { class: 'sk sk-line', style: { width: `${40 + (i % 2) * 15}%`, opacity: '.6' } }),
          ),
        ),
      );
    }
  } else {
    sk.append(
      h('div', { class: 'sk sk-title' }),
      h('div', { class: 'sk sk-line', style: { width: '80%' } }),
      h('div', { class: 'sk sk-line', style: { width: '60%' } }),
      h('div', { class: 'sk sk-block' }),
    );
  }
  return sk;
}

const frames = [];
function mountFrame(host, { url, title, zoom = 1, refreshMin = 0, allow = '', invert = false, rounded = false, skeletonKind }) {
  const wrap = h('div', { class: `frame${invert ? ' frame--invert' : ''}${rounded ? ' frame--rounded' : ''}` });
  const notice = h(
    'div',
    { class: 'frame-notice', hidden: true, role: 'status' },
    icon('alert'),
    h('span', null, 'Still loading… if this stays blank, the site may block embedding (X-Frame-Options).'),
    h('button', { type: 'button', onclick: () => hardReload() }, 'Retry'),
  );
  wrap.append(skeleton(skeletonKind), notice);
  host.replaceChildren(wrap);

  let current = null,
    slowTimer = 0,
    needsReloadOnReconnect = false;
  function makeIframe() {
    const f = h('iframe', { title, allow: allow || 'fullscreen', referrerpolicy: 'strict-origin-when-cross-origin' });
    if (zoom && zoom !== 1) {
      Object.assign(f.style, { width: `${100 / zoom}%`, height: `${100 / zoom}%`, transform: `scale(${zoom})`, transformOrigin: '0 0' });
    }
    return f;
  }
  function hardReload() {
    if (!navigator.onLine) needsReloadOnReconnect = true;
    clearTimeout(slowTimer);
    wrap.classList.remove('is-loaded');
    notice.hidden = true;
    current?.remove();
    current = makeIframe();
    current.classList.add('is-current');
    current.addEventListener(
      'load',
      () => {
        clearTimeout(slowTimer);
        wrap.classList.add('is-loaded');
        notice.hidden = true;
      },
      { once: true },
    );
    slowTimer = setTimeout(() => {
      notice.hidden = false;
    }, 15000);
    current.src = url;
    wrap.prepend(current);
  }
  // Seamless refresh: load a hidden buffer frame, swap only once it has loaded.
  let stale = false;
  function softReload() {
    if (!navigator.onLine) return;
    if (!isVisible(wrap)) {
      stale = true;
      return;
    } // catch up when the screen is shown again
    stale = false;
    if (!wrap.classList.contains('is-loaded')) return hardReload();
    const buffer = makeIframe();
    buffer.classList.add('is-buffer');
    const giveUp = setTimeout(() => buffer.remove(), 45000);
    buffer.addEventListener(
      'load',
      () => {
        clearTimeout(giveUp);
        buffer.classList.remove('is-buffer');
        buffer.classList.add('is-current');
        const old = current;
        current = buffer;
        setTimeout(() => old?.remove(), 700);
      },
      { once: true },
    );
    buffer.src = url;
    wrap.prepend(buffer);
  }
  hardReload();
  const stopRefresh = refreshMin > 0 ? every(refreshMin * 60000, softReload) : () => {};
  const resume = () => {
    if (stale) softReload();
  };
  resumers.add(resume);
  const api = {
    reload: hardReload,
    destroy() {
      stopRefresh();
      clearTimeout(slowTimer);
      resumers.delete(resume);
      frames.splice(frames.indexOf(api), 1);
    },
    onOnline() {
      if (needsReloadOnReconnect) {
        needsReloadOnReconnect = false;
        hardReload();
      }
    },
    onOffline() {
      needsReloadOnReconnect = true;
    },
  };
  frames.push(api);
  return api;
}

/* ---------- app/core/boot/65-ui.js ---------- */
/* ==========================================================================
   SHARED UI — pieces several widgets (or the screens) use: the analog clock,
   the weather component + feed, public holidays, the photo slideshow.
   Each takes a `scope` for its timers and subscriptions: a widget passes its
   ctx, so everything stops when the widget is removed; the dashboard itself
   passes GLOBAL_SCOPE.
   ========================================================================== */
/** Timers and subscriptions that live as long as the page (screens, photo backdrop). */
const GLOBAL_SCOPE = {
  onTick: (fn) => onTick(fn),
  subscribe: (feed, fn, el) => feed.subscribe(fn, el),
  observeResize: (el, fn) => {
    const ro = new ResizeObserver(fn);
    ro.observe(el);
    return () => ro.disconnect();
  },
  setInterval: (fn, ms) => every(ms, fn), // on the shared clock (lives as long as the page)
  setTimeout: (fn, ms) => setTimeout(fn, ms),
  clearTimeout: (id) => clearTimeout(id),
};

/* ==========================================================================
   ANALOG CLOCK (hero option + world clocks)
   ========================================================================== */
function analogClock({ tz, seconds = true } = {}, scope = GLOBAL_SCOPE) {
  let ticks = '';
  for (let i = 0; i < 60; i += seconds ? 1 : 5) {
    const major = i % 5 === 0;
    const a = (i / 60) * Math.PI * 2;
    const r1 = major ? 40 : 43,
      r2 = 46;
    ticks += `<line class="tick${major ? ' major' : ''}" x1="${50 + r1 * Math.sin(a)}" y1="${50 - r1 * Math.cos(a)}" x2="${50 + r2 * Math.sin(a)}" y2="${50 - r2 * Math.cos(a)}"/>`;
  }
  const el = svgEl(`<svg class="analog" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="face" cx="50" cy="50" r="49"/>${ticks}
    <line class="hand h" x1="50" y1="54" x2="50" y2="27"/>
    <line class="hand m" x1="50" y1="56" x2="50" y2="14"/>
    ${seconds ? '<line class="hand s" x1="50" y1="60" x2="50" y2="10"/>' : ''}
    <circle class="pin" cx="50" cy="50" r="2.4"/></svg>`);
  const [hh, mm, ss] = el.querySelectorAll('.hand');
  const partsFmt = tz ? new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false }) : null;
  const update = (now) => {
    let H = now.getHours(),
      M = now.getMinutes(),
      S = now.getSeconds();
    if (partsFmt) {
      const p = Object.fromEntries(partsFmt.formatToParts(now).map((x) => [x.type, x.value]));
      H = +p.hour % 24;
      M = +p.minute;
      S = +p.second;
    }
    hh.setAttribute('transform', `rotate(${(H % 12) * 30 + M * 0.5} 50 50)`);
    mm.setAttribute('transform', `rotate(${M * 6 + S * 0.1} 50 50)`);
    if (seconds) ss.setAttribute('transform', `rotate(${S * 6} 50 50)`);
    el.classList.toggle('is-night', H < 6 || H >= 20);
  };
  scope.onTick(update);
  return el;
}

const WMO = {
  0: ['Clear sky', 'sun'],
  1: ['Mainly clear', 'sun'],
  2: ['Partly cloudy', 'cloud-sun'],
  3: ['Overcast', 'cloud'],
  45: ['Fog', 'cloud-fog'],
  48: ['Rime fog', 'cloud-fog'],
  51: ['Light drizzle', 'cloud-drizzle'],

  55: ['Heavy drizzle', 'cloud-drizzle'],
  56: ['Freezing drizzle', 'cloud-drizzle'],
  57: ['Freezing drizzle', 'cloud-drizzle'],
  61: ['Light rain', 'cloud-rain'],
  63: ['Rain', 'cloud-rain'],
  65: ['Heavy rain', 'cloud-rain'],
  66: ['Freezing rain', 'cloud-rain'],
  67: ['Freezing rain', 'cloud-rain'],
  71: ['Light snow', 'cloud-snow'],
  73: ['Snow', 'cloud-snow'],
  75: ['Heavy snow', 'cloud-snow'],

  95: ['Thunderstorm', 'cloud-lightning'],

  99: ['Severe thunderstorm', 'cloud-lightning'],
};
const ICON_TONE = {
  sun: 'var(--amber)',
  moon: '#c7d2fe',
  'cloud-sun': '#fcd34d',
  'cloud-moon': '#c7d2fe',
  cloud: '#cbd5e1',

  'cloud-drizzle': 'var(--sky)',
  'cloud-rain': 'var(--sky)',
  'cloud-snow': '#e0f2fe',
  'cloud-lightning': 'var(--violet)',
};
function wmo(code, isDay = 1) {
  let [label, ic] = WMO[code] || ['—', 'cloud'];
  if (!isDay && ic === 'sun') ic = 'moon';
  if (!isDay && ic === 'cloud-sun') ic = 'cloud-moon';
  return { label, ic, tone: ICON_TONE[ic] || 'var(--text-2)' };
}
const FAHRENHEIT = cfg.TEMP_UNIT === 'fahrenheit';
const WIND_UNIT = FAHRENHEIT ? 'mph' : 'km/h';
const weatherFeed = createFeed(
  async () => {
    const q = new URLSearchParams({
      latitude: cfg.LATITUDE,
      longitude: cfg.LONGITUDE,
      timezone: 'auto',
      forecast_days: 7,
      current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day',
      hourly: 'temperature_2m,precipitation_probability,weather_code',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max',
      temperature_unit: FAHRENHEIT ? 'fahrenheit' : 'celsius',
      wind_speed_unit: FAHRENHEIT ? 'mph' : 'kmh',
    });
    return fetchJSON(`https://api.open-meteo.com/v1/forecast?${q}`);
  },
  cfg.WEATHER_REFRESH_MIN * 60000,
  { persist: `weather.${hashKey([cfg.LATITUDE, cfg.LONGITUDE, cfg.TEMP_UNIT].join())}` },
);

/** Moon phase (0 = new, .5 = full) from a known new moon + synodic month. */
function moonPhase(date = new Date()) {
  const synodic = 29.530588853;
  const days = (date - Date.UTC(2000, 0, 6, 18, 14)) / 864e5;
  const phase = (((days / synodic) % 1) + 1) % 1;
  const names = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  return { phase, name: names[Math.round(phase * 8) % 8], illumination: Math.round((1 - Math.cos(phase * 2 * Math.PI)) * 50) };
}
function moonSVG(phase) {
  const r = 10,
    k = Math.cos(2 * Math.PI * phase),
    waxing = phase < 0.5,
    rx = Math.abs(k) * r;
  const outer = waxing ? 1 : 0;
  const inner = waxing ? (k > 0 ? 0 : 1) : k > 0 ? 1 : 0;
  return svgEl(`<svg class="moon" viewBox="-11 -11 22 22"><circle r="${r}" fill="rgba(255,255,255,.12)"/>
    <path d="M0,${-r} A${r},${r} 0 0 ${outer} 0,${r} A${rx},${r} 0 0 ${inner} 0,${-r}" fill="#e2e8f0"/></svg>`);
}
const localDate = (s) => {
  const [d, t = '00:00'] = s.split('T');
  const [y, m, dd] = d.split('-').map(Number);
  const [hh, mi] = t.split(':').map(Number);
  return new Date(y, m - 1, dd, hh, mi);
};
function wxNowEls(d) {
  const c = d.current,
    w = wmo(c.weather_code, c.is_day);
  return [
    h('div', { class: 'wx-icon', style: { '--tone': w.tone } }, icon(w.ic)),
    h('div', { class: 'wx-temp' }, `${Math.round(c.temperature_2m)}°`),
    h(
      'div',
      { class: 'wx-main' },
      h('div', { class: 'wx-desc' }, `${w.label} · ${cfg.LOCATION_NAME}`),
      h(
        'div',
        { class: 'wx-sub' },
        `H ${Math.round(d.daily.temperature_2m_max[0])}° · L ${Math.round(d.daily.temperature_2m_min[0])}° · Feels ${Math.round(c.apparent_temperature)}°`,
      ),
    ),
  ];
}
/**
 * Forecast days. Same markup everywhere; CSS shows them as Apple-style rows with a
 * temperature-range bar when there's height, or as compact columns when there isn't.
 * With onPick they become buttons (tap → that day's hourly chart).
 */
function forecastEls(d, n = 5, { selected = null, onPick = null } = {}) {
  const lo = d.daily.temperature_2m_min.slice(0, n),
    hi = d.daily.temperature_2m_max.slice(0, n);
  const wMin = Math.min(...lo),
    wSpan = Math.max(1, Math.max(...hi) - wMin);
  return d.daily.time.slice(0, n).map((t, i) => {
    const dw = wmo(d.daily.weather_code[i], 1);
    const rain = d.daily.precipitation_probability_max?.[i];
    return h(
      onPick ? 'button' : 'div',
      {
        class: `fc-day${i === 0 ? ' is-today' : ''}${selected === i ? ' is-selected' : ''}`,
        type: onPick ? 'button' : null,
        'aria-pressed': onPick ? String(selected === i) : null,
        onclick: onPick ? () => onPick(i) : null,
      },
      h('span', { class: 'fc-name' }, i === 0 ? 'Today' : fmtWeekdayShort.format(localDate(t))),
      h('span', { class: 'fc-ic', style: { color: dw.tone } }, icon(dw.ic)),
      h('span', { class: 'fc-rain' }, rain >= 20 ? `${rain}%` : ''),
      h('span', { class: 'fc-lo' }, `${Math.round(lo[i])}°`),
      h('span', { class: 'fc-range' }, h('i', { style: { left: `${((lo[i] - wMin) / wSpan) * 100}%`, right: `${100 - ((hi[i] - wMin) / wSpan) * 100}%` } })),
      h('span', { class: 'fc-hi' }, `${Math.round(hi[i])}°`),
    );

}

/* ---------- Detailed weather: hourly chart, sun, UV, moon ---------- */
const fmtHour = new Intl.DateTimeFormat(LOCALE, { hour: 'numeric', hour12: cfg.HOUR_12 });
/** Temperature line + rain-chance bars: the next 24 h, or a whole forecast day (dayIdx). */
function drawHourly(host, d, dayIdx = null) {
  const W = host.clientWidth,
    H = host.clientHeight;
  if (W < 80 || H < 34) {
    host.replaceChildren();
    return;
  }
  const compact = H < 60; // slim strip: line + hours, no temperature labels
  const hr = d.hourly,
    cur = d.current.time.slice(0, 13);
  let i0 = dayIdx == null ? hr.time.findIndex((t) => t.slice(0, 13) >= cur) : hr.time.findIndex((t) => t.startsWith(d.daily.time[dayIdx]));
  if (i0 < 0) i0 = 0;
  const N = Math.min(dayIdx != null || W > 420 ? 24 : 12, hr.time.length - i0);
  if (N < 2) return;
  const temps = hr.temperature_2m.slice(i0, i0 + N),
    rain = (hr.precipitation_probability || []).slice(i0, i0 + N);
  // At least an 8° scale, so a mild day doesn't look like a cliff.
  const lo = Math.min(...temps),
    hi = Math.max(...temps),
    span = Math.max(8, hi - lo),
    min = lo - (span - (hi - lo)) / 2;
  const top = compact ? 2 : 20,
    bottom = compact ? 14 : 18,
    ch = H - top - bottom;
  const x = (i) => 10 + (i / (N - 1)) * (W - 20);
  const y = (t) => top + 4 + (1 - (t - min) / span) * ch * (compact ? 0.8 : 0.62);
  const pts = temps.map((t, i) => `${x(i).toFixed(1)},${y(t).toFixed(1)}`);
  const bars = rain
    .map((r, i) =>
      r > 0
        ? `<rect class="bar" x="${(x(i) - 3).toFixed(1)}" y="${(H - bottom - (r / 100) * ch * 0.32).toFixed(1)}" width="6" height="${((r / 100) * ch * 0.32).toFixed(1)}" rx="2"/>`
        : '',
    )
    .join('');
  const step = N > 12 ? (W < 360 ? 4 : 3) : 2;
  let labels = '';
  for (let i = 0; i < N; i += step) {
    labels += `<text x="${x(i).toFixed(1)}" y="${H - 3}" text-anchor="middle">${i === 0 && dayIdx == null ? 'Now' : fmtHour.format(localDate(hr.time[i0 + i]))}</text>`;
    if (!compact) labels += `<text class="t" x="${x(i).toFixed(1)}" y="${(y(temps[i]) - 7).toFixed(1)}" text-anchor="middle">${Math.round(temps[i])}°</text>`;
  }
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="wxGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(251,191,36,.16)"/><stop offset="1" stop-color="rgba(251,191,36,0)"/></linearGradient></defs>${bars}<polygon class="fill" points="${x(0)},${H - bottom} ${pts.join(' ')} ${x(N - 1)},${H - bottom}"/><polyline class="line" points="${pts.join(' ')}"/>${labels}</svg>`;
}
/** Quiet one-line facts: now (humidity, wind) or forecast day `i` (rain), plus sun, UV and moon. */
function wxStatsEls(d, i = null) {
  const day = d.daily,
    k = i ?? 0,
    stat = (ic, text) => h('span', { class: 'stat' }, icon(ic), text);
  const noon = localDate(day.time[k]);
  noon.setHours(12);
  const moon = moonPhase(noon);
  return [
    ...(i == null
      ? [stat('droplet', `${Math.round(d.current.relative_humidity_2m)}%`), stat('wind', `${Math.round(d.current.wind_speed_10m)} ${WIND_UNIT}`)]
      : [stat('cloud-rain', `${day.precipitation_probability_max?.[k] ?? 0}% rain`)]),
    stat('sunrise', timeStr(localDate(day.sunrise[k]))),
    stat('sunset', timeStr(localDate(day.sunset[k]))),
    stat('sun', `UV ${Math.round(day.uv_index_max?.[k] ?? 0)}`),
    h('span', { class: 'stat' }, moonSVG(moon.phase), moon.name),
  ];
}

/**
 * The one weather component, used by the Home clock and the Info weather panel alike:
 * current conditions · yellow temperature line with rain-chance bars · sun/UV/moon ·
 * tappable forecast days (tap → that day's hours; back to "next 24 h" after a minute).
 * It adapts to its box via container queries (see .wx in the CSS), not per-tab variants.
 */
function mountWeather(host, scope = GLOBAL_SCOPE) {
  const now = h('div', { class: 'wx-now' }, h('div', { class: 'wx-error' }, icon('cloud'), 'Loading weather…'));
  const cap = h('div', { class: 'chart-cap' });
  const chart = h('div', { class: 'wxd-chart' });
  const stats = h('div', { class: 'wxd-stats' });
  const fc = h('div', { class: 'forecast' });
  host.append(h('div', { class: 'wx' }, now, stats, h('div', { class: 'wx-graph' }, cap, chart), fc));
  let last = null,
    day = null,
    resetTimer = 0;
  // Facts that don't fit are dropped (never shown half-cut).
  const fitStats = () => {
    // One measurement, then removals (not measure → remove → measure… per chip).
    const limit = stats.clientHeight + 1,
      chips = [...stats.children];
    const top = (c) => (c.offsetParent === stats ? c.offsetTop : c.offsetTop - stats.offsetTop);
    const cut = chips.findIndex((c, i) => i > 0 && top(c) + c.offsetHeight > limit);
    if (cut > 0) chips.slice(cut).forEach((c) => c.remove());
  };
  const draw = () => {
    if (!last) return;
    drawHourly(chart, last, day);
    stats.replaceChildren(...wxStatsEls(last, day));
    fitStats();
  };
  function render() {
    if (!last) return;
    cap.replaceChildren(
      h('b', null, day == null ? 'Next 24 hours' : day === 0 ? 'Today' : fmtWeekday.format(localDate(last.daily.time[day]))),
      h('span', null, day == null ? '' : ' · tap again for now'),
    );
    fc.replaceChildren(...forecastEls(last, 5, { selected: day, onPick }));
    draw();
  }
  function onPick(i) {
    day = day === i ? null : i;
    scope.clearTimeout(resetTimer);
    if (day != null)
      resetTimer = scope.setTimeout(() => {
        day = null;
        render();
      }, 60000);
    render();
  }
  scope.subscribe(
    weatherFeed,
    (d, err) => {
      if (d) {
        last = d;
        now.replaceChildren(...wxNowEls(d));
        render();
      } else if (err && !now.querySelector('.wx-temp')) now.replaceChildren(h('div', { class: 'wx-error' }, icon('cloud'), 'Weather unavailable — retrying'));
    },
    host,
  );
  scope.observeResize(chart, () => requestAnimationFrame(draw));
}

/* ---------- Public holidays (Nager.Date, no key): calendar + countdowns ---------- */
const holidayCache = new Map();
async function loadHolidays() {
  const cc = cfg.HOLIDAY_COUNTRY.trim().toUpperCase();
  if (!cc) return [];
  const y = new Date().getFullYear();
  const out = [],
    seen = new Set();
  for (const year of [y, y + 1]) {
    const key = `${cc}${year}`;
    if (!holidayCache.has(key))
      holidayCache.set(
        key,
        fetchJSON(`https://date.nager.at/api/v3/PublicHolidays/${year}/${cc}`).catch((e) => {
          holidayCache.delete(key);
          throw e;
        }),
      );
    for (const hd of await holidayCache.get(key)) {
      const start = parseYMD(hd.date);
      const regions = hd.counties?.length ? ` (${hd.counties.map((c) => c.split('-')[1]).join(', ')})` : '';
      const title = `${hd.name}${regions}`;
      if (!start || seen.has(hd.date + title)) continue;
      seen.add(hd.date + title);
      out.push({ title, start, end: addDays(start, 1), allDay: true, color: '#fb7185', cal: 'Holidays', holiday: true });
    }
  }
  return out;
}

/* ---------- Photos: sources + slideshow (Photos widget, photo screens, background) ---------- */
// Capped at 1920 px wide: sharp on a tablet, ~3× less data than 4K-class originals.
const PHOTO_W = Math.min(1920, Math.round(Math.max(screen.width, screen.height) * Math.min(1.5, window.devicePixelRatio || 1)));
const PHOTO_H = Math.round(PHOTO_W * (Math.min(screen.width, screen.height) / Math.max(screen.width, screen.height) || 0.5625));
const PORTRAIT = window.matchMedia('(orientation: portrait)').matches;

function parsePhotoFeed(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('Not an RSS/Atom feed');

    feeds.forEach((r) => {

/**
 * Photo bytes: fetched once as a blob, kept in Cache Storage (survives the daily reload)
 * and in memory as object URLs — so a looping slideshow doesn't re-download, and the
 * data meter can count it. Hosts that block CORS fall back to a plain <img> load.

  if (photoMem.has(src)) return photoMem.get(src);
  let blob = null;

    const cache = 'caches' in window ? await caches.open('omd-photos-v1') : null;
    const hit = cache && (await cache.match(src));
    if (hit) blob = await hit.blob();
    else {
      const res = await fetch(src, { mode: 'cors', credentials: 'omit' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      blob = await res.clone().blob();
      if (cache) {
        await cache.put(src, res);
        const keys = await cache.keys();
        keys.slice(0, Math.max(0, keys.length - 80)).forEach((k) => cache.delete(k)); // keep the newest 80

    return src;

  const url = URL.createObjectURL(blob);
