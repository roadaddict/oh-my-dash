<style>
/* ==========================================================================
   DESIGN TOKENS
   ========================================================================== */
:root {
  /* Matches the transit app (oh-my-bussy): near-black, faint glass, BVG-yellow accent. */
  --bg: #050505;
  --glass: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.075);
  --blur: 12px;

  --text: #e2e8f0;
  --text-2: #a1a8b3;
  --text-3: #6b7280;

  --emerald: #34d399;  --emerald-rgb: 52, 211, 153;
  --amber:   #fbbf24;  --amber-rgb: 251, 191, 36;
  --crimson: #fb4f6b;  --crimson-rgb: 251, 79, 107;
  --accent:  #f0d722;  --accent-rgb: 240, 215, 34;
  --edit: var(--accent); --edit-rgb: var(--accent-rgb);     /* layout editor colour */
  --violet:  #b692ff;  --violet-rgb: 182, 146, 255;
  --cyan:    #5eead4;  --cyan-rgb: 94, 234, 212;
  --sky:     #7dd3fc;  --sky-rgb: 125, 211, 252;
  --spotify: #1ed760;  --spotify-rgb: 30, 215, 96;
  --strava: #fc5200;   --strava-rgb: 252, 82, 0;

  --radius: 22px;
  --radius-sm: 14px;
  --gap: clamp(10px, 1.5vmin, 18px);
  --pad: clamp(12px, 1.9vmin, 20px);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Outfit", var(--font);
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Updated at runtime (burn-in protection / night mode) */
  --shift-x: 0px;
  --shift-y: 0px;
  --night-veil: 0;
}

/* ==========================================================================
   BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-feature-settings: "cv11", "ss01", "tnum";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body.is-idle, body.is-idle * { cursor: none !important; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; }
.i { width: 20px; height: 20px; flex: none; display: block; }

/* ==========================================================================
   AMBIENT BACKGROUND
   ========================================================================== */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-orbs {
  position: absolute; inset: -15%;
  background:
    radial-gradient(circle at 15% 50%, rgba(76, 29, 149, .16), transparent 30%),
    radial-gradient(circle at 85% 30%, rgba(56, 189, 248, .09), transparent 30%),
    radial-gradient(circle at 60% 95%, rgba(76, 29, 149, .07), transparent 30%);
  animation: drift 90s ease-in-out infinite alternate;
}
/* Film grain, as in the transit app */
.bg-noise {
  position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
body.low-power .bg-noise { display: none; }
.bg-grid {
  position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 26px 26px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}
.bg-photos { position: absolute; inset: 0; }
.bg-photos .slideshow { background: transparent; }
.bg-photos::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,5,.6), rgba(5,5,5,.85)); }
@keyframes drift {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(3%, -2%, 0) scale(1.05); }
  100% { transform: translate3d(-2%, 3%, 0) scale(1.02); }
}

/* Night mode: dim veil, black screen, or minimal clock */
.night-veil {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  background: #000; opacity: var(--night-veil);
  transition: opacity 3s ease;
}
.night-clock {
  position: fixed; inset: 0; z-index: 91; pointer-events: none;
  display: grid; place-items: center; align-content: center; gap: 1vmin;
  color: rgba(255,255,255,.3); text-align: center;
  opacity: 0; transition: opacity 3s ease;
}
.night-clock.is-on { opacity: 1; }
.night-clock b { font-size: min(22vw, 30vmin); font-weight: 200; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.night-clock span { font-size: 2.6vmin; letter-spacing: .1em; text-transform: uppercase; }

/* ==========================================================================
   APP SHELL
   ========================================================================== */
.app {
  position: relative; z-index: 1;
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  gap: var(--gap);
  padding: var(--gap);
  padding-left: max(var(--gap), env(safe-area-inset-left));
  padding-right: max(var(--gap), env(safe-area-inset-right));
  transform: translate3d(var(--shift-x), var(--shift-y), 0);
  transition: transform 4s ease;
}

/* ---------- Status bar ---------- */
/* A system bar, not a widget: no card, it sits straight on the wallpaper. */
.statusbar {
  position: relative; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  min-height: 44px;
  padding: 0 2px 0 4px;
  border-radius: 16px;
  transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .45s;
}
.statusbar .chip { background: transparent; border-color: transparent; padding: 0 6px; }
.statusbar .icon-btn:not(:hover) { background: transparent; }
/* Screens without a status bar (photo frame): it slides in on tap, on a dark tint so it reads over the photo. */
.app.statusbar-auto .statusbar {
  position: absolute; top: var(--gap); left: var(--gap); right: var(--gap);
  transform: translateY(calc(-100% - var(--gap) - 4px)); opacity: 0;
  padding: 6px 8px 6px 14px;
  background: rgba(5,5,5,.7);
  backdrop-filter: blur(var(--blur)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
}
.app.statusbar-auto.show-bar .statusbar { transform: none; opacity: 1; }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 8px; flex: none;
  background: linear-gradient(135deg, var(--accent), #f59e0b);
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; padding: 5px;
  box-shadow: 0 4px 18px -4px rgba(var(--accent-rgb), .6);
}
.brand-mark i { background: rgba(5,5,5,.85); border-radius: 2px; }
.brand-mark i:first-child { grid-row: span 2; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand-date { color: var(--text-3); font-size: 13px; white-space: nowrap; }

.screen-tabs {
  display: flex; gap: 2px; padding: 3px; margin-left: 8px;
  border-radius: 999px; background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.05);
}
.screen-tab {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px; border: 0; border-radius: 999px;
  background: transparent; color: var(--text-3);
  font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background .25s, color .25s;
}
.screen-tab .i { width: 15px; height: 15px; }
.screen-tab:hover { color: var(--text-2); }
.screen-tab.is-active { background: rgba(255,255,255,.1); color: var(--text); }
.screen-tab .rot { width: 14px; height: 14px; margin-right: -4px; }
.rot circle { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 3; }
.rot circle.prog { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }

.status-chips { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }
.status-actions { display: flex; align-items: center; gap: 6px; }

.chip {
  --tone-rgb: 167, 175, 189;
  display: inline-flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 12px;
  border-radius: 999px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
  color: rgb(var(--tone-rgb));
  background: rgba(var(--tone-rgb), .1);
  border: 1px solid rgba(var(--tone-rgb), .22);
  transition: color .4s, background .4s, border-color .4s;
}
.chip .i { width: 16px; height: 16px; }
.chip .chip-sub { color: var(--text-3); font-weight: 400; }
.tone-good { --tone-rgb: var(--emerald-rgb); }
.tone-warn { --tone-rgb: var(--amber-rgb); }
.tone-bad  { --tone-rgb: var(--crimson-rgb); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--tone-rgb)); }
.dot.tone-good { animation: pulse 2.4s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(var(--tone-rgb), .55); }
  70% { box-shadow: 0 0 0 8px rgba(var(--tone-rgb), 0); }
  100% { box-shadow: 0 0 0 0 rgba(var(--tone-rgb), 0); }
}
.ping-value { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 6.5ch; }
#netChip { gap: 9px; }
.sparkline { width: 64px; height: 18px; overflow: visible; }
.sparkline polyline { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.sparkline .area { fill: currentColor; opacity: .12; stroke: none; }
.sparkline circle { fill: var(--crimson); }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 36px; height: 36px; padding: 0;
  border-radius: 11px; border: 1px solid transparent;
  background: rgba(255,255,255,.05); color: var(--text-2);
  cursor: pointer;
  transition: background .2s, color .2s, transform .15s;
}
.icon-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn .i { width: 18px; height: 18px; }

/* ---------- Screens ---------- */
.screens { position: relative; flex: 1; min-height: 0; }
.screen {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transform: translateX(var(--enter, 24px));
  transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1), visibility 0s .6s;
}
.screen.is-active { opacity: 1; visibility: visible; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
/* No z-index here: it would trap a fullscreen (expanded) widget below the frosted scrim.
   The photo backdrop (z-index 0, earlier in the page) still paints underneath. */
.screen > .grid { position: relative; height: 100%; display: grid; gap: var(--gap); }
/* Split-tree layouts: JS computes each widget's box (see layoutScreen) */
.screen > .grid.is-tree { display: block; }
.grid.is-tree > .panel:not(.is-expanded) { position: absolute; left: var(--x, 0); top: var(--y, 0); width: var(--w, 100%); height: var(--h, 100%); }
.grid > .panel.is-off { display: none !important; }
.screen-photo { position: fixed; inset: 0; z-index: 0; }
.screen-photo::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(0deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.08) 45%, rgba(0,0,0,0) 60%),
    linear-gradient(270deg, rgba(0,0,0,.35), transparent 40%);
}
.app.has-photo-screen .statusbar { text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.app.has-photo-screen:not(.statusbar-auto) .screen-photo::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 120px; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.55), transparent);
}

/* ---------- Glass panel ---------- */
.panel {
  --tint: var(--accent);
  --tint-rgb: var(--accent-rgb);
  position: relative;
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  padding: var(--pad);
  border-radius: var(--radius);
  /* ⚙ → Widget background (0–20 %): --glass-k fades the frosted glass, its blur and border in */
  background: rgba(255,255,255,calc(.04 * var(--glass-k, 1)));
  border: 1px solid rgba(255,255,255,calc(.075 * var(--glass-k, 1)));
  backdrop-filter: blur(calc(var(--blur) * var(--glass-k, 1))) saturate(calc(1 + .4 * var(--glass-k, 1)));
  -webkit-backdrop-filter: blur(calc(var(--blur) * var(--glass-k, 1))) saturate(calc(1 + .4 * var(--glass-k, 1)));
  box-shadow: inset 0 1px 0 rgba(255,255,255,calc(.05 * var(--glass-k, 1))), 0 24px 48px -24px rgba(0,0,0,calc(.9 * var(--glass-k, 1)));
  overflow: hidden;
}
.panel::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 30%);
}
.screen.is-active .grid > .panel { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.screen.is-active .grid > .panel:nth-child(2) { animation-delay: .05s; }
.screen.is-active .grid > .panel:nth-child(3) { animation-delay: .1s; }
.screen.is-active .grid > .panel:nth-child(4) { animation-delay: .15s; }
.screen.is-active .grid > .panel:nth-child(5) { animation-delay: .2s; }
.screen.is-active .grid > .panel:nth-child(n+6) { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }

.panel.is-bare { background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; overflow: visible; }
.panel.is-bare::before { display: none; }
/* Seamless embed (transit app): no border, header or padding — just the app, edge to edge. */
.panel.is-seamless { padding: 0; background: #050505; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.panel.is-seamless::before { display: none; }
.panel.is-seamless .frame { border-radius: var(--radius); box-shadow: none; }
.panel.is-dark { background: rgba(5, 5, 5, .66); border-color: rgba(255,255,255,.1); }
.panel.is-dark .event-sub, .panel.is-dark .panel-meta, .panel.is-dark .day-label { color: rgba(255,255,255,.62); }
.panel.is-dark .day-label.is-today { color: var(--accent); }
.panel.is-compact { padding: clamp(10px, 1.5vmin, 16px) var(--pad); }

.t-emerald { --tint: var(--emerald); --tint-rgb: var(--emerald-rgb); }
.t-accent  { --tint: var(--accent);  --tint-rgb: var(--accent-rgb); }
.t-spotify { --tint: var(--spotify); --tint-rgb: var(--spotify-rgb); }
.t-strava { --tint: var(--strava); --tint-rgb: var(--strava-rgb); }
.t-amber   { --tint: var(--amber);   --tint-rgb: var(--amber-rgb); }
.t-crimson { --tint: var(--crimson); --tint-rgb: var(--crimson-rgb); }
.t-violet  { --tint: var(--violet);  --tint-rgb: var(--violet-rgb); }
.t-cyan    { --tint: var(--cyan);    --tint-rgb: var(--cyan-rgb); }
.t-sky     { --tint: var(--sky);     --tint-rgb: var(--sky-rgb); }

.panel-head {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: clamp(10px, 1.4vmin, 14px);
  min-height: 36px;
}
.panel-icon {
  display: grid; place-items: center; flex: none;
  width: 32px; height: 32px; border-radius: 10px;
  color: var(--tint);
  background: rgba(var(--tint-rgb), .13);
  box-shadow: inset 0 0 0 1px rgba(var(--tint-rgb), .22);
}
.panel-icon .i { width: 17px; height: 17px; }
.panel-title { display: flex; flex-direction: column; min-width: 0; }
.panel-title h2 {
  margin: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--text-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.panel-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-actions { display: flex; gap: 6px; margin-left: auto; }
.panel-actions .icon-btn { width: 34px; height: 34px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--tint); background: rgba(var(--tint-rgb), .12);
}
.legend { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.panel-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Expanded (full-screen) panel */
.panel.is-expanded {
  position: fixed; z-index: 60;
  inset: max(var(--gap), 12px);
  animation: none !important;
  background: rgba(10, 10, 10, .96);
}
.scrim {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(5, 6, 8, .55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.scrim.is-visible { opacity: 1; pointer-events: auto; }
/* Dragging the widget background slider: the scrim steps aside so the widgets show */
body.settings-peek .scrim.is-visible { opacity: 0; }
.settings-top { margin: 0 0 18px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.03); }
.settings-top .field { margin: 0 0 12px; }
.settings-top .field:last-child { margin: 0; }
.bg-steps { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.08); }
.bg-step { flex: 1; position: relative; }
.bg-step input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.bg-step span { display: block; padding: 8px 0; border-radius: 9px; text-align: center; font-size: 13px; font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; transition: background .2s, color .2s; }
.bg-step input:checked + span { background: rgba(var(--accent-rgb), .18); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .45); }
.bg-step input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

.empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  text-align: center; color: var(--text-3); font-size: 13px; padding: 12px;
}
.empty .i { width: 28px; height: 28px; opacity: .6; }
.empty small { max-width: 34ch; line-height: 1.45; }
.muted { color: var(--text-3); }
.scroll-y {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  mask-image: linear-gradient(180deg, #000 88%, transparent);
  -webkit-mask-image: linear-gradient(180deg, #000 88%, transparent);
  padding-bottom: 14px;
}
.scroll-y::-webkit-scrollbar { display: none; }

.cta {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 14px; border-radius: 12px;
  border: 1px dashed rgba(255,255,255,.16);
  background: rgba(255,255,255,.03);
  color: var(--text-2); font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s;
}
.cta:hover { background: rgba(255,255,255,.07); color: var(--text); }
.cta .i { width: 16px; height: 16px; }

/* ==========================================================================
   IFRAME FRAMES + SKELETONS
   ========================================================================== */
.frame {
  position: relative; flex: 1; min-height: 0;
  border-radius: var(--radius-sm); overflow: hidden;
  background: #050505; /* same as the transit app, so the embed blends in */
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
}
/* Fallback parameter overlay — iframe defaults */
.frame > iframe {
  zoom: 100%; width: 100%; height: 100%; border: none;
  position: absolute; inset: 0; display: block;
  background: transparent;
  opacity: 0; transition: opacity .6s ease;
  color-scheme: normal;
}
.frame.is-loaded > iframe.is-current { opacity: 1; }
.frame > iframe.is-buffer { opacity: 0 !important; pointer-events: none; }
.frame--invert > iframe { filter: invert(.92) hue-rotate(180deg) saturate(.9) contrast(.92); }
.frame--rounded > iframe { border-radius: 12px; }

.skeleton { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px; transition: opacity .5s ease; }
.frame.is-loaded .skeleton { opacity: 0; pointer-events: none; }
.sk {
  border-radius: 8px;
  background: linear-gradient(90deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.10) 45%, rgba(255,255,255,.04) 90%);
  background-size: 250% 100%;
  animation: shimmer 1.5s linear infinite;
}
.sk-title { height: 18px; width: 45%; }
.sk-line  { height: 12px; }
.sk-block { flex: 1; min-height: 40px; border-radius: 12px; }
.sk-row   { display: flex; gap: 12px; align-items: center; }
.sk-avatar{ width: 38px; height: 38px; border-radius: 11px; flex: none; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }

.frame-notice {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 12px;
  font-size: 12.5px; color: var(--text-2);
  background: rgba(20, 23, 29, .92);
  border: 1px solid rgba(var(--amber-rgb), .3);
}

.frame-notice button { margin-left: auto; flex: none; padding: 6px 10px; border-radius: 8px; border: 0; background: rgba(255,255,255,.08); cursor: pointer; font-size: 12px; }

/* ==========================================================================
   CLOCK + WEATHER
   ========================================================================== */
/* Home hero: clock on top, the shared weather component below a hairline. */
.b-clock.v-full { container: hero / size; }
.hero {
  flex: 1; min-height: 0;
  display: grid; row-gap: clamp(10px, 3cqh, 22px);
  grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas: "top" "clock" "wx";
}
.hero-wx { grid-area: wx; min-height: 0; display: flex; flex-direction: column; padding-top: clamp(12px, 3cqh, 22px); border-top: 1px solid rgba(255,255,255,.07); }
.hero-top { grid-area: top; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-width: 0; }
.greeting { font-size: clamp(13px, 1.7vmin, 16px); color: var(--text-2); font-weight: 500; }
.hero-date { font-size: clamp(13px, 1.7vmin, 16px); color: var(--text-3); text-align: right; }
.clock { grid-area: clock; display: flex; align-items: flex-start; gap: 8px; line-height: .9; font-variant-numeric: tabular-nums; }
.clock-hm {
  font-size: clamp(44px, min(22cqi, 11vmin), 150px);
  font-family: var(--font-display); font-weight: 200; letter-spacing: -.03em;
  background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,.55));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.clock-side { display: flex; flex-direction: column; gap: 6px; padding-top: .5em; font-size: clamp(13px, 2vmin, 20px); }
.clock-sec { color: var(--text-3); font-weight: 300; }
.clock-ampm { color: var(--text-2); font-weight: 600; font-size: .75em; letter-spacing: .06em; }
.hero .analog { grid-area: clock; align-self: center; justify-self: center; width: min(100%, 22vmin); height: auto; aspect-ratio: 1; }
/* Wide (portrait Home): greeting + date on the left, big clock on the right, weather full width below */
@container hero (min-width: 540px) {
  .hero { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top clock" "wx wx"; column-gap: clamp(20px, 4cqi, 48px); }
  .hero-top { flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; text-align: left; }
  .hero .clock { justify-self: end; }
  .hero .greeting { font-size: clamp(16px, 2.6cqi, 24px); color: var(--text); font-weight: 400; }
  .hero .hero-date { font-size: clamp(14px, 2cqi, 18px); }
  .hero .clock-hm { font-size: clamp(64px, min(17cqi, 26cqh), 160px); }
  .hero .clock { padding-top: clamp(2px, 1.2cqh, 8px); }
}
/* Wide but short: clock and weather side by side */
@container hero (min-width: 540px) and (max-height: 360px) {
  .hero { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "top top" "clock wx"; }
  .hero-top { flex-direction: row; align-items: baseline; justify-content: space-between; text-align: right; }
  .hero .clock { justify-self: start; }
  .hero .greeting { font-size: clamp(13px, 1.7vmin, 16px); color: var(--text-2); }
  .hero .clock { align-self: center; }
  .hero .clock-hm { font-size: clamp(56px, min(16cqi, 14vmin), 150px); }
  .hero-wx { padding-top: 0; border-top: 0; }
}

.analog .face { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.12); stroke-width: 1; }
.analog .tick { stroke: rgba(255,255,255,.35); stroke-width: 1.2; stroke-linecap: round; }
.analog .tick.major { stroke: rgba(255,255,255,.75); stroke-width: 2; }
.analog .hand { stroke: #fff; stroke-linecap: round; }
.analog .hand.h { stroke-width: 4; }
.analog .hand.m { stroke-width: 2.6; }
.analog .hand.s { stroke: var(--accent); stroke-width: 1.2; }
.analog .pin { fill: var(--accent); }
.analog.is-night .face { fill: rgba(0,0,0,.25); }

/* Compact variant (Family screen header) */
.b-clock.v-compact { container-type: inline-size; }
.b-clock.v-compact .hero-row { display: flex; align-items: center; gap: clamp(12px, 2vmin, 22px); min-width: 0; height: 100%; }
.b-clock.v-compact .clock-hm { font-size: clamp(38px, 6.5vmin, 72px); }
.b-clock.v-compact .clock { align-self: auto; }
.b-clock.v-compact .stack { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.b-clock.v-compact .stack .hero-date { text-align: left; color: var(--text); font-weight: 500; white-space: nowrap; }
.b-clock.v-compact .wx-mini { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.b-clock.v-compact .wx-mini .i { width: 30px; height: 30px; stroke-width: 1.5; }
.b-clock.v-compact .wx-mini b { font-size: clamp(22px, 3.4vmin, 34px); font-weight: 300; }
.b-clock.v-compact .wx-mini { flex: none; }
.b-clock.v-compact .wx-mini small { display: block; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.b-clock.v-compact .stack .hero-date, .b-clock.v-compact .stack .greeting { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@container (max-width: 470px) {
  .b-clock.v-compact .clock-hm { font-size: clamp(34px, 12cqi, 56px); }
  .b-clock.v-compact .clock-side, .b-clock.v-compact .wx-mini small { display: none; }
}

/* Overlay variant (Photo frame) */
.b-clock.v-overlay { justify-content: flex-end; text-shadow: 0 2px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.35); padding: 0 0 4px 6px; }
.b-clock.v-overlay .ov-date { font-size: clamp(16px, 2.8vmin, 30px); font-weight: 500; color: rgba(255,255,255,.92); }
.b-clock.v-overlay .clock-hm { font-size: clamp(80px, 17vmin, 230px); background: none; color: #fff; -webkit-background-clip: border-box; background-clip: border-box; }
.b-clock.v-overlay .clock { align-self: flex-start; }
.b-clock.v-overlay .clock-sec, .b-clock.v-overlay .clock-ampm { color: rgba(255,255,255,.75); }
.b-clock.v-overlay .analog { width: clamp(120px, 26vmin, 280px); height: auto; filter: drop-shadow(0 4px 20px rgba(0,0,0,.4)); }
.b-clock.v-overlay .ov-wx { display: flex; align-items: center; gap: clamp(14px, 2.4vmin, 28px); margin-top: clamp(8px, 1.4vmin, 16px); flex-wrap: wrap; }
.b-clock.v-overlay .ov-now { display: flex; align-items: center; gap: 10px; }
.b-clock.v-overlay .ov-now .i { width: clamp(34px, 5vmin, 56px); height: clamp(34px, 5vmin, 56px); stroke-width: 1.4; }
.b-clock.v-overlay .ov-now b { font-size: clamp(28px, 5vmin, 56px); font-weight: 300; }
.b-clock.v-overlay .ov-now span { font-size: 13px; color: rgba(255,255,255,.85); display: block; }
.b-clock.v-overlay .ov-fc { display: flex; gap: clamp(10px, 1.8vmin, 20px); padding-left: clamp(14px, 2.4vmin, 28px); border-left: 1px solid rgba(255,255,255,.25); }
.b-clock.v-overlay .ov-fc div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12.5px; color: rgba(255,255,255,.9); }
.b-clock.v-overlay .ov-fc .i { width: 22px; height: 22px; filter: drop-shadow(0 1px 4px rgba(0,0,0,.4)); }

/* Shared weather component (.wx) — Home clock and Info weather. Adapts to its own box:
   narrow → stacked; tall → forecast as rows with range bars; wide → now | chart side by side. */
.hero-wx, .b-weather .panel-body { container: wx / size; }
.wx {
  flex: 1; min-height: 0; height: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "now" "stats" "graph" "fc";
  row-gap: clamp(8px, 2.4cqh, 18px);
}
.wx-now { grid-area: now; display: flex; align-items: center; gap: clamp(10px, 2.2cqi, 16px); min-width: 0; }
.wx-icon {
  --tone: var(--amber);
  display: grid; place-items: center; flex: none;
  width: clamp(40px, 5.5vmin, 54px); height: clamp(40px, 5.5vmin, 54px);
  border-radius: 16px; color: var(--tone);
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.09), rgba(255,255,255,.02));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
}
.wx-icon .i { width: 58%; height: 58%; stroke-width: 1.5; }
.wx-temp { flex: none; font-family: var(--font-display); font-size: clamp(36px, 6vmin, 60px); font-weight: 200; letter-spacing: -.04em; line-height: .9; }
.wx-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.wx-desc { font-size: clamp(13px, 1.7vmin, 16px); color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wx-sub { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.wx-error { color: var(--text-3); font-size: 13px; display: flex; align-items: center; gap: 8px; }

/* One quiet line of facts; whatever doesn't fit is dropped by JS. */
.wxd-stats { grid-area: stats; display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 6px; height: 18px; overflow: hidden; }
.stat { display: inline-flex; align-items: center; gap: 5px; height: 18px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .i { width: 14px; height: 14px; color: var(--text-3); }
.stat svg.moon { width: 14px; height: 14px; }

.wx-graph { grid-area: graph; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: 0; min-width: 0; }
.chart-cap { flex: none; font-size: 11px; color: var(--text-3); font-family: var(--font-mono); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart-cap b { color: var(--accent); font-weight: 500; }
.wxd-chart { position: relative; flex: 1 1 auto; min-height: 64px; max-height: 150px; min-width: 0; }
.wxd-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wxd-chart .line { fill: none; stroke: var(--amber); stroke-width: 2; stroke-linejoin: round; }
.wxd-chart .fill { fill: url(#wxGrad); }
.wxd-chart .bar { fill: rgba(var(--sky-rgb), .45); }
.wxd-chart text { fill: var(--text-3); font-size: 10px; font-family: var(--font); }
.wxd-chart text.t { fill: var(--text-2); font-size: 10.5px; font-weight: 600; }

/* Forecast days: compact columns by default */
.forecast { grid-area: fc; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.fc-day {
  display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "name name" "ic ic" "hi lo" "rain rain";
  justify-items: center; align-content: center; row-gap: 3px; column-gap: 4px;
  padding: 5px 2px; border-radius: 10px; background: transparent;
  font-size: 12px; line-height: 1.2; color: var(--text-2); font-variant-numeric: tabular-nums;
}
.fc-name { grid-area: name; }
.fc-ic { grid-area: ic; display: flex; }
.fc-day .i { width: 20px; height: 20px; }
.fc-hi { grid-area: hi; justify-self: end; color: var(--text); font-weight: 600; }
.fc-lo { grid-area: lo; justify-self: start; color: var(--text-3); }
.fc-rain { grid-area: rain; font-size: 10.5px; color: var(--sky); min-height: 1em; }
.fc-range { display: none; }
.fc-day.is-today .fc-name { color: var(--accent); font-weight: 600; }
/* font-family only: the `font` shorthand would also reset the size to the widget's (16 px) */
button.fc-day { border: 0; font-family: inherit; cursor: pointer; transition: background .2s, box-shadow .2s; }
button.fc-day:active { transform: scale(.98); }
.fc-day.is-selected { background: rgba(var(--accent-rgb), .12); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .45); color: var(--text); }

/* Tall and not too wide: Apple-style rows — day · icon · rain · low ━━━ high */
@container wx (min-height: 430px) and (max-width: 599px) {
  .forecast { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .fc-day {
    grid-template-columns: 4.6em 24px 2.8em 2.4em minmax(40px, 1fr) 2.4em; grid-template-areas: "name ic rain lo range hi";
    justify-items: start; align-items: center; column-gap: 10px;
    padding: 8px 10px; border-radius: 10px; font-size: 14px;
  }
  .fc-day:not(:last-child):not(.is-selected) { box-shadow: inset 0 -1px 0 rgba(255,255,255,.05); }
  .fc-day .i { width: 20px; height: 20px; }
  .fc-rain { font-size: 12px; }
  .fc-lo, .fc-hi { justify-self: end; }
  .fc-range { display: block; grid-area: range; justify-self: stretch; position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,.07); }
  .fc-range i { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, var(--sky), var(--amber)); }
}
/* Wide (Home clock in portrait, Info): conditions + facts | compact days, chart full width underneath */
@container wx (min-width: 540px) {
  .wx {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    grid-template-rows: auto auto auto;
    grid-template-areas: "now fc" "stats fc" "graph graph";
    align-content: center;   /* spare height goes around the block, not into the chart */
    column-gap: clamp(16px, 3cqi, 32px); row-gap: 12px;
  }
  .wx-now { align-self: center; }
  .wxd-stats { align-self: start; }
  .wx-graph .wxd-chart { flex: none; height: 120px; min-height: 0; max-height: none; }
  .forecast { align-self: stretch; }
  /* Days fill the height of conditions + facts: name level with the temperature, °C line level with the facts */
  .fc-day { grid-template-columns: 1fr 1fr; grid-template-areas: "name name" "ic ic" "hi lo"; align-content: space-between; padding: 2px 2px 0; row-gap: 3px; }
  .fc-day .i { width: 22px; height: 22px; }
  .fc-hi { justify-self: end; } .fc-lo { justify-self: start; }
  .fc-rain { display: none; }
}
/* …and short (Info panel): no facts line or chart caption */
@container wx (min-width: 540px) and (max-height: 220px) {
  .wx { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "now fc" "graph graph"; row-gap: 8px; align-content: stretch; }
  .wx-graph .wxd-chart { flex: 1 1 auto; height: auto; min-height: 28px; }
  .fc-day { padding: 3px 2px; font-size: 12px; align-content: center; }
  .fc-day .i { width: 20px; height: 20px; }
  .wx .chart-cap { display: none; }
}
@container wx (min-width: 540px) and (max-width: 720px) and (max-height: 220px) { .wx { grid-template-columns: auto minmax(0, 1fr); } .wx .wx-main { display: none; } }
/* Narrow and short: mini days between now and the chart */
@container wx (max-width: 539px) and (max-height: 250px) {
  .wx { grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "now" "fc" "graph"; row-gap: 8px; }
  .fc-day { padding: 2px; row-gap: 2px; font-size: 12px; grid-template-areas: "name name" "hi lo"; }
  .fc-ic, .fc-rain, .wx .chart-cap { display: none; }
  /* This layout has no "stats" area: a visible facts line would add implicit grid columns and crush the days */
  .wx .wxd-stats { display: none; }
}
@container wx (max-width: 539px) and (max-height: 175px) { .wx .forecast { display: none; } }
@container wx (max-width: 539px) and (max-height: 120px) { .wx .forecast { display: none; } }
/* Wide and very short: days stay (they sit beside the conditions); the chart goes first */
@container wx (min-width: 540px) and (max-height: 78px) { .wx .wx-graph { display: none; } }
@container wx (max-height: 220px) { .wx .wxd-stats { display: none; } }

/* ==========================================================================
   TRANSPORT DEMO BOARD
   ========================================================================== */
.board { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.board-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(var(--emerald-rgb), .12), rgba(255,255,255,.03));
  box-shadow: inset 0 0 0 1px rgba(var(--emerald-rgb), .18);
}
.board-station { font-size: clamp(16px, 2.2vmin, 20px); font-weight: 600; letter-spacing: -.01em; }

.line-badge {
  min-width: 44px; height: 30px; padding: 0 8px;

  color: #0d0f12; background: var(--c);
}
.line-badge .i { width: 14px; height: 14px; stroke-width: 2.2; }
.dep-dest { font-size: clamp(14px, 1.8vmin, 16px); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dep-info { font-size: 12px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ontime { color: var(--emerald); }
.dep-eta { text-align: right; font-variant-numeric: tabular-nums; line-height: 1; }

/* ==========================================================================
   CALENDAR — agenda / week / month / up next
   ========================================================================== */
.agenda { display: flex; flex-direction: column; gap: 14px; }
.day-label {
  display: flex; align-items: baseline; gap: 8px;

  text-transform: uppercase; letter-spacing: .12em; color: var(--text-3);
}

.day-label span { font-weight: 400; letter-spacing: .02em; text-transform: none; }

.event {
  display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 11px; align-items: center;
  padding: 9px 11px 9px 9px; border-radius: 12px;
  background: rgba(255,255,255,.035);
}
.event-bar { align-self: stretch; border-radius: 3px; background: var(--c, var(--accent)); }
.event-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

.panel.is-dark .event { background: rgba(255,255,255,.06); }

.month { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; }
.month-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding-left: 6px; }
.month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 4px; min-height: 0; }
.m-cell { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px; padding: 5px; border-radius: 10px; background: rgba(255,255,255,.03); }
.m-cell.is-out { opacity: .38; }
.m-cell.is-weekend { background: rgba(255,255,255,.018); }
.m-cell.is-today { background: rgba(var(--accent-rgb), .13); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .35); }
.m-num { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 0 2px 1px; font-variant-numeric: tabular-nums; flex: none; }
.is-today .m-num { color: var(--accent); }
.m-ev { font-size: 11px; line-height: 1.35; padding: 1px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
.m-ev.all { background: var(--cbg); color: #fff; }
.m-ev.timed::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 4px; vertical-align: 1px; }

.week { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.w-col { display: flex; flex-direction: column; gap: 5px; min-height: 0; overflow: hidden; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,.03); }
.w-col.is-today { background: rgba(var(--accent-rgb), .1); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .25); }
.w-head { text-align: center; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.w-head b { display: block; font-size: clamp(16px, 2.4vmin, 22px); font-weight: 300; letter-spacing: 0; color: var(--text); }
.is-today .w-head, .is-today .w-head b { color: var(--accent); }
.w-ev { font-size: 11.5px; padding: 5px 6px; border-radius: 7px; border-left: 3px solid var(--c); background: rgba(255,255,255,.04); overflow: hidden; flex: none; }
.w-ev span { display: block; color: var(--text-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.w-ev b { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.upnext { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.upnext-hero { padding: 16px; border-radius: 16px; background: linear-gradient(135deg, rgba(var(--c-rgb, var(--accent-rgb)), .2), rgba(255,255,255,.03)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }

.upnext-hero.is-live small { color: var(--c, var(--accent)); }
.upnext-hero.is-live small::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; vertical-align: 1px; animation: pulse 2s ease-in-out infinite; }
.upnext-also { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.upnext-also b { color: var(--text-2); font-weight: 600; margin-right: 4px; }

/* ==========================================================================
   TILES (smart home / data widgets)
   ========================================================================== */
.tiles-host { container-type: size; }
.tiles { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
@container (min-width: 480px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile {
  --c: var(--text-2); --c-rgb: 167, 175, 189;
  display: flex; align-items: center; gap: 10px;
  min-height: 0; overflow: hidden; padding: 8px 12px; border-radius: 14px;
  background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.05);
  text-align: left; cursor: default;
  transition: background .3s, border-color .3s;
}
button.tile { cursor: pointer; }
button.tile:active { transform: scale(.98); }
.tile-icon {
  display: grid; place-items: center; flex: none;
  width: clamp(32px, 4.4vmin, 40px); height: clamp(32px, 4.4vmin, 40px); border-radius: 11px;
  color: var(--c); background: rgba(var(--c-rgb), .12);
  transition: color .3s, background .3s, box-shadow .3s;
}
.tile-icon .i { width: 55%; height: 55%; }
.tile-text { min-width: 0; }
.tile-label { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-value { font-size: clamp(14px, 1.9vmin, 17px); font-weight: 600; margin-top: 1px; white-space: nowrap; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.tile-value small { font-size: .7em; color: var(--text-3); font-weight: 500; margin-left: 3px; }
.panel.is-expanded .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
/* Big tiles (icon above the text) need ~125 px per tile: 3 rows of 2 below 480 px wide, 2 rows of 3 above */
@container ((max-width: 479px) and (min-height: 400px)) or ((min-width: 480px) and (min-height: 270px)) {
  .tiles .tile { flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px; }
  .tiles .tile-icon { width: clamp(38px, 5vmin, 48px); height: clamp(38px, 5vmin, 48px); border-radius: 13px; }
  .tiles .tile-label { font-size: 12.5px; }
  .tiles .tile-value { font-size: clamp(18px, 2.6vmin, 26px); font-weight: 500; letter-spacing: -.01em; }
}
.b-data .tile { flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; }
.tile.is-on { background: linear-gradient(135deg, rgba(var(--c-rgb), .16), rgba(var(--c-rgb), .04)); border-color: rgba(var(--c-rgb), .28); }
.tile.is-on .tile-icon { color: #0d0f12; background: var(--c); box-shadow: 0 0 18px -2px rgba(var(--c-rgb), .6); }
.tile.is-offline { opacity: .45; }
.tile-warn { display: inline-flex; color: var(--crimson); margin-right: 4px; vertical-align: -2px; }
.tile-warn .i { width: 13px; height: 13px; }
.c-amber   { --c: var(--amber);   --c-rgb: var(--amber-rgb); }
.c-emerald { --c: var(--emerald); --c-rgb: var(--emerald-rgb); }
.c-sky     { --c: var(--sky);     --c-rgb: var(--sky-rgb); }
.c-crimson { --c: var(--crimson); --c-rgb: var(--crimson-rgb); }
.c-accent  { --c: var(--accent);  --c-rgb: var(--accent-rgb); }
.c-violet  { --c: var(--violet);  --c-rgb: var(--violet-rgb); }

/* ==========================================================================
   SPOTIFY
   ========================================================================== */
/* Spotify's player only renders cleanly at 80 / 152 / 352 px: JS snaps to the largest that fits. */
.b-spotify .panel-body { justify-content: center; }
.b-spotify .frame { flex: none; height: 152px; background: transparent; box-shadow: none; }
.b-spotify.is-expanded .frame { flex: 1; height: auto; }
.spotify-glow { position: absolute; inset: auto -20% -40% -20%; height: 70%; background: radial-gradient(closest-side, rgba(30,215,96,.14), transparent); pointer-events: none; }
/* Now Playing: art + track + progress + controls; stacks when the cell is portrait */
.np-host { container-type: size; min-height: 132px; }   /* size containers have no intrinsic height: keeps "auto" layout rows usable */
.np { flex: 1; min-height: 0; display: flex; align-items: center; gap: clamp(10px, 4cqw, 18px); }
.np-art {
  flex: none; height: min(100cqh, 42cqw); aspect-ratio: 1; border-radius: 12px; overflow: hidden;
  display: grid; place-items: center; color: var(--text-3);
  background: rgba(255,255,255,.04); box-shadow: 0 10px 30px -12px rgba(0,0,0,.8);
}
.np-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.np-art > .i { width: 34%; height: 34%; opacity: .5; }

.np-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
.np-bar i { display: block; height: 100%; width: 0; background: var(--spotify); border-radius: inherit; }
.np-times { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.np-controls { display: flex; align-items: center; gap: 10px; }
/* Volume: shares the progress bar's place */
.np-vol { display: none; align-items: center; gap: 10px; height: 26px; }

.np-mid.show-vol .np-vol { display: flex; }

.np-vol input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--spotify) var(--v, 50%), rgba(255,255,255,.12) var(--v, 50%)); }
.np-vol input::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--spotify) var(--v, 50%), rgba(255,255,255,.12) var(--v, 50%)); }
.np-vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.np-vol input::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #fff; }
.np-vol-val { flex: none; min-width: 4ch; text-align: right; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.np-vol-btn { margin-left: auto; }
.np-vol-btn.is-on { color: var(--spotify); }
.np-vol-btn[hidden] { display: none; }
.np-btn { width: 40px; height: 40px; }
.np-btn .i { fill: currentColor; }
.np-btn.is-main { width: 48px; height: 48px; border-radius: 50%; background: var(--spotify); border-color: transparent; color: #050505; }
.b-spotify:not(.is-playing) .np-bar i { background: var(--text-3); }
@container (orientation: portrait) {
  .np { flex-direction: column; align-items: stretch; justify-content: center; }
  .np-art { height: auto; width: min(100%, 52cqh); align-self: center; }
  .np-controls { justify-content: center; }
}
@container (max-height: 140px) { .np-times, .np-artist { display: none; } .np-btn { width: 34px; height: 34px; } .np-btn.is-main { width: 40px; height: 40px; } }
.np-sheet { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; background: #0a0a0a; border-radius: 12px; }
.np-sheet[hidden] { display: none; }
.np-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 8px; }
.np-list { display: flex; flex-direction: column; gap: 4px; }
.np-row {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 10px;
  border: 1px solid transparent; background: rgba(255,255,255,.03); color: var(--text); text-align: left; cursor: pointer;
}
.np-row:active { background: rgba(255,255,255,.08); }
.np-row.is-current { border-color: rgba(var(--spotify-rgb), .45); background: rgba(var(--spotify-rgb), .08); }
.np-thumb { flex: none; width: 40px; height: 40px; border-radius: 6px; overflow: hidden; display: grid; place-items: center; background: rgba(255,255,255,.05); color: var(--text-3); }
.np-thumb img { width: 100%; height: 100%; object-fit: cover; }
.np-thumb .i { width: 20px; height: 20px; }
.np-row-text { min-width: 0; display: flex; flex-direction: column; }
.np-row-text b, .np-row-text small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-row-text b { font-size: 14px; font-weight: 500; }
.np-row-text small { font-size: 11.5px; color: var(--text-3); }
.np-toast {
  position: absolute; left: 50%; bottom: 4px; z-index: 4; transform: translate(-50%, 8px); max-width: 92%;
  padding: 7px 12px; border-radius: 10px; background: rgba(30,30,30,.96); border: 1px solid rgba(255,255,255,.1);
  font-size: 12.5px; color: var(--text); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
}
.np-toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* ==========================================================================
   PHOTOS
   ========================================================================== */
.slideshow { position: absolute; inset: 0; overflow: hidden; background: #000; border-radius: inherit; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s ease; }
.slide.is-visible { opacity: 1; }
.slide-fill { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(.55) saturate(1.2); }
.slide-img { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: cover; will-change: transform; }
.slide.fit-contain .slide-img { background-size: contain; }
.slide.kb .slide-img { animation: kenburns var(--kb-dur, 30s) ease-out both; transform-origin: var(--kb-origin, 50% 50%); }
@keyframes kenburns { from { transform: scale(1.02); } to { transform: scale(1.14); } }
.slide-caption {
  position: absolute; left: 14px; bottom: 12px; right: 14px; z-index: 2;
  font-size: 12px; color: rgba(255,255,255,.82); text-shadow: 0 1px 6px rgba(0,0,0,.7);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.screen-photo .slide-caption { left: max(24px, var(--gap)); right: auto; bottom: auto; top: 18px; opacity: .7; }
.b-photo .panel-body { border-radius: var(--radius-sm); overflow: hidden; }

/* ==========================================================================
   NEWS + TICKER
   ========================================================================== */
.news { display: flex; flex-direction: column; gap: 8px; }
.news-lead { position: relative; flex: none; height: clamp(120px, 22vmin, 220px); border-radius: 14px; overflow: hidden; background: #111 center/cover no-repeat; }
.news-lead::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,.1) 70%); }
.news-lead > div { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; }
.news-lead h3 { margin: 4px 0 0; font-size: clamp(15px, 2vmin, 19px); font-weight: 600; line-height: 1.3; }
.news-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 11px; border-radius: 12px; background: rgba(255,255,255,.03); }
.news-item h3 { margin: 0; font-size: 13.5px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-src { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.news-src b { color: var(--tint); font-weight: 600; }
.news-thumb { width: 56px; height: 42px; border-radius: 8px; background: #111 center/cover no-repeat; }
.b-ticker > .panel-body { display: flex; flex-direction: column; justify-content: center; }
.ticker { position: relative; display: flex; align-items: center; overflow: hidden; white-space: nowrap; padding: 6px 0; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.ticker-track { flex: none; display: inline-flex; align-items: center; gap: 22px; padding-left: 100%; animation: ticker var(--dur, 120s) linear infinite; will-change: transform; }
.ticker-item { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(14px, 1.9vmin, 18px); line-height: 1.2; color: rgba(255,255,255,.92); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.ticker-item b { font-size: .72em; line-height: 1; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.ticker-item .ticker-title { line-height: 1.2; }
.ticker-img:not(.is-loaded) { display: none; }
.ticker-img { flex: none; width: 2em; height: 2em; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.08); box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
/* The dot sits halfway between two headlines */
.ticker-item i { flex: none; width: 5px; height: 5px; margin-left: 12px; border-radius: 50%; background: rgba(255,255,255,.4); }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-100%); } }
.b-ticker { background: rgba(10,12,15,.45) !important; border-radius: 14px !important; padding: 0 14px !important; backdrop-filter: blur(10px) !important; -webkit-backdrop-filter: blur(10px) !important; }

/* ==========================================================================
   LISTS / CHORES / MEALS / MESSAGE / COUNTDOWN / QUOTE
   ========================================================================== */
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.04); margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
.seg button { flex: 1; padding: 7px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--text-3); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg button.is-active { background: rgba(255,255,255,.1); color: var(--text); }
.seg button span { margin-left: 5px; font-size: 11px; color: var(--tint); }
.items { display: flex; flex-direction: column; gap: 5px; }
/* All done: the top half celebrates, the crossed-out items sit below it */
.all-done { flex: 0 0 50%; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.all-done-mark svg { display: block; width: 56px; height: 56px; overflow: visible; filter: drop-shadow(0 0 14px rgba(var(--tint-rgb), .45)); }
.all-done-mark .ring { fill: rgba(var(--tint-rgb), .12); stroke: var(--tint); stroke-width: 2.5; }
.all-done-mark .tick { fill: none; stroke: var(--tint); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; }
.all-done b { margin-top: 4px; font-size: 16px; font-weight: 600; color: var(--text); }
.all-done small { font-size: 12px; color: var(--text-3); }
.all-done.pop .all-done-mark svg { animation: done-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
.all-done.pop .tick { animation: done-tick .45s .3s ease-out both; }
@keyframes done-pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes done-tick { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
.items.is-all-done .item.is-done { opacity: .75; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 11px; background: rgba(255,255,255,.035); cursor: pointer; border: 0; width: 100%; text-align: left; color: var(--text); font-size: 14px; }
.check { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.check .i { width: 12px; height: 12px; stroke-width: 3; opacity: 0; color: #0d0f12; }
.item.is-done .check, .chore.is-done .check { background: var(--c, var(--tint)); border-color: transparent; }
.item.is-done .check .i, .chore.is-done .check .i { opacity: 1; }
.item.is-done .item-text { color: var(--text-3); text-decoration: line-through; }
.item-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-del { flex: none; opacity: .5; padding: 2px; }
.add-row { display: flex; gap: 6px; margin-top: 8px; flex: none; }
.add-row input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 11px; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.25); color: var(--text); outline: none; font-size: 13.5px; user-select: text; }
.add-row input:focus { border-color: rgba(var(--tint-rgb), .6); }
.add-row .icon-btn { width: 38px; height: 38px; background: rgba(var(--tint-rgb), .15); color: var(--tint); }
.add-row .mic { background: rgba(255,255,255,.05); color: var(--text-2); }
/* ---------- Recording (shared: panel.setRecording(on, button)) ----------
   The button grows a little and sends out soft rings; the whole widget breathes a red glow. */
.rec-btn { position: relative; transition: transform .35s cubic-bezier(.34,1.56,.64,1), background .25s, color .25s; }
.rec-btn.is-recording { transform: scale(1.14); background: var(--crimson); color: #fff; box-shadow: 0 4px 16px -4px rgba(var(--crimson-rgb), .7); }
.rec-btn.is-recording::before, .rec-btn.is-recording::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 0 2px rgba(var(--crimson-rgb), .55); animation: rec-ring 1.8s cubic-bezier(.2,.6,.3,1) infinite;
}
.rec-btn.is-recording::after { animation-delay: .9s; }
@keyframes rec-ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
.panel.is-recording { z-index: 3; border-color: rgba(var(--crimson-rgb), .55); animation: rec-glow 2.4s ease-in-out infinite; }
/* Panels on a screen already run the (finished) "rise" entrance: keep it in the list so it doesn't replay */
.screen.is-active .grid > .panel.is-recording { animation: rise .7s cubic-bezier(.2,.7,.2,1) both, rec-glow 2.4s ease-in-out infinite; }
@keyframes rec-glow {
  0%, 100% { box-shadow: 0 0 0 1px rgba(var(--crimson-rgb), .35), 0 0 22px 0 rgba(var(--crimson-rgb), .22), inset 0 0 18px rgba(var(--crimson-rgb), .06); }
  50%      { box-shadow: 0 0 0 1px rgba(var(--crimson-rgb), .6),  0 0 40px 4px rgba(var(--crimson-rgb), .38), inset 0 0 28px rgba(var(--crimson-rgb), .12); }
}
body.low-power .screen.is-active .grid > .panel.is-recording { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; box-shadow: 0 0 0 1px rgba(var(--crimson-rgb), .6), 0 0 28px 2px rgba(var(--crimson-rgb), .3); }
body.low-power .rec-btn.is-recording::before, body.low-power .rec-btn.is-recording::after { animation: none; opacity: 0; }
.items-sep { margin: 6px 2px 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.lists-host { position: relative; }

/* Strava: one card per person; details drop out as the slot gets smaller */

.st-card { container: stcard / inline-size; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); }

@container stcard (max-width: 220px) { .st-foot { flex-direction: column; gap: 2px; } .st-wk { display: none; } }
@container strava (max-height: 280px) { .st-last { display: none; } }
/* km + trend vs last week */
.st-big { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; }

.st-vs { font-weight: 400; color: var(--text-3); }
@container strava (max-height: 230px) {
  /* Short slot: one line per person — who · Mon–Sun bars · km per sport · week km + trend */
  .strava { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .st-foot, .st-who span, .st-wk, .st-vs, .st-last { display: none; }
  .st-card { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; grid-template-areas: "head bars sports big"; align-items: center; gap: 14px; padding: 8px 12px; }
  .st-head { grid-area: head; min-width: 0; }

  .st-bars { grid-area: bars; width: 84px; height: 30px; gap: 3px; }
  .st-bar span { display: none; }

/* ==========================================================================

   ========================================================================== */

.edit-picker-card { width: min(560px, 100%); max-height: min(82vh, 760px); display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: rgba(17,20,25,.98); border: 1px solid var(--glass-border); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }

.edit-pick { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; border: 1px solid transparent; background: rgba(255,255,255,.04); color: var(--text); text-align: left; cursor: pointer; font: inherit; }

/* ==========================================================================
   SETTINGS DRAWER

.usage { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.usage div { padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04); }

.usage-bars i { width: 100%; border-radius: 4px 4px 2px 2px; background: rgba(var(--accent-rgb), .55); min-height: 2px; }
.usage-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
.usage-table td, .usage-table th { padding: 5px 4px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.06); font-weight: 400; }

.usage-table td:not(:first-child), .usage-table th:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
.settings {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 80;
  width: min(480px, 100%);
  display: flex; flex-direction: column;
  background: rgba(10, 10, 10, .95);
  border-left: 1px solid var(--glass-border);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);

.settings.is-open { transform: none; box-shadow: -30px 0 60px -20px rgba(0,0,0,.6); }
.settings-head { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; }
.settings-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.settings-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-3); }
.settings-head .icon-btn { margin-left: auto; }
.settings-body { flex: 1; overflow-y: auto; padding: 4px 18px 18px; overscroll-behavior: contain; }
.settings-group + .settings-group { margin-top: 22px; }
.settings-group > h3 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 6px 2px 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-2); }
.settings-group > h3 small { font-size: 11.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-3); }
.settings details { border-radius: 14px; background: rgba(255,255,255,.03); margin-bottom: 8px; }
.settings summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; font-size: 13.5px; font-weight: 600; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary .i { width: 16px; height: 16px; color: var(--accent); }
.settings summary::after { content: "+"; margin-left: auto; color: var(--text-3); font-weight: 400; font-size: 18px; }
.settings details[open] summary::after { content: "–"; }
.settings .group { padding: 2px 14px 12px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 12.5px; color: var(--text-2); }
.field small { font-size: 11.5px; color: var(--text-3); line-height: 1.45; }
.field code { font-size: 11px; background: rgba(255,255,255,.07); padding: 1px 4px; border-radius: 4px; }
.field input[type="text"], .field input[type="url"], .field input[type="number"], .field input[type="password"],
.field input[type="time"], .field select, .field textarea {

  transition: border-color .2s, box-shadow .2s;
}
.field textarea { resize: vertical; min-height: 70px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(var(--accent-rgb), .6); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .15); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-inline { display: flex; gap: 8px; }
.field-inline input { flex: 1; }
.toggle { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.toggle input { appearance: none; -webkit-appearance: none; width: 42px; height: 24px; border-radius: 999px; background: rgba(255,255,255,.12); position: relative; cursor: pointer; flex: none; transition: background .2s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { transform: translateX(18px); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 14px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); color: var(--text);
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn .i { width: 15px; height: 15px; }
.btn:hover { background: rgba(255,255,255,.1); }
.btn-primary { background: var(--accent); border-color: transparent; color: #050505; font-weight: 600; }
.btn-ghost { background: transparent; }
.settings-foot { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--glass-border); }
.account { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.account > div:first-child { flex: 1; min-width: 12ch; }

.settings-foot .btn-primary { margin-left: auto; }

/* ==========================================================================
   RESPONSIVE ENGINE (per-screen grids are generated from LAYOUTS at boot)
   ========================================================================== */
@media (orientation: portrait) and (min-width: 600px) {
  .b-spotify .frame { height: 152px; }
}
@media (max-width: 1100px) { .screen-tab .tab-label { display: none; } .screen-tab { padding: 0 10px; } }

/* Portrait tablet (800 px): the name stays, the latency sparkline makes room for it */
@media (max-width: 900px) { .ping-extra, .sparkline { display: none; } .brand-name { font-size: 14.5px; } }

/* Phones / tiny windows: single scrolling column */
@media (max-width: 599px), (orientation: landscape) and (max-height: 480px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; }
  .screens { flex: none; }

  .screen.is-active { display: block; }
  .screen > .grid { display: flex !important; flex-direction: column; height: auto; }
  .grid > .panel { min-height: 300px; }
  .grid > .b-transport, .grid > .b-news, .grid > .b-calendar { min-height: 480px; }
  .grid > .b-clock, .grid > .b-message, .grid > .b-countdown, .grid > .b-ticker, .grid > .b-spotify { min-height: 0; }
  .grid > .b-spotify .frame { height: 352px; }
  .grid > .b-spotify .np-host { flex: none; height: 150px; }
  .screen-photo { position: fixed; }

  .chip .chip-label-long, .screen-tab .tab-label { display: none; }

  .brand, #btnFullscreen { display: none; }

}

@media (max-width: 380px) { #netChip .ping-value { display: none; } #netChip { padding: 0 6px; } }

/* Low-power mode for older tablets & reduced-motion users */
body.low-power .panel:not(.is-bare),
body.low-power .app.statusbar-auto .statusbar { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(16, 16, 16, .95); }
body.low-power .bg-orbs, body.low-power .sk, body.low-power .dot.tone-good, body.low-power .slide.kb .slide-img { animation: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .ticker-track { animation: none; padding-left: 0; }
}

<body>
<noscript>
  <div style="padding:24px;font-family:system-ui;color:#eef1f6">This dashboard needs JavaScript enabled.</div>
</noscript>

<!-- Ambient background (+ optional photo backdrop behind the glass) -->
<div class="bg" aria-hidden="true">
  <div class="bg-orbs"></div>
  <div class="bg-grid"></div>
  <div class="bg-photos" id="bgPhotos" hidden></div>
</div>
<div class="bg-noise" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- ===================== STATUS BAR (Module 5: network) ===================== -->
  <header class="statusbar" id="statusbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">FLORA-HOME</span>
      <span class="brand-date" id="brandDate"></span>
    </div>

    <nav class="screen-tabs" id="screenTabs" aria-label="Screens"></nav>

    <div class="status-chips">
      <!-- One chip: dot = connection + sync (green / amber / red), then latency; details on hover -->
      <div class="chip" id="netChip" role="status" aria-live="polite">
        <span class="dot tone-good" id="netDot"></span>
        <span class="ping-value" id="pingValue">— ms</span>
        <svg class="sparkline" id="pingSpark" viewBox="0 0 64 18" preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="chip-sub ping-extra" id="pingLoss"></span>
      </div>
    </div>

    <div class="status-actions">
      <button class="icon-btn" id="btnFullscreen" type="button" aria-label="Toggle fullscreen" data-icon="maximize"></button>
      <button class="icon-btn" id="btnEdit" type="button" aria-label="Edit layout" title="Edit layout (resize & swap widgets)" data-icon="dashboard"></button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Open settings" data-icon="sliders"></button>
    </div>
  </header>

  <!-- Screens are generated from LAYOUTS (see script). -->
  <main class="screens" id="screens"></main>

  <!-- Inside .app so expanded panels (z 60) stack above it despite the burn-in transform. -->
  <div class="scrim" id="scrim"></div>
</div>

<div class="night-veil" aria-hidden="true"></div>
<div class="night-clock" id="nightClock" aria-hidden="true"><b id="nightTime"></b><span id="nightDate"></span></div>

<!-- ===================== SETTINGS DRAWER ===================== -->
<aside class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
  <div class="settings-head">
    <div>
      <h2 id="settingsTitle">Dashboard settings</h2>
      <p id="settingsNote">Saved on this device. Overrides the CONFIG block in index.html.</p>
    </div>
    <button class="icon-btn" type="button" id="btnSettingsClose" aria-label="Close settings" data-icon="x"></button>
  </div>
  <form class="settings-body" id="settingsForm" autocomplete="off"></form>
  <div class="settings-foot">
    <button class="btn btn-ghost" type="button" id="btnSettingsReset">Reset</button>
    <button class="btn" type="button" id="btnSettingsCancel">Cancel</button>
    <button class="btn btn-primary" type="button" id="btnSettingsSave">Save &amp; reload</button>
  </div>
</aside>

<script>
/* ==========================================================================
   ⚙️  CONFIGURATION — paste your own endpoints here.
   --------------------------------------------------------------------------
   Every value can also be changed on the tablet itself via the ⚙ button
   (stored in localStorage), or via URL query params, e.g.
     index.html?TRANSPORT_URL=https%3A%2F%2F...&LOW_POWER=1#family
   Precedence: URL params  >  on-device settings  >  this CONFIG object.

   List values are arrays of strings. Many use a "pipe" format, e.g.
     "Family | #8b9cff | https://example.com/family.ics"
   In the settings drawer, write one entry per line.

   🔐 Tokens (Todoist, Finnhub, TomTom): if this file is hosted publicly,
      enter them in the on-device settings instead of committing them here.
   ========================================================================== */
const CONFIG = {
  /* ── Screens (DAKboard-style multi-screen) ────────────────────────────
     Built-in screens: "hub", "family", "frame", "info" — see LAYOUTS below
     to rearrange blocks or add your own.                                    */
  DASHBOARD_NAME: "FLORA-HOME",  // shown in the status bar and the browser tab
  SCREENS: ["hub", "family", "frame", "info"],
  START_SCREEN: "hub",
  SCREEN_ROTATE_SEC: 0,         // Auto-advance every N seconds (0 = off). Pauses 2 min after a touch.
  SCREEN_SCHEDULE: [            // "screen | HH:MM-HH:MM | days"  (days optional: Mon-Fri, Sat,Sun …)
    // "frame | 21:30-07:00",
    // "hub   | 07:00-09:00 | Mon-Fri",
  ],

  /* ── 1. Public transport web app ──────────────────────────────────────
     Any departure board / journey planner that allows iframe embedding.
     Leave empty to show the demo departure board.                          */
  TRANSPORT_URL: "https://oh-my-bussy.vercel.app/",
  TRANSPORT_TITLE: "Transit",
  TRANSPORT_ZOOM: 1,            // 1 = 100 %. 0.8 fits more content, 1.2 enlarges.
  TRANSPORT_REFRESH_MIN: 0,     // 0 = let the web app refresh itself (recommended). N = forced seamless reload every N min.

  /* ── 2. Calendar ──────────────────────────────────────────────────────
     Layer A — iframe embed (used when CALENDARS is empty):
       Google:  just paste the calendar ID(s), comma-separated, e.g. the Google
                Family calendar "family0123456789@group.calendar.google.com"
                (Google Calendar → Settings → Family → Integrate calendar → Calendar ID).
                Private calendars show when the kiosk browser is signed in to a
                Google account that can see them. A full embed URL also works.
       Outlook: Settings → Calendar → Shared calendars → Publish → HTML link.
     Layer B — native dark calendars (agenda / week / month / up next) from
       iCal feeds: "Name | #color | https://…/basic.ics". Most feeds need
       CORS_PROXY (see cors-proxy/worker.js in the repo).
     Both empty → demo calendar.                                             */
  CALENDAR_URL: "",
  CALENDARS: [
    // "Family | #8b9cff | https://calendar.google.com/calendar/ical/…/basic.ics",
    // "Work   | #5eead4 | https://outlook.office365.com/owa/calendar/…/calendar.ics",
  ],
  HOLIDAY_COUNTRY: "GB",        // Public holidays (ISO 3166 code, e.g. "US", "DE"). "" = off.
  CALENDAR_DARK_FILTER: true,   // Invert light-themed calendar embeds into dark mode.
  CALENDAR_DAYS: 7,             // Agenda look-ahead.
  CALENDAR_REFRESH_MIN: 15,
  WEEK_START: 1,                // 1 = Monday, 0 = Sunday
  CORS_PROXY: "",               // Empty on Cloudflare Pages (built-in /api/proxy). Elsewhere: "https://your-worker.workers.dev/?url="

  /* ── 3. Spotify ───────────────────────────────────────────────────────
     Now Playing + controls + "play one of my playlists" on any Spotify
     Connect speaker (Google Home / Nest included). Needs the Cloudflare
     backend with SPOTIFY_CLIENT_ID/SECRET — see README → Spotify.            */
  SPOTIFY_DEVICE: "",           // Speaker to start playlists on when nothing is playing, e.g. "Living Room speaker". "" = ask.
  SPOTIFY_URL: "",              // Optional fallback: embed player for a link/URI when the account isn't connected.

  /* ── 4. Smart home ────────────────────────────────────────────────────
     Aqara sensors via the Cloudflare backend (README → Aqara) are used
     automatically once connected, next to outdoor air quality (EAQI) and
     PM2.5 for LATITUDE/LONGITUDE. Or: any iframe-able dashboard URL
     (Home Assistant, SharpTools…), which takes precedence.                  */
  AQARA_REFRESH_SEC: 60,
  SMART_HOME_URL: "",
  SMART_HOME_ZOOM: 1,
  SMART_HOME_REFRESH_MIN: 0,

  /* ── 5. Network monitor ───────────────────────────────────────────────
     A tiny, fast, globally-cached endpoint. Alternatives:
     "https://httpbin.org/get", "https://www.google.com/favicon.ico".        */
  PING_URL: "",                 // "" = this dashboard's own Worker (/api/ping) at the nearest Cloudflare edge.
                                // Works wherever the dashboard loads; ~0.4 KB per probe.
  PING_INTERVAL_SEC: 30,
  PING_TIMEOUT_MS: 4000,
  PING_GOOD_MS: 30,             // < 30 ms  → emerald
  PING_WARN_MS: 100,            // ≤ 100 ms → amber, above → crimson

  /* ── Clock & weather (Open-Meteo, no API key) ──────────────────────── */
  LOCATION_NAME: "London",
