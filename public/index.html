                  h(
                    'div',
                    { style: { minWidth: '0' } },
                    h('div', { class: 'event-title' }, e.title || '(No title)'),
                    h('div', { class: 'event-sub' }, e.location ? `${when} · ${e.location}` : when),
                  ),
                  tag ? h('span', { class: 'event-tag' }, tag) : null,
                );
              }),
            ),
          ),
        );
      }
      host.replaceChildren(
        groups.length
          ? h('div', { class: 'agenda scroll-y' }, groups)
          : h('div', { class: 'empty' }, icon('calendar'), `Nothing scheduled in the next ${days} days`),
      );
    }

    function renderWeek(host, events) {
      const today = startOfDay(new Date());
      const list = expandEvents(events, today, addDays(today, 7));
      host.replaceChildren(
        h(
          'div',
          { class: 'week' },
          Array.from({ length: 7 }, (_, i) => {
            const d0 = addDays(today, i),
              d1 = addDays(today, i + 1);
            const items = list.filter((e) => overlaps(e, d0, d1) && (e.allDay || e.start >= d0 || i === 0)).sort(sortDay);
            return h(
              'div',
              { class: `w-col${i === 0 ? ' is-today' : ''}` },
              h('div', { class: 'w-head' }, fmtWeekdayShort.format(d0), h('b', null, d0.getDate())),
              items.map((e) =>
                h(
                  'div',
                  { class: 'w-ev', style: { '--c': evColor(e) } },
                  h('span', null, e.allDay ? 'All day' : timeStr(e.start)),
                  h('b', null, e.title || '(No title)'),
                ),
              ),
            );
          }),
        ),
      );
    }

    function renderMonth(host, events) {
      const now = new Date();
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      const offset = (first.getDay() - s.WEEK_START + 7) % 7;
      const gridStart = addDays(first, -offset);
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const weeks = Math.ceil((offset + daysInMonth) / 7);
      const list = expandEvents(events, gridStart, addDays(gridStart, weeks * 7));
      const todayKey = ymd(now);
      const head = h(
        'div',
        { class: 'month-head' },
        Array.from({ length: 7 }, (_, i) => h('span', null, fmtWeekdayShort.format(addDays(gridStart, i)))),
      );
      const grid = h('div', { class: 'month-grid', style: { gridTemplateRows: `repeat(${weeks}, minmax(0, 1fr))` } });
      for (let i = 0; i < weeks * 7; i++) {
        const d0 = addDays(gridStart, i),
          d1 = addDays(gridStart, i + 1);
        const items = list.filter((e) => overlaps(e, d0, d1) && (e.allDay || e.start >= d0)).sort(sortDay);
        const weekend = d0.getDay() === 0 || d0.getDay() === 6;
        grid.append(
          h(
            'div',
            { class: `m-cell${d0.getMonth() !== now.getMonth() ? ' is-out' : ''}${ymd(d0) === todayKey ? ' is-today' : ''}${weekend ? ' is-weekend' : ''}` },
            h('div', { class: 'm-num' }, h('span', null, d0.getDate()), h('span', { class: 'm-more' })),
            items.map((e) => {
              const c = evColor(e);
              return h('div', { class: `m-ev ${e.allDay ? 'all' : 'timed'}`, style: { '--c': c, '--cbg': `${c}55` }, title: e.title }, e.title || '(No title)');
            }),
          ),
        );
      }
      host.replaceChildren(h('div', { class: 'month' }, head, grid));
      // Trim chips that don't fit and show "+N more".
      ctx.raf(() =>
        grid.querySelectorAll('.m-cell').forEach((cell) => {
          const chips = [...cell.querySelectorAll('.m-ev')];
          let hidden = 0;
          while (chips.length && cell.scrollHeight > cell.clientHeight + 1) {
            chips.pop().remove();
            hidden++;
          }
          if (hidden) cell.querySelector('.m-more').textContent = `+${hidden}`;
        }),
      );
    }

    /** "25 min" · "1 h 20 min" · "3 days" */
    const fmtSpan = (ms) => {
      const m = Math.max(1, Math.round(ms / 60000));
      return m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}` : `${Math.round(m / 1440)} days`;
    };
    /**
     * Up next: the next (or current) timed event. When nothing timed is coming up, what's
     * still going on instead — today's all-day events, a trip that spans several days.
     */
    function renderUpNext(host, events) {
      const now = new Date();
      const all = expandEvents(events, now, addDays(now, 30))
        .filter((e) => e.end > now)
        .sort((a, b) => a.start - b.start);
      const timed = all.filter((e) => !e.allDay);
      const allDayNow = all.filter((e) => e.allDay && e.start <= now);
      const pool = timed.length ? timed : allDayNow;
      if (!pool.length) {
        host.replaceChildren(h('div', { class: 'empty' }, icon('calendar'), 'Nothing coming up'));
        return;
      }
      const [next, ...rest] = pool;
      const live = next.start <= now;
      const lastDay = new Date(next.end - 1);
      let label, when, count;
      if (next.allDay) {
        const days = Math.max(1, Math.round((startOfDay(next.end) - startOfDay(next.start)) / 864e5));
        const day = Math.round((startOfDay(now) - startOfDay(next.start)) / 864e5) + 1;
        label = 'Today';
        when = days > 1 ? `${fmtDateShort.format(next.start)} – ${fmtDateShort.format(lastDay)}` : 'All day';
        count = days > 1 ? `Day ${day} of ${days}` : 'All day';
      } else {
        label = live ? 'Happening now' : 'Up next';
        when = `${fmtDateShort.format(next.start)} · ${timeStr(next.start)} – ${timeStr(next.end)}`;
        count = live ? `${fmtSpan(next.end - now)} left` : `in ${fmtSpan(next.start - now)}`;
      }
      // Timed events lead; today's all-day ones still get a quiet line.
      const alsoToday = timed.length ? allDayNow.map((e) => e.title).filter(Boolean) : [];
      const c = evColor(next);
      host.replaceChildren(
        h(
          'div',
          { class: 'upnext' },
          h(
            'div',
            { class: `upnext-hero${live ? ' is-live' : ''}`, style: { '--c': c, '--c-rgb': hexToRgb(c) } },
            h('small', null, label),
            h('h3', null, next.title || '(No title)'),
            h('p', null, `${when}${next.location ? ` · ${next.location}` : ''}`),
            h('div', { class: 'count' }, count),
          ),
          alsoToday.length ? h('div', { class: 'upnext-also' }, h('b', null, 'Today'), ` ${alsoToday.join(' · ')}`) : null,
          h(
            'div',
            { class: 'events scroll-y' },
            rest
              .slice(0, 6)
              .map((e) =>
                h(
                  'div',
                  { class: 'event', style: { '--c': evColor(e) } },
                  h('span', { class: 'event-bar' }),
                  h(
                    'div',
                    { style: { minWidth: '0' } },
                    h('div', { class: 'event-title' }, e.title),
                    h(
                      'div',
                      { class: 'event-sub' },
                      e.allDay ? `${fmtDateShort.format(e.start)} · all day` : `${fmtDateShort.format(e.start)} · ${timeStr(e.start)}`,
                    ),
                  ),
                ),
              ),
          ),
        ),
      );
    }

    const VIEWS = ['agenda', 'week', 'month', 'upnext'];
    let view = VIEWS.includes(ctx.spec.view) ? ctx.spec.view : 'agenda';
    const p = ctx.panel({ title: ctx.spec.title || 'Calendar', tint: 'accent', dark: !!ctx.spec.dark });

    if (USE_CAL_EMBED) {
      // Layer A — official embed (e.g. the Google family calendar)
      const MODES = ['agenda', 'week', 'month'];
      let mode = view === 'month' || view === 'week' ? view : 'agenda';
      let frame = null;
      const mountEmbed = () => {
        frame?.destroy();
        const url = calendarEmbedUrl(mode);
        p.setMeta(`${mode[0].toUpperCase()}${mode.slice(1)} · ${CAL_IS_GOOGLE ? 'Google Calendar' : hostOf(url)}`);
        // No forced reloads: Google's embed keeps itself up to date.
        frame = ctx.ui.frame(p.body, { url, title: 'Calendar', invert: s.CALENDAR_DARK_FILTER, skeletonKind: 'list' });
      };
      if (CAL_IS_GOOGLE)
        p.addAction('layout', 'Change calendar view', () => {
          mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
          mountEmbed();
        });
      mountEmbed();
      p.reloadable(() => frame.reload());
      return;
    }

    // One feed for every calendar on every screen (Home agenda, Family month, Frame agenda).
    const calendarFeed = ctx.sharedFeed(
      'events',
      () => async () => {
        const errors = [];
        let events = [];
        if (DEMO_CAL) events = demoEvents();
        else {
          const results = await Promise.allSettled(
            calendarSources.map(async (src) => parseICS(await ctx.fetchText(src.url)).map((e) => ({ ...e, color: src.color, cal: src.name }))),
          );
          results.forEach((r, i) =>
            r.status === 'fulfilled' ? events.push(...r.value) : errors.push(`${calendarSources[i].name}: ${r.reason?.message || r.reason}`),
          );
          if (!events.length && errors.length) throw new Error(errors.join(' · '));
        }
        try {
          events.push(...(await ctx.holidays()));
        } catch {
          /* holidays are optional */
        }
        return { events, errors, demo: DEMO_CAL };
      },
      s.CALENDAR_REFRESH_MIN * 60000,
    );

    let data = null;
    const LABEL = { agenda: `Next ${s.CALENDAR_DAYS} days`, week: 'Next 7 days', upnext: 'Up next' };
    const draw = () => {
      if (!data) return;
      if (view === 'agenda') renderAgenda(p.body, data.events, s.CALENDAR_DAYS);
      else if (view === 'week') renderWeek(p.body, data.events);
      else if (view === 'month') renderMonth(p.body, data.events);
      else renderUpNext(p.body, data.events);
      const label = view === 'month' ? fmtMonthYear.format(new Date()) : LABEL[view];
      if (data.demo) p.setMeta(h('span', { class: 'badge' }, 'Demo'), ` ${label} · add CALENDARS`);
      else
        p.setMeta(
          calendarSources.length > 1 ? calendarSources.map((x) => h('span', { class: 'legend', style: { '--c': x.color } }, h('i'), x.name)) : [],
          label,
          data.errors.length ? h('span', { class: 'late', title: data.errors.join('\n') }, ' · ⚠ feed error') : null,
        );
    };
    p.addAction('layout', 'Change calendar view', () => {
      view = VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length];
      draw();
    });
    p.body.replaceChildren(h('div', { class: 'frame', style: { background: 'transparent', boxShadow: 'none' } }, ctx.ui.skeleton('list')));
    ctx.subscribe(calendarFeed, (d, err) => {
      if (d) {
        data = d;
        draw();
      } else if (err && !data) {
        p.body.replaceChildren(
          h(
            'div',
            { class: 'empty' },
            icon('alert'),
            h('div', null, 'Could not load the calendar feed.'),
            h(
              'small',
              null,
              ctx.hasProxy
                ? String(err.message || err)
                : 'The feed probably blocks cross-origin requests — set CORS_PROXY in settings (see cors-proxy/worker.js).',
            ),
          ),
        );
      }
    });
    ctx.onTick((n) => {
      if (n.getSeconds() === 0 && (view === 'agenda' || view === 'upnext' || n.getMinutes() % 30 === 0)) draw();
    });
    let lastSize = '';
    ctx.observeResize(p.body, () => {
      const size = `${p.body.clientWidth}x${p.body.clientHeight}`;
      if (view === 'month' && size !== lastSize) {
        lastSize = size;
        ctx.raf(draw);
      }
    });
    p.onReload = () => calendarFeed.refresh();
  },
});

});
</script>
<script data-widget="chores">
OMD._load("chores", function () {
/**
 * Chores — a chore chart per person: ticks reset every day, stars count up over the week.
 * Synced like the lists (shared state "chores").
 */
OMD.defineWidget({
  id: 'chores',
  name: 'Chores',
  icon: 'star',
  group: 'Family',
  state: ['chores'],
  settings: [['CHORES', 'Chore chart', 'textarea', { help: 'One person per line: <code>Alex | #34d399 | Make bed, Feed the cat</code>' }]],
  defaults: {
    CHORES: [
      // "Person | #color | chore, chore, chore" — resets daily, stars reset weekly.
      'Alex | #34d399 | Make bed, Feed the cat, Homework, Tidy desk',
      'Sam | #fbbf24 | Brush teeth, Set the table, Walk the dog',
      'Jamie | #8b9cff | Water plants, Empty dishwasher, Read 20 min',
    ],
  },

  mount(ctx) {
    const { h, icon, svg, settings: s } = ctx;
    const { pipe, ymd, addDays, startOfDay, PALETTE } = ctx.util;
    const choreStore = ctx.state('chores', {});
    const weekStartOf = (d) => startOfDay(addDays(d, -((d.getDay() - s.WEEK_START + 7) % 7)));
    const chorePeople = s.CHORES.map((line, i) => {
      const parts = pipe(line);
      const color = parts.find((x) => /^#[0-9a-f]{6}$/i.test(x)) || PALETTE[i % PALETTE.length];
      const rest = parts.filter((x) => !/^#[0-9a-f]{6}$/i.test(x));
      return {
        name: rest[0],
        color,
        chores: (rest[1] || '')
          .split(',')
          .map((x) => x.trim())
          .filter(Boolean),
      };
    }).filter((x) => x.name);
    function choreState(st = choreStore.get()) {
      st ||= {};
      const today = ymd(new Date()),
        week = ymd(weekStartOf(new Date()));
      if (st.day !== today) {
        st.day = today;
        st.done = {};
      }
      if (st.week !== week) {
        st.week = week;
        st.stars = {};
      }
      st.done ||= {};
      st.stars ||= {};
      return st;
    }

    const p = ctx.panel({ tint: 'amber' });
    const grid = h('div', { class: 'chores' });
    p.body.append(grid);
    function render() {
      const st = choreState();
      let total = 0,
        doneAll = 0;
      grid.replaceChildren(
        ...chorePeople.map((person) => {
          const done = new Set(st.done[person.name] || []);
          const n = person.chores.length,
            k = person.chores.filter((_, i) => done.has(i)).length;
          total += n;
          doneAll += k;
          const C = 2 * Math.PI * 17;
          return h(
            'div',
            { class: 'person', style: { '--c': person.color } },
            h(
              'div',
              { class: 'person-head' },
              h(
                'div',
                { class: 'avatar' },
                svg(
                  `<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="17" stroke="rgba(255,255,255,.1)"/><circle cx="19" cy="19" r="17" stroke="${person.color}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${n ? C * (1 - k / n) : C}" style="transition:stroke-dashoffset .6s"/></svg>`,
                ),
                h('span', null, person.name.slice(0, 1).toUpperCase()),
              ),
              h('div', null, h('div', { class: 'person-name' }, person.name), h('div', { class: 'person-stars' }, `★ ${st.stars[person.name] || 0} this week`)),
            ),
            person.chores.map((c, i) =>
              h(
                'button',
                {
                  type: 'button',
                  class: `chore${done.has(i) ? ' is-done' : ''}`,
                  'aria-pressed': String(done.has(i)),
                  onclick: () => {
                    const want = !done.has(i); // idempotent "set", safe to re-apply after a conflict
                    choreStore.update((raw) => {
                      const x = choreState(raw);
                      const arr = new Set(x.done[person.name] || []);
                      if (arr.has(i) === want) return x;
                      if (want) {
                        arr.add(i);
                        x.stars[person.name] = (x.stars[person.name] || 0) + 1;
                      } else {
                        arr.delete(i);
                        x.stars[person.name] = Math.max(0, (x.stars[person.name] || 0) - 1);
                      }
                      x.done[person.name] = [...arr];
                      return x;
                    });
                  },
                },
                h('span', { class: 'check' }, icon('check')),
                h('span', null, c),
              ),
            ),
            n && k === n ? h('div', { class: 'all-done' }, '🎉 All done today!') : null,
          );
        }),
      );
      p.setMeta(chorePeople.length ? `${doneAll} of ${total} done today` : 'Add CHORES in settings');
      if (!chorePeople.length) grid.replaceChildren(h('div', { class: 'empty' }, icon('star'), 'No chores configured'));
    }
    choreStore.onChange(render);
    ctx.onTick((n) => {
      if (n.getHours() === 0 && n.getMinutes() === 0 && n.getSeconds() === 1) render();
    });
    p.onReload = render;
    render();
  },
});

});
</script>
<script data-widget="clock">
OMD._load("clock", function () {
/**
 * Clock — the time with a greeting and the date, in three variants:
 *   full     big clock + the full weather component (Home)
 *   compact  one row: clock · date · current weather (Family)
 *   overlay  large white clock + weather over the photos (Frame)
 */
OMD.defineWidget({
  id: 'clock',
  name: 'Clock',
  icon: 'hourglass',
  group: 'Time & weather',
  variants: { full: 'with weather', compact: 'compact', overlay: 'over photos' },
  settings: [
    [
      [
        'CLOCK_STYLE',
        'Clock style',
        'select',
        {
          options: [
            ['digital', 'Digital'],
            ['analog', 'Analog'],
          ],
        },
      ],
      ['SHOW_SECONDS', 'Show seconds', 'checkbox'],
    ],
  ],
  defaults: {
    SHOW_SECONDS: true,
    CLOCK_STYLE: 'digital', // "digital" | "analog"
  },

  mount(ctx) {
    const { h, icon, settings: s, fmt, weather } = ctx;
    const variant = ['full', 'compact', 'overlay'].includes(ctx.spec.variant) ? ctx.spec.variant : 'full';
    const p = ctx.panel({ head: false, bare: variant === 'overlay', compact: variant === 'compact' });
    p.el.classList.add(`v-${variant}`);
    const analog = s.CLOCK_STYLE === 'analog';

    const digitalClock = () => {
      const hm = h('span', { class: 'clock-hm' }),
        ampm = h('span', { class: 'clock-ampm' }),
        sec = h('span', { class: 'clock-sec' });
      const el = h('div', { class: 'clock' }, hm, h('span', { class: 'clock-side' }, ampm, sec));
      const partsFmt = new Intl.DateTimeFormat(ctx.locale, { hour: s.HOUR_12 ? 'numeric' : '2-digit', minute: '2-digit', hour12: s.HOUR_12 });
      ctx.onTick((now) => {
        const parts = partsFmt.formatToParts(now);
        const get = (t) => parts.find((x) => x.type === t)?.value ?? '';
        hm.textContent = `${get('hour')}:${get('minute')}`;
        ampm.textContent = s.HOUR_12 ? get('dayPeriod') : '';
        sec.textContent = s.SHOW_SECONDS ? ctx.util.pad2(now.getSeconds()) : '';
      });
      return el;
    };
    const greetingFor = (hr) => (hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening');

    const date = h('div', { class: variant === 'overlay' ? 'ov-date' : 'hero-date' });
    const greeting = h('div', { class: 'greeting' });
    ctx.onTick((n) => {
      if (n.getSeconds() === 0 || !date.textContent) {
        date.textContent = fmt.dateLong.format(n);
        greeting.textContent = greetingFor(n.getHours());
      }
    });

    if (variant === 'full') {
      const wx = h('div', { class: 'hero-wx' });
      p.body.append(h('div', { class: 'hero' }, h('div', { class: 'hero-top' }, greeting, date), analog ? ctx.ui.analogClock() : digitalClock(), wx));
      ctx.ui.weather(wx);
    } else if (variant === 'compact') {
      const wx = h('div', { class: 'wx-mini' });
      p.body.append(h('div', { class: 'hero-row' }, digitalClock(), h('div', { class: 'stack' }, date, greeting), wx));
      ctx.subscribe(weather.feed, (d) => {
        if (!d) return;
        const w = weather.wmo(d.current.weather_code, d.current.is_day);
        wx.replaceChildren(
          h('span', { style: { color: w.tone } }, icon(w.ic)),
          h(
            'div',
            null,
            h('b', null, `${Math.round(d.current.temperature_2m)}°`),
            h('small', null, `H ${Math.round(d.daily.temperature_2m_max[0])}° · L ${Math.round(d.daily.temperature_2m_min[0])}°`),
          ),
        );
      });
    } else {
      const wx = h('div', { class: 'ov-wx' });
      p.body.style.justifyContent = 'flex-end';
      p.body.append(date, analog ? ctx.ui.analogClock() : digitalClock(), wx);
      ctx.subscribe(weather.feed, (d) => {
        if (!d) return;
        const w = weather.wmo(d.current.weather_code, d.current.is_day);
        wx.replaceChildren(
          h(
            'div',
            { class: 'ov-now' },
            icon(w.ic),
            h('div', null, h('b', null, `${Math.round(d.current.temperature_2m)}°`), h('span', null, `${w.label} · ${s.LOCATION_NAME}`)),
          ),
          h(
            'div',
            { class: 'ov-fc' },
            d.daily.time.slice(1, 5).map((t, i) => {
              const dw = weather.wmo(d.daily.weather_code[i + 1], 1);
              return h(
                'div',
                null,
                fmt.weekdayShort.format(weather.localDate(t)),
                icon(dw.ic),
                `${Math.round(d.daily.temperature_2m_max[i + 1])}° / ${Math.round(d.daily.temperature_2m_min[i + 1])}°`,
              );
            }),
          ),
        );
      });
    }
  },
});

});
</script>
<script data-widget="commute">
OMD._load("commute", function () {
/**
 * Commute — per destination: public transport (live: VBB in Berlin/Brandenburg, Transitous
 * elsewhere in Europe), car (live traffic with the TOMTOM_KEY Worker secret, through
 * lib/integrations/tomtom.js; else typical drive time), bike or on foot (OpenStreetMap).
 * Addresses: Photon (OSM), biased to home. Its settings use a custom editor (fields.commutes).
 */
const COMMUTE_MODES = {
  public: { ic: 'train', label: 'Public transport' },
  car: { ic: 'car', label: 'Car' },
  bike: { ic: 'bike', label: 'Bike' },
  foot: { ic: 'footprints', label: 'On foot' },
};
const MODE_ALIASES = {
  transit: 'public',
  pt: 'public',
  bus: 'public',
  train: 'public',
  öpnv: 'public',
  oepnv: 'public',
  drive: 'car',
  driving: 'car',
  auto: 'car',
  bicycle: 'bike',
  cycle: 'bike',
  cycling: 'bike',
  walk: 'foot',
  walking: 'foot',
};
const modeOf = (s) => {
  const k = String(s || '')
    .trim()
    .toLowerCase();
  return COMMUTE_MODES[k] ? k : MODE_ALIASES[k] || null;
};
/** "Name | destination | mode | origin" — the older "Name | destination | origin" still works (car). */
function parseCommute(line) {
  const [name = '', to = '', a = '', b = ''] = OMD.util.pipe(line);
  const m = modeOf(a);
  return { name, to, mode: m || 'car', from: m ? b : a };
}

/** Address search and geocoding (Photon / Nominatim, biased to home), cached on the device. */
function places({ fetchJSON, settings, local }) {
  const geoStore = local('geocode', {}, { legacyKey: 'omd.geocode.v2' });
  const photonLabel = (p) => [...new Set([p.name, [p.street, p.housenumber].filter(Boolean).join(' '), p.district, p.city].filter(Boolean))].join(', ');
  async function photon(q, limit = 5) {
    const j = await fetchJSON(`https://photon.komoot.io/api/?limit=${limit}&q=${encodeURIComponent(q)}&lat=${settings.LATITUDE}&lon=${settings.LONGITUDE}`);
    return (j.features || []).map((f) => ({ lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], label: photonLabel(f.properties || {}) }));
  }
  /** Address or "lat,lon" → coordinates (cached on the device). Places near home win. */
  async function geocode(q) {
    if (/^\s*-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?\s*$/.test(q)) {
      const [lat, lon] = q.split(',').map(Number);
      return { lat, lon, label: q.trim() };
    }
    const cache = geoStore.get();
    if (cache[q]) return cache[q];
    let hit = (await photon(q, 1).catch(() => []))[0];
    if (!hit) {
      const j = await fetchJSON(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
      if (j[0]) hit = { lat: +j[0].lat, lon: +j[0].lon, label: j[0].display_name.split(',').slice(0, 3).join(',') };
    }
    if (!hit) throw new Error(`Place not found: ${q}`);
    cache[q] = hit;
    geoStore.set(cache);
    return hit;
  }
  return { photon, geocode };
}

async function routeOsm(ctx, profile, a, b) {
  const j = await ctx.fetchJSON(`https://routing.openstreetmap.de/routed-${profile}/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
  if (!j.routes?.[0]) throw new Error('No route');
  return { mins: j.routes[0].duration / 60, km: j.routes[0].distance / 1000, source: 'OSM' };
}
/** Next journey leaving now: when to leave, lines, arrival, live delays. */
async function routePublic(ctx, a, b) {
  try {
    const q = new URLSearchParams({
      'from.latitude': a.lat,
      'from.longitude': a.lon,
      'from.address': 'Start',
      'to.latitude': b.lat,
      'to.longitude': b.lon,
      'to.address': 'Destination',
      results: 1,
      stopovers: 'false',
      remarks: 'false',
      polylines: 'false',
    });
    const j = await ctx.fetchJSON(`https://v6.vbb.transport.rest/journeys?${q}`, AbortSignal.timeout ? { signal: AbortSignal.timeout(12000) } : {});
    const legs = j.journeys?.[0]?.legs;
    if (!legs?.length) throw new Error('no journey');
    const rides = legs.filter((l) => !l.walking && l.line);
    const delays = rides.map((l) => l.departureDelay).filter((d) => d != null);
    return {
      leave: Date.parse(legs[0].departure || legs[0].plannedDeparture),
      arrive: Date.parse(legs.at(-1).arrival || legs.at(-1).plannedArrival),
      lines: rides.map((l) =>
        /^\d/.test(l.line.name) ? `${{ bus: 'Bus', tram: 'Tram', ferry: 'Ferry' }[l.line.product] || ''} ${l.line.name}`.trim() : l.line.name,
      ),
      delay: Math.max(0, ...rides.map((l) => l.departureDelay || 0)) / 60,
      cancelled: legs.some((l) => l.cancelled),
      live: delays.length > 0,
      source: 'VBB live',
    };
  } catch {
    // Outside Berlin/Brandenburg (or VBB down): Transitous, Europe-wide open transit routing.
    const j = await ctx.fetchJSON(`https://api.transitous.org/api/v1/plan?fromPlace=${a.lat},${a.lon}&toPlace=${b.lat},${b.lon}&numItineraries=1`);
    const it = j.itineraries?.[0];
    if (!it) throw new Error('No connection found');
    const rides = it.legs.filter((l) => l.mode !== 'WALK');
    return {
      leave: Date.parse(it.startTime),
      arrive: Date.parse(it.endTime),
      lines: rides.map((l) => l.routeShortName || l.mode.toLowerCase()),
      delay: 0,
      live: rides.some((l) => l.realTime),
      source: 'Transitous',
    };
  }
}

/** Commute destinations: name · address (with suggestions) · mode · optional start. Saved as COMMUTES lines. */
function commuteEditor(kit) {
  const { h, icon, key, label, value, help } = kit;
  const { photon, geocode } = places(kit);
  const hidden = h('textarea', { name: key, hidden: true });
  const rows = h('div', { class: 'cm-rows' });
  const datalist = h('datalist', { id: 'cm-places' });
  const sync = () => {
    hidden.value = [...rows.children]
      .map((r) => r._line())
      .filter(Boolean)
      .join('\n');
  };
  let suggestTimer = 0;
  const suggest = (q) => {
    kit.clearTimeout(suggestTimer);
    if (q.trim().length < 3) return;
    suggestTimer = kit.setTimeout(async () => {
      const hits = await photon(q, 6).catch(() => []);
      datalist.replaceChildren(...hits.map((x) => h('option', { value: x.label })));
    }, 300);
  };
  function addRow(c = { name: '', to: '', mode: 'public', from: '' }) {
    const name = h('input', { type: 'text', placeholder: 'Name, e.g. Work', value: c.name, 'aria-label': 'Name', oninput: () => sync() });
    const mode = h(
      'select',
      { 'aria-label': 'How', onchange: () => sync() },
      Object.entries(COMMUTE_MODES).map(([k, m]) => h('option', { value: k, selected: k === c.mode }, m.label)),
    );
    const place = (attrs) =>
      h('input', {
        type: 'text',
        list: 'cm-places',
        autocomplete: 'off',
        ...attrs,
        oninput: (e) => {
          sync();
          suggest(e.target.value);
        },
        onchange: (e) => check(e.target),
      });
    const to = place({ placeholder: 'Address or place', value: c.to, 'aria-label': 'Destination' });
    const from = place({ placeholder: 'From: home', value: c.from || '', 'aria-label': 'Start (optional)' });
    const hint = h('small', { class: 'cm-hint' });
    const del = h(
      'button',
      {
        class: 'icon-btn',
        type: 'button',
        'aria-label': 'Remove destination',
        onclick: () => {
          row.remove();
          sync();
        },
      },
      icon('x'),
    );
    const row = h('div', { class: 'cm-row' }, h('div', { class: 'field-inline' }, name, mode, del), h('div', { class: 'field-inline' }, to, from), hint);
    row._line = () => {
      const n = name.value.trim().replace(/\|/g, '/'),
        t = to.value.trim().replace(/\|/g, '/'),
        f = from.value.trim().replace(/\|/g, '/');
      return n && t ? [n, t, mode.value, f].filter((x, i) => i < 3 || x).join(' | ') : '';
    };
    const check = async (input) => {
      if (!input.value.trim()) {
        hint.textContent = '';
        return;
      }
      hint.textContent = 'Looking up…';
      try {
        const g = await geocode(input.value.trim());
        hint.textContent = `📍 ${g.label || `${g.lat.toFixed(4)}, ${g.lon.toFixed(4)}`}`;
      } catch (e) {
        hint.textContent = `⚠ ${e.message}`;
      }
    };
    rows.append(row);
    if (c.to) check(to);
    sync();
    return name;
  }
  value.map(parseCommute).forEach((c) => addRow(c));
  const add = h('button', { class: 'btn', type: 'button', onclick: () => addRow().focus() }, icon('plus'), h('span', null, 'Add destination'));
  return h('div', { class: 'field' }, h('span', null, label), rows, add, help, datalist, hidden);
}

OMD.defineWidget({
  id: 'commute',
  name: 'Commute',
  icon: 'car',
  group: 'Getting around',
  integrations: ['tomtom'],
  settings: [
    [
      'COMMUTES',
      'Destinations',
      'commutes',
      {
        help: 'Public transport is live (VBB in Berlin/Brandenburg, Transitous elsewhere). Car uses live traffic once the Worker has the <code>TOMTOM_KEY</code> secret (README → Secrets); bike and foot use OpenStreetMap routing.',
      },
    ],
    ['COMMUTE_REFRESH_MIN', 'Refresh (min)', 'number', { min: 2 }],
  ],
  /* "Name | destination (address or lat,lon) | public · car · bike · foot | origin (optional, default = home)" */
  defaults: {
    COMMUTES: [],
    COMMUTE_REFRESH_MIN: 5,
  },
  fields: { commutes: commuteEditor },

  mount(ctx) {
    const { h, icon, fmt, settings: s } = ctx;
    const { geocode } = places(ctx);
    async function routeCar(a, b) {
      if ((await ctx.status('tomtom')).configured) {
        const j = await ctx.api(`tomtom/route?from=${a.lat},${a.lon}&to=${b.lat},${b.lon}`);
        return { mins: j.mins, delay: j.delay, km: j.km, live: true, source: 'TomTom traffic' };
      }
      return { ...(await routeOsm(ctx, 'car', a, b)), live: false };
    }
    const commuteFeed = ctx.sharedFeed(
      'routes',
      () => async () => {
        const routes = s.COMMUTES.map(parseCommute).filter((r) => r.name && r.to);
        if (!routes.length) {
          const now = Date.now();
          return {
            demo: true,
            items: [
              { name: 'Work', mode: 'public', lines: ['U5', 'S3'], leave: now + 4 * 60000, arrive: now + 31 * 60000, delay: 2, live: true },
              { name: 'School', mode: 'bike', mins: 12, km: 3.4 },
              { name: 'Grandparents', mode: 'car', mins: 24, delay: 6, km: 11.2, live: true },
            ],
          };
        }
        const items = await Promise.all(
          routes.map(async (r) => {
            try {
              const b = await geocode(r.to);
              const a = r.from ? await geocode(r.from) : { lat: s.LATITUDE, lon: s.LONGITUDE };
              const res = r.mode === 'public' ? await routePublic(ctx, a, b) : r.mode === 'car' ? await routeCar(a, b) : await routeOsm(ctx, r.mode, a, b);
              return { ...r, ...res, at: Date.now() };
            } catch (e) {
              return { ...r, error: e.message };
            }
          }),
        );
        return { demo: false, items };
      },
      Math.max(2, s.COMMUTE_REFRESH_MIN) * 60000,
      { visibleOnly: true },
    );

    const p = ctx.panel({ tint: 'cyan' });
    const list = h('div', { class: 'rows scroll-y' });
    p.body.append(list);
    let data = null;
    const mins = (ms) => Math.max(0, Math.round(ms / 60000));
    function row(r) {
      const mode = COMMUTE_MODES[r.mode] || COMMUTE_MODES.car;
      const ic = h('span', { class: 'tile-icon' }, icon(r.error ? 'alert' : mode.ic));
      if (r.error)
        return h(
          'div',
          { class: 'commute' },
          ic,
          h('div', null, h('div', { class: 'commute-name' }, r.name), h('div', { class: 'commute-sub' }, r.error)),
          h('span'),
        );
      const now = Date.now();
      let sub, total, arrive;
      if (r.mode === 'public') {
        const leaveIn = mins(r.leave - now),
          delay = Math.round(r.delay || 0);
        arrive = r.arrive;
        total = mins(r.arrive - now);
        sub = [
          r.lines.length ? `${r.lines.join(' → ')} · ` : 'Walk · ',
          leaveIn ? `leave in ${leaveIn} min` : 'leave now',
          r.cancelled
            ? [' · ', h('span', { class: 'down' }, 'cancelled')]
            : delay
              ? [' · ', h('span', { class: delay > 5 ? 'down' : 'late' }, `+${delay} min`)]
              : r.live
                ? [' · ', h('span', { class: 'ontime' }, 'on time')]
                : null,
        ];
      } else {
        total = Math.round(r.mins);
        arrive = now + r.mins * 60000;
        const dist = ctx.imperial ? `${(r.km * 0.621).toFixed(1)} mi` : `${r.km.toFixed(1)} km`;
        const delay = Math.round(r.delay || 0);
        sub = [
          dist,
          ' · ',
          r.mode === 'car'
            ? r.live
              ? delay > 1
                ? h('span', { class: delay > 15 ? 'down' : delay > 5 ? 'late' : 'ontime' }, `+${delay} min traffic`)
                : h('span', { class: 'ontime' }, 'clear roads')
              : 'typical, no live traffic'
            : mode.label.toLowerCase(),
        ];
      }
      return h(
        'div',
        { class: `commute is-${r.mode}`, title: `${mode.label}${r.source ? ` · ${r.source}` : ''}` },
        ic,
        h('div', { style: { minWidth: '0' } }, h('div', { class: 'commute-name' }, r.name), h('div', { class: 'commute-sub' }, sub)),
        h('div', { class: 'commute-min' }, h('b', null, total), h('small', null, `min · ${fmt.time.format(new Date(arrive))}`)),
      );
    }
    function render() {
      if (!data) return;
      list.replaceChildren(...data.items.map(row));
      const sources = [...new Set(data.items.map((r) => r.source).filter(Boolean))];
      const carNoKey = data.items.some((r) => r.mode === 'car' && !r.error && !r.live);
      p.setMeta(
        data.demo
          ? ctx.ui.demoMeta('Add destinations in ⚙ → Commute')
          : [sources.join(' · ') || 'Commute', carNoKey ? ' · add the TOMTOM_KEY secret for traffic' : ''].join(''),
      );
    }
    ctx.subscribe(commuteFeed, (d) => {
      if (d) {
        data = d;
        render();
      }
    });
    ctx.onTick((n) => {
      if (n.getSeconds() === 0 && ctx.isVisible()) render();
    });
    p.onReload = () => commuteFeed.refresh();
  },
});

});
</script>
<script data-widget="countdown">
OMD._load("countdown", function () {
/**
 * Countdowns — days until the dates you list; with none, the weekend, the next public
 * holiday and New Year.
 */
OMD.defineWidget({
  id: 'countdown',
  name: 'Countdowns',
  icon: 'hourglass',
  group: 'Time & weather',
  settings: [['COUNTDOWNS', 'Countdowns', 'textarea', { help: '<code>Summer holiday | 2027-07-24</code>. Empty = weekend, next holiday & New Year.' }]],
  defaults: {
    COUNTDOWNS: [], // "Summer holiday | 2027-07-24". Empty → next holiday, weekend & New Year.
  },

  mount(ctx) {
    const { h, fmt, settings: s } = ctx;
    const { pipe, parseYMD, addDays, startOfDay } = ctx.util;
    const compact = !!ctx.spec.compact;
    const p = ctx.panel({ title: 'Countdown', tint: 'cyan', head: !compact, compact });
    const list = h('div', { class: `countdowns${compact ? ' is-row' : ' scroll-y'}` });
    p.body.append(list);
    let holidays = [];
    function items() {
      const today = startOfDay(new Date());
      const out = s.COUNTDOWNS.map(pipe)
        .map(([label, date]) => ({ label, date: parseYMD(date) }))
        .filter((x) => x.label && x.date);
      if (!out.length) {
        const dow = today.getDay();
        if (dow >= 1 && dow <= 5) out.push({ label: 'The weekend', date: addDays(today, 6 - dow) });
        const hol = holidays.filter((e) => e.start >= today).sort((a, b) => a.start - b.start)[0];
        if (hol) out.push({ label: hol.title, date: hol.start });
        out.push({ label: 'New Year', date: new Date(today.getFullYear() + 1, 0, 1) });
      }
      return out.filter((x) => x.date >= today).sort((a, b) => a.date - b.date);
    }
    function render() {
      const today = startOfDay(new Date());
      list.replaceChildren(
        ...items()
          .slice(0, compact ? 2 : 8)
          .map((x) => {
            const days = Math.round((x.date - today) / 864e5);
            return h(
              'div',
              { class: 'cd' },
              h('div', { class: 'cd-num' }, days === 0 ? '🎉' : days, h('small', null, days === 0 ? 'today' : days === 1 ? 'day' : 'days')),
              h('div', { class: 'cd-label' }, h('b', null, x.label), h('span', null, fmt.dateShort.format(x.date))),
            );
          }),
      );
    }
    if (!s.COUNTDOWNS.length)
      ctx.holidays().then(
        ctx.guard((list2) => {
          holidays = list2;
          render();
        }),
        () => {
          /* holidays are optional */
        },
      );
    ctx.onTick((n) => {
      if (n.getHours() === 0 && n.getMinutes() === 0 && n.getSeconds() === 2) render();
    });
    render();
  },
});

});
</script>

/**
 * Data widgets — one tile per JSON value from any API (Home Assistant, Node-RED, …).
 * "Label | JSON URL | path.to.value | unit | Authorization header (optional)";

const getPath = (obj, path) =>
  (path || '')
    .replace(/\[(\d+)\]/g, '.$1')
    .split('.')
    .filter(Boolean)
    .reduce((o, k) => (o == null ? o : o[k]), obj);

OMD.defineWidget({
  id: 'data',
  name: 'Data widgets',
  icon: 'gauge',
  group: 'Home & web',
  settings: [
    [
      'DATA_WIDGETS',

      'textarea',
      { help: '<code>Label | https://api… | path.to.value | unit | Bearer token (optional)</code>. <code>{lat}</code>/<code>{lon}</code> are replaced.' },
    ],
  ],
  defaults: {
    DATA_WIDGETS: [], // Outdoor air quality + PM2.5 are built into the Smart home widget.

  },

  mount(ctx) {

    const p = ctx.panel({ title: 'Data', icon: 'database', tint: 'violet' });
    const grid = h('div', { class: 'tiles' });
    p.body.classList.add('tiles-host');
    p.body.append(grid);
    const COLORS = ['c-accent', 'c-emerald', 'c-amber', 'c-sky', 'c-violet', 'c-crimson'];

    const feed = ctx.sharedFeed(
      'values',
      () => () =>
        Promise.all(
          s.DATA_WIDGETS.map(async (line) => {

            try {
              let j;
              try {

                j = await ctx.fetchJSON(ctx.withProxy(url));

              return { label, value: getPath(j, path), unit };

          }),

            ),
          );
        }),
      );
      p.setMeta(`Every ${s.DATA_REFRESH_MIN} min`);
    });
    p.onReload = () => feed.refresh();
  },
});

});

        h('h3', null, `Hello, ${s.EXAMPLE_NAME || 'World'}!`),
        h('p', null, 'It’s ', time, ' in ', s.LOCATION_NAME, ', ', temp, ' outside.'),
        h('div', { class: 'row' }, h('button', { class: 'cta', type: 'button', onclick: () => taps.update((n) => (n || 0) + 1) }, icon('plus'), 'Tap'), count),
        fact,
        h('small', { class: 'muted' }, `Shown ${opened.get()} time${opened.get() === 1 ? '' : 's'} on this device`),
      ),
    );

    const showTaps = () => {
      count.textContent = `${taps.get()} taps, on every screen`;
    };
    taps.onChange(showTaps); // someone tapped on another screen
    showTaps();

    // The shared once-a-second tick (also called right away).
    let up = 0;
    ctx.onTick((now) => {
      time.textContent = fmt.time.format(now);
      p.setMeta(`Up ${mmss(up++)}`);
    });

    // Data the dashboard already has: the weather feed.
    ctx.subscribe(ctx.weather.feed, (d) => {
      if (d) temp.textContent = fmt.temp(d.current.temperature_2m);
    });

    // Your own polling feed: runs only while the widget is on screen, and the panel's ↻ button
    // shows while it fails. ctx.fetchJSON falls back to the dashboard's proxy for CORS-less APIs.
    if (s.EXAMPLE_URL) {
      const feed = ctx.feed(() => ctx.fetchJSON(s.EXAMPLE_URL), s.EXAMPLE_REFRESH_MIN * 60000, { visibleOnly: true });
      ctx.subscribe(feed, (data, err) => {
        fact.textContent = err ? `⚠ ${err.message}` : JSON.stringify(data).slice(0, 140);
      });
      p.onReload = () => feed.refresh();
    }

    return () => console.info('Hello (example): removed — its tick, feed and listeners are already gone');
  },
});

});
</script>
<script data-widget="lists">
OMD._load("lists", function () {
/**
 * Lists — shopping and to-do lists the whole family edits (synced; also on phones via
 * ?view=lists and phone shortcuts, lib/lists.js). Tap to tick, hold to delete (with Undo),
 * quick-add chips for what you add often, voice input. A Todoist project shows as an
 * extra tab when the Worker has TODOIST_TOKEN (lib/integrations/todoist.js).
 */
const { uid } = OMD.util;
// Keys starting with "_" hold list metadata (e.g. _recent), not lists.
const normItem = (t) => String(t).trim().replace(/\s+/g, ' ');
/** "milk, eggs; bread" → 3 items. Spoken input also splits on "and"/"und". */
const splitItems = (text, spoken = false) =>
  String(text)
    .split(spoken ? /\s*(?:,|;|\n|\band\b|\bund\b|&)\s*/i : /\s*[,;\n]\s*/)
    .map(normItem)
    .filter(Boolean);
/** Quick-add suggestions: things you add often (or that match what you're typing), not already open. */
function listSuggestions(data, list, query = '') {
  const open = new Set((data[list] || []).filter((i) => !i.done).map((i) => i.text.toLowerCase()));
  const q = query.trim().toLowerCase();
  return Object.entries(data._recent?.[list] || {})
    .filter(([k]) => !open.has(k) && (!q || k.startsWith(q) || k.includes(` ${q}`)) && k !== q)
    .sort((a, b) => b[1].n - a[1].n || b[1].at - a[1].at)
    .slice(0, 8)
    .map(([, r]) => r.text);
}
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

OMD.defineWidget({
  id: 'lists',
  name: 'Lists',
  icon: 'list-checks',
  group: 'Family',
  state: ['lists'],
  integrations: ['todoist'],
  settings: [
    ['LISTS', 'Lists (one name per line)', 'textarea'],
    [
      'TODOIST_PROJECT',
      'Todoist project',
      'text',
      { placeholder: 'Inbox', help: 'Shown as a tab once the Worker has the <code>TODOIST_TOKEN</code> secret (README → Secrets).' },
    ],
  ],
  defaults: {
    LISTS: ['Groceries', 'To-do'],
    TODOIST_PROJECT: '', // Project name ("" = Inbox)
  },

  mount(ctx) {
    const { h, icon, settings: s } = ctx;
    const listStore = ctx.state('lists', () => {
      const seed = (arr) => arr.map((text, i) => ({ id: `seed${i}${text.length}`, text, done: false, at: 1 - i }));
      return {
        Groceries: seed(['Milk', 'Eggs', 'Sourdough bread', 'Bananas', 'Coffee beans', 'Olive oil', 'Tomatoes']),
        'To-do': seed(['Book dentist appointment', 'Renew car insurance', 'Return library books', 'Call the plumber']),
      };
    });
    function loadLists() {
      const data = listStore.get();
      for (const name of s.LISTS) if (!data[name]) data[name] = [];
      return data;
    }
    /** Add items; an item already on the list isn't duplicated (a ticked one is reopened). Remembers what was added. */
    function addListItems(list, texts) {
      const at = Date.now();
      listStore.update((d) => {
        const items = (d[list] ||= []),
          rec = ((d._recent ||= {})[list] ||= {});
        texts.forEach((text, k) => {
          const key = text.toLowerCase(),
            hit = items.find((i) => i.text.toLowerCase() === key);
          if (!hit) items.push({ id: uid(), text, done: false, at: at + k });
          else if (hit.done) {
            hit.done = false;
            hit.at = at + k;
          }
          const r = (rec[key] ||= { text: hit ? hit.text : text, n: 0 }); // keeps the item's own spelling
          r.n++;
          r.at = at;
        });
        const keys = Object.keys(rec);
        if (keys.length > 150)
          keys
            .sort((a, b) => rec[a].at - rec[b].at)
            .slice(0, keys.length - 150)
            .forEach((k) => delete rec[k]);
        return d;
      });
    }
    /** Set once this browser proved it can't do speech recognition: the mic then opens the keyboard. */
    const voiceUnavailable = ctx.local('voice-unavailable', false, { legacyKey: 'omd.voice-unavailable.v1' });
    /** Link for phones: the lists alone, big touch targets, no other widgets loading. */
    function showPhoneLink() {
      const url = new URL(`${location.pathname}?view=lists`, location.href).href;
      ctx.ui.dialog({
        title: 'Lists on your phone',
        sub: 'Scan, sign in once, then “Add to Home screen”',
        className: 'phone-card',
        content: [
          h('img', {
            class: 'qr',
            alt: 'QR code for the phone lists page',
            width: 220,
            height: 220,
            src: `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=10&data=${encodeURIComponent(url)}`,
          }),
          h('code', { class: 'phone-url' }, url),
          h(
            'small',
            { class: 'muted' },
            'Everyone on the family sign-in list can use it. Changes show up on the tablet within ~15 s. Voice and share-sheet shortcuts: README → Lists.',
          ),
        ],
      });
    }
    const todoist = {
      list: async () => (await ctx.api(`todoist/tasks?project=${encodeURIComponent(s.TODOIST_PROJECT)}`)).tasks,
      setDone: (id, done) => ctx.api(`todoist/${done ? 'close' : 'reopen'}`, { method: 'POST', body: JSON.stringify({ id }) }),
      add: (text) => ctx.api('todoist/add', { method: 'POST', body: JSON.stringify({ text, project: s.TODOIST_PROJECT }) }),
    };

    const p = ctx.panel({ tint: 'emerald' });
    let data = loadLists();
    const tabs = [...s.LISTS];
    if (!tabs.length) tabs.push('To-do');
    let active = tabs[0];
    const td = { items: [], error: null, loaded: false };
    const seg = h('div', { class: 'seg', role: 'tablist' });
    const list = h('div', { class: 'items scroll-y' });
    const quick = h('div', { class: 'quick', 'aria-label': 'Add again' });
    const undoBar = h('div', { class: 'undo-bar', role: 'status', hidden: true });
    const input = h('input', { type: 'text', placeholder: 'Add an item…', enterkeyhint: 'done', 'aria-label': 'New item', autocomplete: 'off' });
    const mic = SpeechRec
      ? h('button', { class: 'icon-btn mic rec-btn', type: 'button', 'aria-label': 'Add by voice', title: 'Add by voice' }, icon('mic'))
      : null;
    const form = h('form', { class: 'add-row' }, input, mic, h('button', { class: 'icon-btn', type: 'submit', 'aria-label': 'Add item' }, icon('plus')));
    p.body.classList.add('lists-host');
    p.body.append(tabs.length > 1 ? seg : '', list, undoBar, quick, form);

    const current = () => (active === 'Todoist' ? td.items : data[active] || (data[active] = []));
    async function syncTodoist() {
      try {
        td.items = await todoist.list();
        td.error = null;
      } catch (e) {
        td.error = e.message;
      }
      td.loaded = true;
      render();
    }
    function renderQuick() {
      const sugg = active === 'Todoist' ? [] : listSuggestions(data, active, input.value);
      quick.replaceChildren(
        ...sugg.map((t) =>
          h(
            'button',
            {
              type: 'button',
              class: 'quick-add',
              onclick: () => {
                add([t]);
                input.value = '';
                renderQuick();
              },
            },
            icon('plus'),
            t,
          ),
        ),
      );
      quick.hidden = !sugg.length;
    }
    let pressTimer = 0,
      longPressed = false;
    function itemEl(it) {
      // Hold to delete (with Undo) — a tap still ticks.
      const cancel = () => ctx.clearTimeout(pressTimer);
      return h(
        'button',
        {
          type: 'button',
          class: `item${it.done ? ' is-done' : ''}`,
          'aria-pressed': String(it.done),
          title: 'Tap to tick · hold to delete',
          onclick: () => {
            if (longPressed) {
              longPressed = false;
              return;
            }
            toggle(it);
          },
          onpointerdown: () => {
            longPressed = false;
            cancel();
            pressTimer = ctx.setTimeout(() => {
              longPressed = true;
              remove(it);
            }, 600);
          },
          onpointerup: cancel,
          onpointerleave: cancel,
          onpointercancel: cancel,
          oncontextmenu: (e) => e.preventDefault(),
        },
        h('span', { class: 'check' }, icon('check')),
        h('span', { class: 'item-text' }, it.text),
      );
    }
    // Everything ticked off: a check that draws itself in the top half, the crossed-out items below.
    // It animates only when the list becomes done, not on every sync.
    // The same element is kept across re-renders (a tick syncs a moment later), so the animation plays through.
    let allDoneShown = false,
      allDoneNode = null;
    function allDoneEl(n, animate) {
      if (!animate && allDoneNode) {
        allDoneNode.lastChild.textContent = `${n} ticked off · 🗑 clears them`;
        return allDoneNode;
      }
      const mark = h('span', { class: 'all-done-mark', 'aria-hidden': 'true' });
      mark.innerHTML = '<svg viewBox="0 0 52 52"><circle class="ring" cx="26" cy="26" r="23"/><path class="tick" d="M15.5 27l7 7 14-15"/></svg>';
      return (allDoneNode = h(
        'div',
        { class: `all-done${animate ? ' pop' : ''}`, role: 'status' },
        mark,
        h('b', null, 'All done!'),
        h('small', null, `${n} ticked off · 🗑 clears them`),
      ));
    }
    function render() {
      seg.replaceChildren(
        ...tabs.map((t) => {
          const open = (t === 'Todoist' ? td.items : data[t] || []).filter((i) => !i.done).length;
          return h(
            'button',
            {
              type: 'button',
              role: 'tab',
              class: t === active ? 'is-active' : '',
              'aria-selected': String(t === active),
              onclick: () => {
                active = t;
                if (t === 'Todoist') syncTodoist();
                render();
              },
            },
            t,
            open ? h('span', null, open) : null,
          );
        }),
      );
      const items = current()
        .slice()
        .sort((a, b) => a.done - b.done || b.at - a.at);
      const firstDone = items.findIndex((i) => i.done);
      const allDone = items.length > 0 && firstDone === 0;
      if (active === 'Todoist' && !td.loaded) list.replaceChildren(h('div', { class: 'empty' }, 'Loading Todoist…'));
      else if (active === 'Todoist' && td.error) list.replaceChildren(h('div', { class: 'empty' }, icon('alert'), `Todoist: ${td.error}`));
      else if (!items.length) list.replaceChildren(h('div', { class: 'empty' }, icon('list-checks'), 'Nothing here — add something below'));
      else
        list.replaceChildren(
          ...[
            allDone ? allDoneEl(items.length, !allDoneShown) : null,
            ...items.flatMap((it, i) => [
              i === firstDone && firstDone > 0 ? h('div', { class: 'items-sep' }, `Done · ${items.length - firstDone}`) : null,
              itemEl(it),
            ]),
          ].filter(Boolean),
        );
      list.classList.toggle('is-all-done', allDone);
      allDoneShown = allDone;
      const open = current().filter((i) => !i.done).length;
      p.setMeta(`${active} · ${open} open`);
      renderQuick();
    }
    async function toggle(it) {
      const done = !it.done,
        at = Date.now(),
        name = active;
      if (name === 'Todoist') {
        it.done = done;
        render();
        try {
          await todoist.setDone(it.id, done);
        } catch (e) {
          td.error = e.message;
        }
        return syncTodoist();
      }
      // Idempotent: "set done = X" survives being re-applied on top of someone else's edit.
      listStore.update((d) => {
        const x = (d[name] || []).find((i) => i.id === it.id);
        if (x) {
          x.done = done;
          x.at = at;
        }
        return d;
      });
    }
    let undoTimer = 0;
    function remove(it) {
      if (active === 'Todoist') return;
      const name = active;
      listStore.update((d) => {
        d[name] = (d[name] || []).filter((i) => i.id !== it.id);
        return d;
      });
      undoBar.replaceChildren(
        h('span', null, `Removed “${it.text}”`),
        h(
          'button',
          {
            type: 'button',
            onclick: () => {
              listStore.update((d) => {
                const arr = (d[name] ||= []);
                if (!arr.some((i) => i.id === it.id)) arr.push(it);
                return d;
              });
              undoBar.hidden = true;
            },
          },
          icon('undo'),
          'Undo',
        ),
      );
      undoBar.hidden = false;
      ctx.clearTimeout(undoTimer);
      undoTimer = ctx.setTimeout(() => {
        undoBar.hidden = true;
      }, 6000);
    }
    async function add(texts) {
      if (!texts.length) return;
      if (active === 'Todoist') {
        try {
          for (const t of texts) await todoist.add(t);
        } catch (err) {
          td.error = err.message;
        }
        return syncTodoist();
      }
      addListItems(active, texts);
    }
    ctx.listen(form, 'submit', (e) => {
      e.preventDefault();
      const texts = splitItems(input.value);
      input.value = '';
      add(texts);
    });
    ctx.listen(input, 'input', renderQuick);
    if (mic) {
      // Web Speech: Chrome on Android/desktop uses Google's recogniser. Some kiosk WebViews expose the
      // API without a working backend — then the mic falls back to the keyboard's own 🎤 (Gboard).
      let rec = null,
        watchdog = 0;
      const hint = input.placeholder;
      const done = () => {
        ctx.clearTimeout(watchdog);
        rec = null;
        p.setRecording(false, mic);
        input.placeholder = hint;
      };
      const useKeyboard = (why) => {
        voiceUnavailable.set(true);
        input.focus();
        ctx.toast(`${why} — tap the keyboard's 🎤 to dictate`);
      };
      ctx.listen(mic, 'click', () => {
        if (rec) {
          try {
            rec.stop();
          } catch {
            done();
          }
          return;
        } // second tap: stop listening
        if (voiceUnavailable.get()) {
          input.focus();
          ctx.toast('Tap the keyboard’s 🎤 to dictate');
          return;
        }
        const r = new SpeechRec();
        rec = r;
        r.lang = s.LOCALE || navigator.language || 'en-GB';
        r.continuous = false;
        r.interimResults = false;
        r.maxAlternatives = 1;
        let heard = false;
        r.onresult = ctx.guard((e) => {
          const res = e.results[e.results.length - 1];
          if (heard || !res || res.isFinal === false) return; // one final result per session (Android may repeat it)
          heard = true;
          add(splitItems(res[0].transcript, true));
        });
        r.onerror = ctx.guard((e) => {
          if (e.error === 'service-not-allowed' || e.error === 'language-not-supported') useKeyboard('Voice input isn’t available in this browser');
          else if (e.error === 'not-allowed')
            ctx.toast('Microphone blocked — allow it for the dashboard (Fully Kiosk: Web Content Settings → microphone), or use the keyboard’s 🎤');
          else if (e.error === 'audio-capture') ctx.toast('No microphone found');
          else if (e.error === 'network') ctx.toast('Voice input needs an internet connection');
          else if (e.error === 'no-speech') ctx.toast('Didn’t catch that — tap 🎤 and try again');
          else if (e.error !== 'aborted') ctx.toast(`Voice input failed (${e.error})`);
          done();
        });
        r.onend = ctx.guard(() => {
          if (rec === r) done();
        });
        // Some Android builds never fire onend after an error: never leave the mic stuck red.
        watchdog = ctx.setTimeout(() => {
          try {
            r.abort();
          } catch {
            /* already over */
          }
          if (rec === r) done();
        }, 15000);
        try {
          r.start();
          p.setRecording(true, mic);
          input.placeholder = 'Listening…';
        } catch {
          done();
          useKeyboard('Voice input isn’t available here');
        }
      });
    }
    p.addAction('trash', 'Clear completed', () => {
      if (active === 'Todoist') return;
      const name = active;
      listStore.update((d) => {
        d[name] = (d[name] || []).filter((i) => !i.done);
        return d;
      });
    });
    if (ctx.cloud && !ctx.phoneView) p.addAction('smartphone', 'Open on your phone', showPhoneLink);
    // Quick-add chips only on a tall widget, or on a big screen with room for ~6 rows beside them.
    // Measured without the chips, so it never flips back and forth.
    const QUICK_H = 44,
      MIN_ROWS = 6,
      TALL = 520;
    const fit = () => {
      const row = (list.querySelector('.item')?.offsetHeight || 44) + 6;
      const fixed = (seg.isConnected ? seg.offsetHeight + 8 : 0) + form.offsetHeight + 8 + QUICK_H;
      const roomy = p.body.clientHeight - fixed >= row * MIN_ROWS;
      const bigScreen = innerWidth >= 1280 && innerHeight >= 800;
      p.body.classList.toggle('is-short', !(p.body.clientHeight >= TALL || (bigScreen && roomy)));
    };
    ctx.observeResize(p.body, fit);
    ctx.listen(window, 'resize', fit);
    listStore.onChange(() => {
      data = loadLists();
      render();
    });
    // Todoist: a tab when the Worker has TODOIST_TOKEN (lib/integrations/todoist.js).
    let hasTodoist = false;
    ctx.status('todoist').then(
      ctx.guard((st) => {
        if (!st.configured) return;
        hasTodoist = true;
        tabs.push('Todoist');
        if (tabs.length === 2 && !seg.isConnected) list.before(seg);
        syncTodoist();
        ctx.setInterval(syncTodoist, 5 * 60000);
      }),
    );
    p.onReload = () => {
      data = loadLists();
      if (hasTodoist) syncTodoist();
      render();
    };
    render();
    ctx.raf(fit);
  },
});

});
</script>
<script data-widget="markets">
OMD._load("markets", function () {
/**
 * Markets — crypto from CoinGecko (no key) and stocks through the backend's Finnhub
 * integration (Worker secret FINNHUB_TOKEN, lib/integrations/finnhub.js).
 */
const sparkPath = (values, w = 64, hgt = 24) => {
  if (!values?.length) return '';
  const min = Math.min(...values),
    max = Math.max(...values),
    span = max - min || 1;
  return values.map((v, i) => `${((i / (values.length - 1)) * w).toFixed(1)},${(hgt - 2 - ((v - min) / span) * (hgt - 4)).toFixed(1)}`).join(' ');
};
const symbols = (list, fn) =>
  list
    .join(',')
    .split(',')
    .map((x) => fn(x.trim()))
    .filter(Boolean);

OMD.defineWidget({
  id: 'markets',
  name: 'Markets',
  icon: 'trending-up',
  group: 'Fitness & markets',
  integrations: ['finnhub'],
  settings: [
    [
      ['CRYPTO', 'Crypto (CoinGecko ids)', 'textarea'],
      ['STOCKS', 'Stocks (tickers)', 'textarea', { help: 'Needs the <code>FINNHUB_TOKEN</code> Worker secret.' }],
    ],
    ['CURRENCY', 'Currency', 'text'],
  ],
  defaults: {
    CRYPTO: ['bitcoin', 'ethereum', 'solana'], // CoinGecko ids — no key needed
    STOCKS: [], // e.g. ["AAPL", "MSFT"] — needs the FINNHUB_TOKEN Worker secret
    CURRENCY: 'usd',
  },

  mount(ctx) {
    const { h, icon, svg, fmt, settings: s } = ctx;
    const p = ctx.panel({ tint: 'emerald', meta: '24h change' });
    const list = h('div', { class: 'rows scroll-y' });
    p.body.append(list);
    const syms = symbols(s.STOCKS, (x) => x.toUpperCase());
    let stocksMissing = false;
    const feed = ctx.sharedFeed(
      'quotes',
      () => async () => {
        const jobs = [];
        const ids = symbols(s.CRYPTO, (x) => x.toLowerCase());
        if (ids.length) {
          jobs.push(
            ctx
              .fetchJSON(
                `https://api.coingecko.com/api/v3/coins/markets?vs_currency=${encodeURIComponent(s.CURRENCY)}&ids=${ids.join(',')}&sparkline=true&price_change_percentage=24h`,
              )
              .then((all) =>
                all
                  .sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id))
                  .map((c) => ({
                    name: c.name,
                    sym: c.symbol,
                    img: c.image,
                    price: c.current_price,
                    change: c.price_change_percentage_24h,
                    spark: (c.sparkline_in_7d?.price || []).filter((_, i) => i % 4 === 0),
                    currency: s.CURRENCY,
                  })),
              ),
          );
        }
        if (syms.length) {
          jobs.push(
            ctx.status('finnhub').then((st) => {
              stocksMissing = !st.configured;
              if (!st.configured) return [];
              return ctx
                .api(`finnhub/quotes?symbols=${encodeURIComponent(syms.join(','))}`)
                .then((j) => j.quotes.map((q) => ({ name: q.sym, sym: q.sym, price: q.price, change: q.change, spark: null, currency: 'usd' })));
            }),
          );
        }
        const res = await Promise.allSettled(jobs);
        const items = res.flatMap((r) => (r.status === 'fulfilled' ? r.value : []));
        if (!items.length && res.some((r) => r.status === 'rejected')) throw res.find((r) => r.status === 'rejected').reason;
        return items;
      },
      5 * 60000,
      { visibleOnly: true },
    );

    // Reuse logo <img> nodes across refreshes so they're never re-requested.
    const logos = new Map();
    const logo = (src) => {
      if (!logos.has(src)) logos.set(src, h('img', { src, alt: '', loading: 'lazy' }));
      return logos.get(src);
    };
    ctx.subscribe(feed, (items, err) => {
      if (!items) {
        if (err) list.replaceChildren(h('div', { class: 'empty' }, icon('alert'), 'Market data unavailable'));
        return;
      }
      if (!items.length) {
        list.replaceChildren(h('div', { class: 'empty' }, icon('trending-up'), 'Add CRYPTO or STOCKS (+ the FINNHUB_TOKEN secret)'));
        return;
      }
      list.replaceChildren(
        ...items.map((m) => {
          const up = (m.change || 0) >= 0;
          return h(
            'div',

<script data-widget="meals">
OMD._load("meals", function () {
/**
 * Meal plan — the next seven dinners; tap a day to edit (synced, shared state "meals").
 */
OMD.defineWidget({
  id: 'meals',
  name: 'Meals',
  icon: 'utensils',
  group: 'Family',
  state: ['meals'],

  mount(ctx) {
    const { h, fmt } = ctx;
    const { ymd, addDays, startOfDay } = ctx.util;
    const mealStore = ctx.state('meals', () => {
      const m = {};
      ['Pasta night', 'Tacos', 'Veggie stir-fry', 'Chicken curry', 'Pizza Friday', 'BBQ', 'Roast dinner'].forEach((meal, i) => {
        m[ymd(addDays(new Date(), i))] = meal;
      });
      return m;
    });
    function loadMeals(m = mealStore.get()) {
      m ||= {};
      const cutoff = ymd(addDays(new Date(), -14));
      for (const k of Object.keys(m)) if (k < cutoff) delete m[k];
      return m;
    }

    const p = ctx.panel({ title: 'Meal plan', tint: 'amber', meta: 'This week' });
    const list = h('div', { class: 'meals scroll-y' });
    p.body.append(list);
    let editing = null;
    function render() {
      const meals = loadMeals();
      const today = startOfDay(new Date());
      list.replaceChildren(
        ...Array.from({ length: 7 }, (_, i) => {
          const d = addDays(today, i),
            key = ymd(d);
          const label = h('div', { class: 'meal-day' }, i === 0 ? 'Today' : fmt.weekdayShort.format(d));
          if (editing === key) {
            const input = h('input', {
              type: 'text',
              value: meals[key] || '',
              placeholder: 'What’s for dinner?',
              'aria-label': `Meal for ${fmt.weekday.format(d)}`,
            });
            const commit = () => {
              if (editing !== key) return;
              editing = null;
              const text = input.value.trim();
              mealStore.update((raw) => {
                const m = loadMeals(raw);
                if (text) m[key] = text;
                else delete m[key];
                return m;
              });
            };
            input.onkeydown = ctx.guard((e) => {
              if (e.key === 'Enter') commit();
              if (e.key === 'Escape') {
                editing = null;
                render();
              }
            });
            input.onblur = ctx.guard(commit);
            ctx.setTimeout(() => input.focus(), 0);
            return h('div', { class: `meal${i === 0 ? ' is-today' : ''}`, role: 'button', tabindex: '0' }, label, input);
          }
          return h(
            'div',
            {
              class: `meal${i === 0 ? ' is-today' : ''}`,
              role: 'button',
              tabindex: '0',
              onclick: () => {
                editing = key;
                render();
              },
            },
            label,
            h('div', { class: `meal-name${meals[key] ? '' : ' is-empty'}` }, meals[key] || 'Tap to plan'),
          );
        }),
      );
    }
    mealStore.onChange(() => {
      if (!editing) render();
    });
    ctx.onTick((n) => {
      if (n.getHours() === 0 && n.getMinutes() === 0 && n.getSeconds() === 1) render();

    p.onReload = render;
    render();

<script data-widget="news">
OMD._load("news", function () {
/**
 * News (RSS / Atom) — Headlines, and the news ticker along the bottom of a screen.
 * Two widgets, one feed: both come from this folder and share it (ctx.sharedFeed).
 * Feeds without CORS headers go through the proxy, or rss2json.com as a fallback.
 */
const firstImg = (html) => /<img[^>]+src=["']([^"']+)/i.exec(html || '')?.[1];
function parseNews(text, source) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('Not an RSS/Atom feed');
  return [...doc.querySelectorAll('item, entry')]
    .map((n) => {
      const child = (name) => [...n.children].find((c) => c.localName === name);
      const title = child('title')?.textContent?.trim();
      const dateText = (child('pubDate') || child('published') || child('updated') || child('date'))?.textContent;
      const media =
        [...n.getElementsByTagNameNS('*', 'thumbnail'), ...n.getElementsByTagNameNS('*', 'content')].find((c) => c.getAttribute('url'))?.getAttribute('url') ||
        [...n.getElementsByTagName('enclosure')].find((e) => /^image\//.test(e.getAttribute('type') || ''))?.getAttribute('url') ||
        firstImg((child('description') || child('content') || child('summary') || child('encoded'))?.textContent);
      return title ? { title, source, date: dateText ? new Date(dateText) : null, image: media } : null;
    })
    .filter(Boolean);
}
function demoNews() {
  const now = Date.now();
  return [
    'City council approves new riverside cycle path',
    'Local bakery wins national sourdough award',
    'Weekend forecast: sunshine returns after a week of showers',
    'Library extends opening hours for exam season',
    'New tram line to the airport opens next month',
    'Community garden celebrates tenth harvest festival',
    'Researchers unveil quieter, cheaper heat pump design',
  ].map((title, i) => ({ title, source: 'Demo', date: new Date(now - (i + 1) * 47 * 60000), image: null }));
}
const newsSources = (s) =>
  s.NEWS_FEEDS.map((line) => {
    const x = OMD.util.pipe(line);
    return x.length > 1 ? { name: x[0], url: x[1] } : { name: OMD.util.hostOf(x[0]), url: x[0] };
  }).filter((src) => /^(https?:|data:)/i.test(src.url));

/** The one news feed of the page (Headlines + ticker). */
function newsFeed(ctx) {
  const s = ctx.settings;
  return ctx.sharedFeed(
    'news',
    () => {
      async function loadNewsSource(src) {
        try {
          return parseNews(await ctx.fetchText(src.url), src.name);
        } catch (err) {
          if (!s.NEWS_RSS2JSON) throw err;
          const d = await ctx.fetchJSON(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`);
          if (d.status !== 'ok') throw new Error(d.message || 'rss2json error');
          return d.items.map((it) => ({
            title: it.title,
            source: src.name,
            date: it.pubDate ? new Date(`${it.pubDate.replace(' ', 'T')}Z`) : null,
            image: it.thumbnail || it.enclosure?.link || firstImg(it.description),
          }));
        }
      }
      return async () => {
        const results = await Promise.allSettled(newsSources(s).map(loadNewsSource));
        let items = results.flatMap((r) => (r.status === 'fulfilled' ? r.value : []));
        if (!items.length) return { items: demoNews(), demo: true, errors: results.filter((r) => r.status === 'rejected').length };
        const seen = new Set();
        items = items.filter((it) => {
          const k = it.title.toLowerCase();
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
        items.sort((a, b) => (b.date || 0) - (a.date || 0));
        return { items: items.slice(0, 60), demo: false };
      };
    },
    s.NEWS_REFRESH_MIN * 60000,
    { visibleOnly: true },
  );
}

const NEWS_SETTINGS = ['NEWS_FEEDS', 'NEWS_RSS2JSON', 'NEWS_REFRESH_MIN'];

  defaults: {

  },

  mount(ctx) {
    const { h, fmt } = ctx;
    const p = ctx.panel({ title: 'Headlines', tint: 'crimson' });
    const feed = newsFeed(ctx);
    const list = h('div', { class: 'news scroll-y' });
    p.body.append(h('div', { class: 'frame', style: { background: 'transparent', boxShadow: 'none' } }, ctx.ui.skeleton('list')));
    let data = null,
      lead = 0;
    const bg = (url) => `url("${url.replace(/"/g, '%22')}")`;
    function render() {
      if (!data) return;
      const withImg = data.items.slice(0, 8).filter((it) => it.image);
      const leadItem = withImg.length ? withImg[lead % withImg.length] : null;
      const rest = data.items.filter((it) => it !== leadItem).slice(0, 30);
      list.replaceChildren(
        leadItem
          ? h(
              'div',
              { class: 'news-lead', style: { backgroundImage: bg(leadItem.image) } },
              h(
                'div',
                null,
                h('div', { class: 'news-src' }, h('b', null, leadItem.source), leadItem.date ? ` · ${fmt.timeAgo(leadItem.date)}` : ''),
                h('h3', null, leadItem.title),
              ),
            )
          : null,
        ...rest.map((it) =>
          h(
            'div',
            { class: 'news-item' },
            h(
              'div',
              { style: { minWidth: '0' } },
              h('h3', null, it.title),
              h('div', { class: 'news-src' }, h('b', null, it.source), it.date ? ` · ${fmt.timeAgo(it.date)}` : ''),
            ),
            it.image ? h('div', { class: 'news-thumb', style: { backgroundImage: bg(it.image) } }) : null,
          ),
        ),
      );
      if (list.parentNode !== p.body) p.body.replaceChildren(list);
      p.setMeta(
        data.demo
          ? ctx.ui.demoMeta(newsSources(ctx.settings).length ? 'Feeds unreachable' : 'Add NEWS_FEEDS')
          : [...new Set(data.items.map((i) => i.source))].slice(0, 3).join(' · '),
      );
    }
    ctx.subscribe(feed, (d) => {
      if (d) {
        data = d;
        render();
      }
    });
    ctx.setInterval(() => {
      lead++;
      render();
    }, 20000);
    p.onReload = () => feed.refresh();
  },
});

OMD.defineWidget({

      track.replaceChildren(

              h('b', null, it.source),

      ctx.raf(() => track.style.setProperty('--dur', `${Math.max(30, Math.round(track.scrollWidth / 70))}s`));
