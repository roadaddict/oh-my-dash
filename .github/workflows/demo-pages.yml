name: Demo on GitHub Pages

# Publishes a static demo build (demo/config.js, local mode, no Worker) to GitHub Pages.
# This file is mirrored to the public repo with everything else, but only runs there: the
# private repo can't (or shouldn't) serve Pages, so the job is skipped wherever the repo is private.
# One-time setup in the public repo: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The build only uses Node's own modules, so no npm ci.
      - run: node scripts/build.mjs --config demo/config.js --out _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
